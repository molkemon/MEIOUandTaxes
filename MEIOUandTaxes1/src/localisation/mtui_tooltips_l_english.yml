 mtui_tb_plus:0 "+"
 mtui_tb_minuspad:0 "£5px£"
 mtui_tb_pop_tt:0 "§YPopulation§!: §Y[mtui_V_pop]k§!\n§lPeasants§! [This.mtui_pop_sf.GetValue]k, §YNomads§! [This.mtui_pop_nm.GetValue]k, §TResidents§! [This.mtui_pop_re.GetValue]k\n§CBurghers§! [This.mtui_pop_bg.GetValue]k, §ONobles§! [This.mtui_pop_no.GetValue]k, §AClergy§! [This.mtui_pop_cl.GetValue]k[mtui_tb_pop_tt_guide]"
 mtui_tb_pop_tt_guide_on:0 "\n--------------------------------------\nEveryone living in provinces we own directly (subjects not included).\n\n§GWhy it matters:§! Population is the workforce for our farms, mines and industries, the base of every tax, and the source of manpower.\n\n§OHow to change it:§! Raise needs fulfillment (food first) so births outpace deaths, keep wages attractive to draw migrants, and build amenities in growing cities."
 mtui_tb_growth_tt:0 "§YPopulation change last year§!: §Y[mtui_V_growth]k§!\nNatural growth   £2px£§Y[mtui_tb_natsign][This.mtui_nat.GetValue]k§!\nImmigration       £1px£§G+[This.mtui_imm.GetValue]k§!\nEmigration         £1px£§R£5px£-[This.mtui_emi.GetValue]k§![mtui_tb_growth_tt_guide]"
 mtui_tb_growth_tt_guide_on:0 "\n--------------------------------------\nNatural growth (births minus deaths, negative when more people die than are born), plus people who moved in minus people who moved out, over the last yearly census (population is simulated yearly). People moving between two of our own provinces count as emigration in one and immigration in the other, so those two lines are mostly a measure of how much our people move around.\n\n§GWhy it matters:§! A shrinking population means fewer workers, falling output and lower taxes over time.\n\n§OHow to change it:§! Births equal deaths at about 72% life fulfillment, so feed your people. Labour shortages raise wages, which attract immigrants."
 mtui_tb_wealth_tt:0 "§YPopulation wealth§!: §Y[mtui_V_wealth]k§!¤[mtui_tb_wealth_tt_guide]"
 mtui_tb_wealth_tt_guide_on:0 "\n--------------------------------------\nCash held by all our population classes. It does not include the state treasury, property values or stockpiled goods.\n\n§GWhy it matters:§! Wealthy classes buy more goods (more excise income), invest in their provinces and keep needs fulfilled through bad years. Wealthy elites also gain power.\n\n§OHow to change it:§! Raise incomes: productive properties, good trade rank and moderate taxes. Wealth drains when classes run net-negative income."
 mtui_tb_reach_tt:0 "§YState Reach§!: §Y[mtui_V_reach]%§! ([Prov_BUPowChange])\n[BUPowerChangeTitle][BUPower_ChangeBUTax][BUPower_ChangeBUStructure][BUPowerChange_Revitalise][BUPowerChange_Advisors][BUPowerChange_Develop][BUPowerChange_NIs][mtui_tb_reach_tt_guide]"
 mtui_tb_reach_tt_guide_on:0 "\n--------------------------------------\nHow well our own officials can enforce the government's will across the realm, independent of local power brokers. In brackets: its change at the last yearly census.\n\n§GWhy it matters:§! Higher reach strongly improves how much tax we can collect, but brings more corruption. Some nationwide reforms need a minimum average reach.\n\n§OHow to change it:§! Expand the bureaucracy, pass administrative rights and reforms, appoint advisors, and develop provinces. Newly conquered land often starts low."
 mtui_tb_stab_tt:0 "§YStability§!: progress to the next level §Y[mtui_V_stab]%§! ([Stab_Change])\nHow far we are towards the next Stability level (the level itself, -3 to +3, is the number beside the stability icon in the top bar).[mtui_tb_stab_tt_guide]"
 mtui_tb_stab_tt_guide_on:0 "\n--------------------------------------\nProgress moves every month. At 100% Stability rises by one level, at 0% it drops by one.\n\n§GWhy it matters:§! Stability reduces unrest and is required by many reforms and actions.\n\n§OHow to change it:§! Anything that lowers the stability cost modifier speeds up progress: ideas, advisors, government reforms and loyal estates. Tax relief and grain doles grant progress directly."
 mtui_tb_corrupt_tt:0 "§YProvincial corruption§!: [mtui_C_corrupt] ([Prov_BULoyChange])\nThe average §Yprovincial corruption§!, in brackets its change at the last yearly census. (The §Ystate corruption§! of the central government is the number beside the corruption icon in the top bar.)\n\n§YSources of Corruption§!\n - £estate_greater_nobles_icon_small£[Prov_Noble_P]: §R+[GV_Crpt_NO]%§! £loc_corruption£\n - £estate_city_burghers_icon_small£ Burghers: §R+[GV_Crpt_BG]%§! £loc_corruption£\n - £estate_church_icon_small£ Clergy: §R+[GV_Crpt_CL]%§! £loc_corruption£\n - £estate_bureaucracy_icon_small£ State: §R+[GV_Crpt_State]%§! £loc_corruption£\n - £estate_bureaucracy_icon_small£ Laws: §R+[GV_Crpt_Reform]%§! £loc_corruption£\n - £estate_bureaucracy_icon_small£ State Property: §R+[GV_Crpt_StateP]%§! £loc_corruption£\n\n§YSource Multipliers (in order)§!\n - £loc_autonomy£ Autonomy: §R[GV_Crpt_LA]x§!\n - £loc_cash_no£ Wages: §R[GV_Crpt_Wages]x§! (scaled by §MState Reach§! £estate_bureaucracy_icon_small£)\n - £loc_policies£ Other: §R[GV_Crpt_Other]x§!\n--------------------------------------\n§YSources of Corruption from Laws:§!\n[Crpt_Reform_Sources_BUOffice][Crpt_Reform_Sources_BUFarm][Crpt_Reform_Sources_BUTenure][Crpt_Reform_Sources_BUHierarchy][Crpt_Reform_Sources_BUHire][Crpt_Reform_Sources_BUExams][Crpt_Reform_Sources_BUOversight][Crpt_Reform_Sources_BUCourts][Crpt_Reform_Sources_BURotate][Crpt_Reform_Sources_CrptRecall][Crpt_Reform_DifficultyLevel]  - Current State Reach: §Yx [GV_Prov_BUPow]% ^2§!\n  - Balancing factor: §Gx 0.8§! (to be removed)\n\n Provincial corruption redirects the same percentage of tax and property income to the elites before any expenses. High provincial corruption can bankrupt a nation and destroy state armies. State reach being squared means that at low state reach corruption from laws in negligable whilst quickly becoming the largest factor to corruption as it climbs higher. The provincial corruption number here is an average of your provinces provincial corruption, it does not do anything by itself all effects applied locally with the local level of provincial corruption.[mtui_tb_corrupt_tt_guide]"
 mtui_tb_corrupt_tt_guide_on:0 "\n--------------------------------------\nProvincial corruption: officials in the provinces diverting taxes and property income to the elites before the state sees it.\n\n§GWhy it matters:§! High provincial corruption can bankrupt the state and starve its armies; state corruption raises power costs and weakens the country. Both feed each other.\n\n§OHow to change it:§! Pay officials better (wage reforms), keep state reach in check (corruption grows with its square), recall corrupt officials, keep elites loyal and the ruler's authority high."
 mtui_tb_income_tt:0 "§YYearly revenue§!: §G[mtui_V_income]§!¤\n§YDirect taxation§!                          £1px£§G[GVA_TaxD_Direct]§!¤\n  Rents                                     £2px£§G[GVA_TaxD_Rents]§!¤\n  Land tax                                 £1px£§G[GVA_TaxD_Land]§!¤\n  Property tax                            £1px£§G[GVA_TaxD_PropertyBU]§!¤\n  Poll tax                                  £2px£§G[GVA_TaxD_Poll]§!¤\n  Chattel tax                              §G[GVA_TaxD_Chattel]§!¤\n  Inheritance tax                        £2px£§G[GVA_TaxD_Inheritance]§!¤\n  State property (net)                  §G[GVA_TaxD_BUProperty]§!¤\n§YIndirect taxation§!                        £1px£§G[GVA_TaxD_Indirect]§!¤\n  Fees                                       §G[GVA_TaxD_Fees]§!¤\n  Tariffs                                    §G[GVA_Tariff_Income]§!¤\n  Excises (salt, substances)          £2px£§G[GVA_TaxD_ExciseBU]§!¤\n  Industry duties                        £2px£§G[GVA_TaxD_Industry]§!¤\n     §gof which tolls§!                       £1px£§G[GVA_TaxD_TollBU]§!¤\n     §gof which timber§!                    §G[GVA_TaxD_TimberBU]§!¤\n     §gof which alcohol§!                   §G[GVA_TaxD_AlcoholBU]§!¤\n  Obligations                             §G[GVA_TaxD_Obligations]§!¤\n  Other (commerce, tributes...)   £2px£§G[GVA_MTUI_OtherIndirect]§!¤\n§YSpecial income§!                          §G[GVA_MTUI_Special]§!¤\n  Teutonic holdings                    §G[GVA_TaxD_Teuton]§!¤\n  Imperial taxes                         £2px£§G[GVA_TaxD_HRE]§!¤\n  Knight holdings                       §G[GVA_TaxD_Knights]§!¤\n  Trade posts                             §G[GVA_Post_Fees]§!¤\n  Lost to tax farming                  £3px£§R[GVA_TaxD_Farming]§!¤\n  Lost to corruption                   £3px£§R[GVA_TaxD_Corruption]§!¤\n--------------------------------------\n§YRevenue§!                                   £2px£§G[GVA_TaxD_Total]§!¤[mtui_tb_income_tt_guide]"
 mtui_tb_income_tt_guide_on:0 "\n--------------------------------------\nWhat the state collected at the last yearly census, line by line: direct taxes on people and property, indirect taxes on goods, trade and services, and special income, minus what tax farmers and corrupt officials kept.\n\n§GWhy it matters:§! Revenue pays for the bureaucracy, the army, infrastructure and any interest on loans. It is also the base of the military budget.\n\n§OHow to change it:§! Grow population wealth, raise state reach, set tax rights, build trade and fight corruption."
 mtui_tb_expense_tt:0 "§YYearly expenses§!: §R[mtui_V_expense]§!¤\n§YExpenses§!                          £2px£§R[GVA_Realm_Expenses]§!¤\n  Officials' wages               £1px£§R[GVA_Admin_CostUni]§!¤\n  Military maintenance       §R[GVA_Mil_ManpowerExpenses]§!¤\n  Military recruitment        £1px£§R[GVA_BU_SpendMPBuild]§!¤\n  State property (net loss)   £2px£§R[GVA_TaxD_BUPropertyNeg]§!¤\n  Infrastructure                  §R[GVA_Infra_StateSpend]§!¤\n  Grain dole                     £3px£§R[GVA_Class_IncomeDole]§!¤\n  Colonial subsidies           £1px£§R[GVA_Colonial_SubsidyDisp]§!¤[mtui_tb_expense_tt_guide]"
 mtui_tb_expense_tt_guide_on:0 "\n--------------------------------------\nEverything the state paid out of the treasury at the last yearly census. Loan interest and one-off costs are not included.\n\n§GWhy it matters:§! If expenses exceed revenue the treasury drains and loans follow.\n\n§OHow to change it:§! Adjust the military budget and infrastructure funding, or reform the administration."
 mtui_tb_milbudget_tt:0 "§YMilitary budget§!: §Y[mtui_V_milbudget]%§! of tax income\nActual yearly spending: §R[GV_BU_SpendMP]§!¤[mtui_tb_milbudget_tt_guide]"
 mtui_tb_milbudget_tt_guide_on:0 "\n--------------------------------------\nThe share of yearly tax income allowed for recruiting and maintaining state manpower (levies, volunteers, conscripts). Changes apply next year.\n\n§GWhy it matters:§! State manpower costs money, unlike manpower provided by the estates, and it becomes more important as military reforms advance.\n\n§OHow to change it:§! Set it under National Military, Modify State Recruitment Budget."
 mtui_tb_authority_tt:0 "§YAuthority§!: [mtui_C_authority]\n§Y[Root.Monarch.GetTitle] [Root.Monarch.GetName] [Root.Monarch.Dynasty.GetName]§!'s Skill\n £adm£ [GV_Ruler_SkillADM] £dip£ [GV_Ruler_SkillDIP] £mil£ [GV_Ruler_SkillMIL]\n\n§YRuler Impact§!: [Ruler_ImpactCol]\n  - Ruler Authority: §Y[GV_Ruler_AuthRuler]§! £loc_loyalty£ (change of §Y[GV_Ruler_AuthRulerChange]§! yearly, towards resting point of §Y[GV_Ruler_AuthRulerRest]§!)\n[RulerPower_Base][RulerPower_Personality][RulerPower_GovtReforms][RulerPower_NIs][RulerPower_representation_ideas_5][RulerPower_bureaucracy_ideas_3]\n  - Institutional Authority: §Y[GV_Ruler_AuthInstitution]§! £loc_stability£ (change of §Y[GV_Ruler_AuthInstitutionChange]§! yearly, towards resting point of §Y[GV_Ruler_AuthInstitutionRest]§!)\n[InstPower_Base][InstPower_Personality][InstPower_GovtReforms][InstPower_NIs][InstPower_representation_ideas_5][InstPower_bureaucracy_ideas_3]\n§YExecutive Power§!: £loc_diplomatic£  [GV_Ruler_SkillScaled] ([Ruler_PowerCol])\n £adm£ [GV_Ruler_ADM] £dip£ [GV_Ruler_DIP] £mil£ [GV_Ruler_MIL]\n  - Power Void: §R+[GV_Ruler_CrptImpact]§! £icon_corruption_small£\n\nExecutive Authority represents the potential power of the executive over the state, and the ability to exert that power. Absolutist rule can empower strong leaders and unleash their potential, while strong institutions or representative rule can help prevent a weak leader from unleashing instability and chaos. Executive authority also has influences on how many reforms can be enacted at the same time.\n\nThe capacity of the ruler to impact the realm is summed as the average of Ruler Authority and inverse Institutional Authority. Lower Ruler Impact will mean a more reliable power output, at the cost of nullifying the potential benefits of a strong ruler.[mtui_tb_authority_tt_guide]"
 mtui_tb_authority_tt_guide_on:0 "\n--------------------------------------\nThe executive weight of the ruler and the institutions behind the throne. It comes mostly from the ruler's skills.\n\n§GWhy it matters:§! Many rights and privileges can only be changed with enough Authority (roughly 40-65%), and a strong ruler limits corruption.\n\n§OHow to change it:§! A capable ruler or regent, advisors, and government reforms and ideas that strengthen the ruler."
 mtui_tb_autonomy_tt:0 "§YAverage autonomy§!: §Y[mtui_V_autonomy]%§![mtui_tb_autonomy_tt_guide]"
 mtui_tb_autonomy_tt_guide_on:0 "\n--------------------------------------\nThe average autonomy of our provinces, a rough gauge of how efficiently we administer the realm.\n\n§GWhy it matters:§! By itself it mostly gates certain reforms, but high autonomy signals weak control and poor taxation.\n\n§OHow to change it:§! Driven by estate power and loyalty, bureaucratic reforms, centralisation and communication efficiency."
 mtui_tb_property_tt:0 "§YState property§!: §Y[mtui_V_property]%§! of cap\nThe State owns rights to §G[GV_StatePropertyTotal]§! units of a countrywide total property of §G[GV_PropertyTotal]§! owned by all classes together.\nThe state owns §G[GV_StatePropertyPercTotal]%§! of the total property.\n\nWith §G[GV_StatePropertyTotalModified]§! of max. §G[GV_StatePropertyCapacity]§! units of property, the state controls §G[GV_StatePropertyPercCap]%§! of the possible State Property Ownership. The State Property unmodified is §G[GV_StatePropertyTotal]§! and modified §G[GV_StatePropertyTotalModified]§!.\n\nYour State property capacity is calculated from:\n§G[GV_Modi_StatePropertyFlat]§! x §G[GV_Modi_StatePropertyPerc]§! = §G[GV_StatePropertyCapacity]§!\n\nCalculation for each modified property:\n§G[GV_Modi_StatePropertyAgriculture]§! x Agriculture Property = §G[GV_StatePropertyAgriculture]§!\n§G[GV_Modi_StatePropertyForestry]§! x Forestry Property = §G[GV_StatePropertyForestry]§!\n§G[GV_Modi_StatePropertyExtraction]§! x Extraction Property = §G[GV_StatePropertyExtraction]§!\n§G[GV_Modi_StatePropertyFishery]§! x Fishery Property = §G[GV_StatePropertyFishery]§!\n§G[GV_Modi_StatePropertyIndustrial]§! x Industrial Property = §G[GV_StatePropertyIndustrial]§!\n§G[GV_Modi_StatePropertyCommercial]§! x Commercial Property = §G[GV_StatePropertyCommercial]§!\n§G[GV_Modi_StatePropertyAcademic]§! x Academic Property = §G[GV_StatePropertyAcademic]§![mtui_tb_property_tt_guide]"
 mtui_tb_property_tt_guide_on:0 "\n--------------------------------------\nHow much of the property the state may own (fields, mines, workshops) we already hold.\n\n§GWhy it matters:§! State property earns income directly for the treasury but adds to corruption and has to be managed.\n\n§OHow to change it:§! Buy, confiscate or grant property through the state and commoner interactions."
 mtui_tb_est_no_tt:0 "§YNobles§!\nLoyalty: [mtui_C_no_loy] ([Prov_NOLoyChange])   Power: §Y[mtui_V_no_pow]%§! ([Prov_NOPowChange])"
 mtui_tb_est_no_off_tt:0 "§YNobles§!\nThe nobles do not exist in our realm: they have neither power nor loyalty, so there is nothing to manage."
 mtui_tb_no_loy_tt:0 "§YNobles: loyalty§!: [mtui_C_no_loy] ([Prov_NOLoyChange])[mtui_tb_no_loy_tt_guide]"
 mtui_tb_no_loy_tt_guide_on:0 "\n--------------------------------------\nHow content this elite is with our government (in brackets: the change at the last yearly census). It drifts towards 50 and is nudged by our relations with them.\n\n§GWhy it matters:§! Loyal elites cooperate on taxes, provide more levies and volunteers, and are less corrupt. Disloyal, powerful elites can start a civil war.\n\n§OHow to change it:§! Grant privileges and favours, align the cabinet with their interests, and avoid hostile acts (seizing land, cutting their power)."
 mtui_tb_no_pow_tt:0 "§YNobles: power§!: §Y[mtui_V_no_pow]%§! ([Prov_NOPowChange])\nResting [Prov_Noble_P] Power: §Y[GV_Modi_NOPowerRest]%§!\n[NOPowerRest_NOGov][NOPowerRest_NOObl][NOPowerRest_NOSer][NOPowerRest_NOSeigneurial][NOPowerRest_NOProcessing][NOPowerRest_NOGame][NOPowerRest_NOForestry][NOPowerRest_NOHierarchy][NOPowerRest_BGCivic][NOPowerChangeTitle][NOPowerChange_RoyalConsort][NOPowerChange_StrategicMarriage][NOPowerChange_Advisors][NOPowerChange_Promotion][NOPowerChange_DemoteLords]\nPower from Wealth modifiers: §Y[GV_Modi_NOPowerWealth]x§!\n[NOPowerWealth_NOGov][NOPowerWealth_BUEnlist][ElitePowerFromWealth_NIs][NOPowerFromAut_NIsTitle][NOPowerFromAut_NIs][ElitePowerFromAut_NIsTitle][ElitePowerFromAut_NIs][ElitePowerFromAut_BUHire][ElitePowerFromAut_Espionage_Ideas_6][ElitePowerFromAut_Empire_Ideas_3][mtui_tb_no_pow_tt_guide]"
 mtui_tb_no_pow_tt_guide_on:0 "\n--------------------------------------\nHow much sway this elite holds over the country (in brackets: the change at the last yearly census). It moves towards a resting value set by rights, reforms and their wealth.\n\n§GWhy it matters:§! Powerful elites take a bigger share of taxes and land and must be kept happy. If they are both powerful and disloyal, expect rebellion.\n\n§OHow to change it:§! Pass rights and reforms that curb them, and slowly reduce their property through land reform. Conquests can bring in new elites."
 mtui_tb_est_bg_tt:0 "§YBurghers§!\nLoyalty: [mtui_C_bg_loy] ([Prov_BGLoyChange])   Power: §Y[mtui_V_bg_pow]%§! ([Prov_BGPowChange])"
