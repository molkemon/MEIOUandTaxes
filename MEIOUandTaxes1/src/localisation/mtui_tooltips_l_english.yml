 mtui_tb_cl_pow_tt:0 "§YClergy: power§!: §Y[mtui_V_cl_pow]%§! ([Prov_CLPowChange])\nResting Clergy Power: §Y[GV_Modi_CLPowerRest]%§!\n[CLPowerRest_CLHie][CLPowerRest_aspect_04][CLPowerRest_aspect_05][CLPowerRest_aspect_14][CLPowerRest_aspect_16][CLPowerChangeTitle][CLPowerChange_Advisors][CLPowerChange_EmpowerClergy][CLPowerChange_Secularise]\nPower from Wealth modifiers: §Y[GV_Modi_CLPowerWealth]x§!\n[CLPowerWealth_CLHie][CLPowerWealth_BUEnlist][ElitePowerFromWealth_NIs][CLPowerFromAut_NIsTitle][CLPowerFromAut_NIs][ElitePowerFromAut_NIsTitle][ElitePowerFromAut_NIs][ElitePowerFromAut_BUHire][ElitePowerFromAut_Espionage_Ideas_6][ElitePowerFromAut_Empire_Ideas_3][mtui_tb_cl_pow_tt_guide]"
