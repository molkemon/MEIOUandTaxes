 mtui_tb_bg_loy_tt:0 "§YBurghers: loyalty§!: [mtui_C_bg_loy] ([Prov_BGLoyChange])[mtui_tb_bg_loy_tt_guide]"
 mtui_tb_bg_loy_tt_guide_on:0 "\n--------------------------------------\nHow content this elite is with our government (in brackets: the change at the last yearly census). It drifts towards 50 and is nudged by our relations with them.\n\n§GWhy it matters:§! Loyal elites cooperate on taxes, provide more levies and volunteers, and are less corrupt. Disloyal, powerful elites can start a civil war.\n\n§OHow to change it:§! Grant privileges and favours, align the cabinet with their interests, and avoid hostile acts (seizing land, cutting their power)."
 mtui_tb_bg_pow_tt:0 "§YBurghers: power§!: §Y[mtui_V_bg_pow]%§! ([Prov_BGPowChange])\nResting Burgher Power: §Y[GV_Modi_BGPowerRest]%§!\n[BGPowerRest_BGGov][BGPowerChangeTitle][BGPowerChange_Autonomy][BGPowerChange_Advisors][BGPowerChange_RevokeCharters][BGPowerRest_BGIndustry][BGPowerRest_BGLuxury][BGPowerRest_BGConsumerGoods][BGPowerRest_BGPatent][BGPowerRest_BGCivic][BGPowerRest_BGOligopolization][BGPowerRest_BGLicensing]\nPower from Wealth modifiers: §Y[GV_Modi_BGPowerWealth]x§!\n[BGPowerWealth_BGGov][BGPowerWealth_BUEnlist][BGPowerWealth_BGGuild][BGPowerWealth_appeased_urban_elite][BGPowerWealth_Banking][ElitePowerFromWealth_NIs][BGPowerFromAut_NIsTitle][BGPowerFromAut_NIs][ElitePowerFromAut_NIsTitle][ElitePowerFromAut_NIs][ElitePowerFromAut_BUHire][ElitePowerFromAut_Espionage_Ideas_6][ElitePowerFromAut_Empire_Ideas_3][mtui_tb_bg_pow_tt_guide]"
 mtui_tb_bg_pow_tt_guide_on:0 "\n--------------------------------------\nHow much sway this elite holds over the country (in brackets: the change at the last yearly census). It moves towards a resting value set by rights, reforms and their wealth.\n\n§GWhy it matters:§! Powerful elites take a bigger share of taxes and land and must be kept happy. If they are both powerful and disloyal, expect rebellion.\n\n§OHow to change it:§! Pass rights and reforms that curb them, and slowly reduce their property through land reform. Conquests can bring in new elites."
 mtui_tb_est_cl_tt:0 "§YClergy§!\nLoyalty: [mtui_C_cl_loy] ([Prov_CLLoyChange])   Power: §Y[mtui_V_cl_pow]%§! ([Prov_CLPowChange])"
