 mtui_tb_est_tr_tt:0 "§YClans§!\nLoyalty: [mtui_C_tr_loy] ([Prov_TRLoyChange])   Power: §Y[mtui_V_tr_pow]%§! ([Prov_TRPowChange])"
 mtui_tb_est_tr_off_tt:0 "§YClans§!\nThe clans do not exist in our realm: they have neither power nor loyalty, so there is nothing to manage."
 mtui_tb_tr_loy_tt:0 "§YClans: loyalty§!: [mtui_C_tr_loy] ([Prov_TRLoyChange])[mtui_tb_tr_loy_tt_guide]"
 mtui_tb_tr_loy_tt_guide_on:0 "\n--------------------------------------\nHow content this elite is with our government (in brackets: the change at the last yearly census). It drifts towards 50 and is nudged by our relations with them.\n\n§GWhy it matters:§! Loyal elites cooperate on taxes, provide more levies and volunteers, and are less corrupt. Disloyal, powerful elites can start a civil war.\n\n§OHow to change it:§! Grant privileges and favours, align the cabinet with their interests, and avoid hostile acts (seizing land, cutting their power)."
 mtui_tb_tr_pow_tt:0 "§YClans: power§!: §Y[mtui_V_tr_pow]%§! ([Prov_TRPowChange])\nClan power is almost entirely static and does not have any resting point. It is reduced by bureaucratic ideas, clan interactions and state edicts. \n\nClan power is exclusive with any other power in the province, which means that, for example, if clan power is 100%, no other estate is present, while 60% clan power will not allow any other estate power to grow beyond 40%. This includes state reach as well.[mtui_tb_tr_pow_tt_guide]"
 mtui_tb_tr_pow_tt_guide_on:0 "\n--------------------------------------\nHow much sway this elite holds over the country (in brackets: the change at the last yearly census). It moves towards a resting value set by rights, reforms and their wealth.\n\n§GWhy it matters:§! Powerful elites take a bigger share of taxes and land and must be kept happy. If they are both powerful and disloyal, expect rebellion.\n\n§OHow to change it:§! Pass rights and reforms that curb them, and slowly reduce their property through land reform. Conquests can bring in new elites."
 mtui_tb_icon_gold_click_tt:0 "§YTreasury§!\nHover the number for the details.[mtui_tb_icon_gold_click_tt_guide]"
 mtui_tb_icon_gold_click_tt_guide_on:0 "\n--------------------------------------\nDucats in the state treasury. Almost all tax income arrives once a year, with the census in January.\n\n§GWhy it matters:§! Everything the state does is paid from here: officials, state troops, infrastructure, construction and loan interest.\n\n§OHow to change it:§! Revenue comes from taxing the classes, costs from the military budget, infrastructure funding and welfare."
 mtui_tb_icon_manpower_click_tt:0 "§YManpower§!\nHover the number for the details.[mtui_tb_icon_manpower_click_tt_guide]"
 mtui_tb_icon_manpower_click_tt_guide_on:0 "\n--------------------------------------\nMen available to reinforce and raise armies. They come from the population: levies and volunteers provided by the estates, plus state recruitment paid from the military budget.\n\n§GWhy it matters:§! Armies can only reinforce and grow while manpower is available.\n\n§OHow to change it:§! A larger, growing population; loyal estates (they provide more levies); a higher military budget for state recruitment."
 mtui_tb_icon_sailors_click_tt:0 "§YNaval materials§!\nHover the number for the details.[mtui_tb_icon_sailors_click_tt_guide]"
 mtui_tb_icon_sailors_click_tt_guide_on:0 "\n--------------------------------------\nNaval materials, used to build, repair and supply ships.\n\n§GWhy it matters:§! Fleets cannot be repaired or reinforced without them.\n\n§OHow to change it:§! Grow timber and naval material industries; demand from a growing navy and harbours stimulates them."
 mtui_tb_icon_stability_click_tt:0 "§YStability§!\nHover the number for the details.[mtui_tb_icon_stability_click_tt_guide]"
 mtui_tb_icon_stability_click_tt_guide_on:0 "\n--------------------------------------\nHow settled and orderly the realm is (-3 to +3). Stability moves by a monthly progress bar (shown next to it in the top bar).\n\n§GWhy it matters:§! Stability lowers unrest and is required for many reforms and actions; low stability invites rebellion.\n\n§OHow to change it:§! Lower the stability cost modifier (ideas, advisors, reforms, loyal estates); tax relief and grain doles add progress."
 mtui_tb_icon_corruption_click_tt:0 "§YState corruption§!\nHover the number for the details.[mtui_tb_icon_corruption_click_tt_guide]"
 mtui_tb_icon_corruption_click_tt_guide_on:0 "\n--------------------------------------\nState corruption: the corruption of the central government (the number next to it in the top bar is the average provincial corruption).\n\n§GWhy it matters:§! It raises all power costs and weakens trade, forts and legitimacy; it also feeds provincial corruption.\n\n§OHow to change it:§! A competent ruler with enough authority, fewer corruption-causing reforms and privileges, and paying to root out corruption."
 mtui_tb_icon_prestige_click_tt:0 "§YPrestige§!\nHover the number for the details.[mtui_tb_icon_prestige_click_tt_guide]"
 mtui_tb_icon_prestige_click_tt_guide_on:0 "\n--------------------------------------\nThe standing of our country and dynasty in the eyes of the world. Decays towards zero over time.\n\n§GWhy it matters:§! Helps diplomacy (acceptance of proposals, personal unions), morale, legitimacy and reduces aggressive expansion impact.\n\n§OHow to change it:§! Win battles and wars, hold great titles and rank, and take prestigious decisions and court actions."
 mtui_tb_icon_leg_merit_tt:0 "§YMeritocracy§!\nHover the number for the details.[mtui_tb_icon_leg_merit_tt_guide]"
 mtui_tb_icon_leg_merit_tt_guide_on:0 "\n--------------------------------------\nHow much offices are filled by merit rather than connections.\n\n§GWhy it matters:§! Low meritocracy raises corruption and weakens the mandate.\n\n§OHow to change it:§! Appoint skilled advisors and generals, and avoid nepotism and corruption."
 mtui_tb_icon_leg_unity_tt:0 "§YHorde unity§!\nHover the number for the details.[mtui_tb_icon_leg_unity_tt_guide]"
 mtui_tb_icon_leg_unity_tt_guide_on:0 "\n--------------------------------------\nHow united the clans of the horde are behind the khan.\n\n§GWhy it matters:§! Low horde unity causes unrest and can tear the horde apart.\n\n§OHow to change it:§! Raid and win wars, and keep the clans loyal."
 mtui_tb_icon_leg_dev_tt:0 "§YDevotion§!\nHover the number for the details.[mtui_tb_icon_leg_dev_tt_guide]"
 mtui_tb_icon_leg_dev_tt_guide_on:0 "\n--------------------------------------\nThe faith of the people in our theocratic rule.\n\n§GWhy it matters:§! Low devotion brings unrest and weakens the theocracy.\n\n§OHow to change it:§! Pious rulers, religious unity and religious decisions."
 mtui_tb_icon_leg_rep_tt:0 "§YRepublican tradition§!\nHover the number for the details.[mtui_tb_icon_leg_rep_tt_guide]"
 mtui_tb_icon_leg_rep_tt_guide_on:0 "\n--------------------------------------\nHow firmly republican values are rooted in our government.\n\n§GWhy it matters:§! Low republican tradition causes unrest and makes the republic slide towards autocracy.\n\n§OHow to change it:§! Hold regular elections, avoid re-electing the same ruler, and take republican reforms."
 mtui_tb_icon_leg_leg_tt:0 "§YLegitimacy§!\nHover the number for the details.[mtui_tb_icon_leg_leg_tt_guide]"
 mtui_tb_icon_leg_leg_tt_guide_on:0 "\n--------------------------------------\nHow rightful the ruler's claim to the throne appears.\n\n§GWhy it matters:§! Low legitimacy brings unrest, higher costs and a weaker grip on the realm.\n\n§OHow to change it:§! A capable, legitimate heir and ruler, royal marriages, and avoiding actions that undermine the crown."
 mtui_tb_icon_leg_click_tt:0 "[mtui_tb_icon_leg_dt]"
 mtui_tb_icon_powerprojection_liberty_tt:0 "§YLiberty desire§!\nHover the number for the details."
 mtui_tb_icon_powerprojection_pp_tt:0 "§YPower projection§!\nHover the number for the details.[mtui_tb_icon_powerprojection_pp_tt_guide]"
 mtui_tb_icon_powerprojection_pp_tt_guide_on:0 "\n--------------------------------------\nHow strongly we project power against our rivals.\n\n§GWhy it matters:§! High power projection gives monthly monarch power bonuses and better morale.\n\n§OHow to change it:§! Rivals that are strong, winning against rivals, and great power status."
 mtui_tb_icon_powerprojection_click_tt:0 "[mtui_tb_icon_powerprojection_dt]"
