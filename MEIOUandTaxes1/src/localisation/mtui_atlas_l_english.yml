 mtui_at_bg_pv_BGServiceE_n:0 "Naval Obligations"
 mtui_at_bg_pv_BGServiceE_n_tt:0 "§YNaval Obligations§![mtui_at_bg_pv_BGServiceE_n_tt_guide]"
 mtui_at_bg_pv_BGServiceE_n_tt_guide_on:0 "\n--------------------------------------\nPLACEHOLDER: What the cities owe the realm in naval materials and service. Exemptions make the citizen militia more costly and lower our naval capacity.\n\n§GWhy it matters:§! Each level gives the burghers more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the burghers to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_bg_pv_BGServiceE_dn_tt:0 "Lower: [mtui_LD_BGServiceE]"
 mtui_at_bg_pv_BGServiceE_i0_tt:0 "[Privilege_BGServiceE0_title]\nService among our urban elite is done on a by-need basis, with no notable exceptions among the wealthy.§YNo effects§!"
 mtui_at_bg_pv_BGServiceE_i1_tt:0 "[Privilege_BGServiceE1_title]\nOnly the richest citizens seem to be able to gain exemption from service from the realm, with it often being an affair of a high purchase price to avoid service.\n§YEffects§!\n§R+20.0%§! Mana Cost for §YCitizen Militia§!\n§R-10.0%§! Naval force limit per §Y1k§! §OBurghers§! and §TResidents§!"
 mtui_at_bg_pv_BGServiceE_i2_tt:0 "[Privilege_BGServiceE2_title]\nOur urban residents enjoy a list of exemptions, meaning that a large segment of our urban society never sees a life of conflict.\n§YEffects§!\n§R+40.0%§! Mana Cost for §YCitizen Militia§!\n§R-20.0%§! Naval force limit per §Y1k§! §OBurghers§! and §TResidents§!"
 mtui_at_bg_pv_BGServiceE_i3_tt:0 "[Privilege_BGServiceE3_title]\nVarious privileges afforded to our urban residents allow these privileged masses broad exemptions from military service.\n§YEffects§!\n§R+60.0%§! Mana Cost for §YCitizen Militia§!\n§R-30.0%§! Naval force limit per §Y1k§! §OBurghers§! and §TResidents§!"
 mtui_at_bg_pv_BGServiceE_i4_tt:0 "[Privilege_BGServiceE4_title]\nThe defence of the realm by our urban centres is at best, a suggestion, with little in the way of support unless their city is being attacked.\n§YEffects§!\n§R+80.0%§! Mana Cost for §YCitizen Militia§!\n§R-40.0%§! Naval force limit per §Y1k§! §OBurghers§! and §TResidents§!"
 mtui_at_bg_pv_BGServiceE_i5_tt:0 "[Privilege_BGServiceE5_title]\nOur urban centres have no obligations to the defence of the realm, with the only service being done by patriotic volunteers or glory seekers.\n§YEffects§!\n§R+100.0%§! Mana Cost for §YCitizen Militia§!\n§R-50.0%§! Naval force limit per §Y1k§! §OBurghers§! and §TResidents§!"
 mtui_at_bg_pv_BGServiceE_up_tt:0 "Raise: [mtui_LU_BGServiceE]"
