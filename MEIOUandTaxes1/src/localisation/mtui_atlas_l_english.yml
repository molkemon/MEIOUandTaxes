 mtui_at_b_t_direct_n_tt:0 "§YDirect taxation§!\n\n  Rents                                     £2px£§G[GVA_TaxD_Rents]§!¤\n  Land tax                                 £1px£§G[GVA_TaxD_Land]§!¤\n  Property tax                            £1px£§G[GVA_TaxD_PropertyBU]§!¤\n  Poll tax                                  £2px£§G[GVA_TaxD_Poll]§!¤\n  Chattel tax                              §G[GVA_TaxD_Chattel]§!¤\n  Inheritance tax                        £2px£§G[GVA_TaxD_Inheritance]§!¤\n  State property (net)                  §G[GVA_TaxD_BUProperty]§!¤[mtui_at_b_t_direct_n_tt_guide]"
 mtui_at_b_t_direct_n_tt_guide_on:0 "\n--------------------------------------\nTaxes levied directly on people and property: rents, land, property, poll, chattel and inheritance taxes, and what state property earns.\n\n§GWhy it matters:§! Usually the bulk of income early on. It depends on how much wealth each class has and how far our officials reach.\n\n§OHow to change it:§! State reach, the tax rights of each estate, and the wealth of the classes. The class lines below show who pays what."
