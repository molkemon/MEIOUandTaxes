 mtui_at_no_rt_h:0 "§YRights§!"
 mtui_at_no_rt_pk:0 "[mtui_pk_short]"
 mtui_at_no_rt_NOGov_n:0 "Rural Governance"
 mtui_at_no_rt_NOGov_n_tt:0 "§YRural Governance§![mtui_at_no_rt_NOGov_n_tt_guide]"
 mtui_at_no_rt_NOGov_n_tt_guide_on:0 "\n--------------------------------------\nThe natural domain of the [Prov_Noble_P] is the countryside, and the land they can hold within. Historically societies have seen their fortunes rise and fall as land consolidation eventually takes hold, warping the great wealth agriculture can provide into a tool for elite power. Rural reform can decide what form the aristocracy will take across the realm, and change the fortunes of peasants and landlords alike.\n\n§GWhy it matters:§! Sets what the nobles may do and owe in this area, shifting power, loyalty and income between them and the state. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. The change applies at once and opens or joins a reform package (enacted in the State tab): enact it right away, or add further changes first. Reforming too much too quickly hurts stability and the estates may object severely."
 mtui_at_no_rt_NOGov_l:0 "§Y[mtui_L_RNOGov]§!"
 mtui_at_no_rt_NOGov_l_tt:0 "§YRural Governance§![mtui_at_no_rt_NOGov_l_tt_guide]"
 mtui_at_no_rt_NOGov_l_tt_guide_on:0 "\n--------------------------------------\nThe natural domain of the [Prov_Noble_P] is the countryside, and the land they can hold within. Historically societies have seen their fortunes rise and fall as land consolidation eventually takes hold, warping the great wealth agriculture can provide into a tool for elite power. Rural reform can decide what form the aristocracy will take across the realm, and change the fortunes of peasants and landlords alike.\n\n§GWhy it matters:§! Sets what the nobles may do and owe in this area, shifting power, loyalty and income between them and the state. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. The change applies at once and opens or joins a reform package (enacted in the State tab): enact it right away, or add further changes first. Reforming too much too quickly hurts stability and the estates may object severely."
 mtui_at_no_rt_NOGov_dn_tt:0 "Step back §YRural Governance§!. Opens or joins a reform package."
 mtui_at_no_rt_NOGov_i0_tt:0 "[Rights_NOGov1_title]\nThe countryside is effectively divided by land ownership into a patchwork of fiefs, vassals and autonomous princedoms. The only thing that holds these disparate holdings together is the continued loyalty of their landlords to the regime.\n§YEffects§!\n§R+45.0%§!£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Gravity\n§YFeudal Dues§!\n	     §Y35%§! of §lPeasantry§! Income transferred to£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Wealth\n	     (§Y+3%§! *£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power) of §TResident§! Wealth transferred to£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Wealth\n	     (§Y+3%§! *£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power) of£estate_city_burghers_icon_small£§OBurgher§! Wealth transferred to£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Wealth\n§G+20.0%§! §O[Prov_Noble]§! investment in §YFeudal Levies§!\n§Y+0.50§!£estate_greater_nobles_icon_small£Yearly Hierarchy\n§R+150.0%§! Autonomy from£estate_greater_nobles_icon_small£§O[Prov_Noble_P]§!\n§G-40.0%§!£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power from Wealth\n§YState Property Capacity Impact§!\n	     §Y-25.0%§! Capacity cost of holding extraction property\n	     §Y+75.0§! State Property Capacity"
 mtui_at_no_rt_NOGov_i1_tt:0 "[Rights_NOGov2_title]\nLandlords rule fiefdoms across the countryside, carving out their own domains, making their own vassals and obeying the hierarchy only through obligations to their direct superiors. Personal loyalty is perhaps the greatest force in holding the realm together, though it is not the only one.\n§YEffects§!\n§R+35.0%§!£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Gravity\n§YFeudal Dues§!\n	     (§Y35%§! *(£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Property Share + §lPeasantry§! Property Share) * (1 - §lPeasant Freedom§! / 2)) of §lPeasantry§! Income transferred to£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Wealth\n	     (§Y+2%§! *£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power) of §TResident§! Wealth transferred to£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Wealth\n	     (§Y+2%§! *£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power) of£estate_city_burghers_icon_small£§OBurgher§! Wealth transferred to£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Wealth\n§G+10.0%§! §O[Prov_Noble]§! investment in §YFeudal Levies§!\n§Y+0.25§!£estate_greater_nobles_icon_small£Yearly Hierarchy\n§R+100.0%§! Autonomy from£estate_greater_nobles_icon_small£§O[Prov_Noble_P]§!\n§G-20.0%§!£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power from Wealth\n§YState Property Capacity Impact§!\n	     §Y-22.5%§! Capacity cost of holding extraction property\n	     §Y+50.0§! State Property Capacity"
 mtui_at_no_rt_NOGov_i2_tt:0 "[Rights_NOGov3_title]\nAlthough not utterly pervasive, the oldest contracts still transmit extraordinary powers to the holders of land title, and even in the most common lease it is hardly surprising to see mention of monopolies over processing facilities and game.\n§YEffects§!\n§R+25.0%§!£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Gravity\n§YFeudal Dues§!\n	     (§Y35%§! *(£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Property Share + (§lPeasantry§! Property Share *£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power)) * (1 - §lPeasant Freedom§! / 2)) of §lPeasantry§! Income transferred to£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Wealth\n	     (§Y+1.25%§! *£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power) of §TResident§! Wealth transferred to£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Wealth\n	     (§Y+1.25%§! *£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power) of£estate_city_burghers_icon_small£§OBurgher§! Wealth transferred to£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Wealth\n§Y+0.10§!£estate_greater_nobles_icon_small£Monthly Hierarchy\n§R+66.0%§! Autonomy from£estate_greater_nobles_icon_small£§O[Prov_Noble_P]§!\n§R+0.0%§!£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power from Wealth\n§YState Property Capacity Impact§!\n	     §Y-20.0%§! Capacity cost of holding extraction property\n	     §Y+25.0§! State Property Capacity"
 mtui_at_no_rt_NOGov_i3_tt:0 "[Rights_NOGov4_title]\nAn often unclear mix of responsibilities, rights and powers affords the landholding class significant powers over their own estates and the realm at large.\n§YEffects§!\n§R+15.0%§!£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Gravity\n§YFeudal Dues§!\n	     (§Y35%§! * ((£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Property Share *£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power) + (§lPeasantry§! Property Share * (1 - §lPeasant Freedom§!) *£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power))) of §lPeasantry§! Income transferred to£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Wealth\n	     (§Y+0.75%§! *£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power) of §TResident§! Wealth transferred to£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Wealth\n	     (§Y+0.75%§! *£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power) of£estate_city_burghers_icon_small£§OBurgher§! Wealth transferred to£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Wealth\n§R+33.0%§! Autonomy from£estate_greater_nobles_icon_small£§O[Prov_Noble_P]§!\n§R+40.0%§!£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power from Wealth\n§YState Property Capacity Impact§!\n	     §Y-17.5%§! Capacity cost of holding extraction property"
 mtui_at_no_rt_NOGov_i4_tt:0 "[Rights_NOGov5_title]\nVast estates have permitted their owners to translate their influence into a more-than-occassional blind eye from the government with respect to the affairs of their holdings.\n§YEffects§!\n§YFeudal Dues§!\n	     (§Y35%§! *(£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Property Share * (1 - §lPeasant Freedom§! * (1 -£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power))) + (§lPeasantry§! Property Share * (1 - §lPeasant Freedom§!) *£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power))) of §lPeasantry§! Income transferred to£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Wealth\n	     (§Y+0.25%§! *£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power) of §TResident§! Wealth transferred to£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Wealth\n	     (§Y+0.25%§! *£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power) of£estate_city_burghers_icon_small£§OBurgher§! Wealth transferred to£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Wealth\n§R+2.0%§!£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power from Wealth\n§YState Property Capacity Impact§!\n	     §Y-15.0%§! Capacity cost of holding extraction property"
 mtui_at_no_rt_NOGov_i5_tt:0 "[Rights_NOGov6_title]\nProperty owners hold no inherent rights to land or labour, with ultimate power over land residing with the state and its eminent domain. All land is held in implicit lease, leaving fee simple the normal means of land ownership.\n§YEffects§!\n§G+15.0%§! Rural Skills\n§YFeudal Dues§!\n	     (§Y35%§! *£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Property Share * (1 - §lPeasant Freedom§!) *£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power) of §lPeasantry§! Income transferred to£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Wealth"
 mtui_at_no_rt_NOGov_up_tt:0 "Reform §YRural Governance§!. Opens or joins a reform package."
 mtui_at_no_rt_NOObl_n:0 "Noble Obligations"
 mtui_at_no_rt_NOObl_n_tt:0 "§YNoble Obligations§![mtui_at_no_rt_NOObl_n_tt_guide]"
 mtui_at_no_rt_NOObl_n_tt_guide_on:0 "\n--------------------------------------\nThe [Prov_Noble_P] can take many forms, and many roles across society. The most ancient of obligations is the call to arms, providing the rural elite with a means to serve and protect the realm at large. With effort however a new role can take hold, shifting obligations from war to the more peaceful yet powerful office desk.\n\n§GWhy it matters:§! Sets what the nobles may do and owe in this area, shifting power, loyalty and income between them and the state. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. The change applies at once and opens or joins a reform package (enacted in the State tab): enact it right away, or add further changes first. Reforming too much too quickly hurts stability and the estates may object severely."
 mtui_at_no_rt_NOObl_l:0 "§Y[mtui_L_RNOObl]§!"
 mtui_at_no_rt_NOObl_l_tt:0 "§YNoble Obligations§![mtui_at_no_rt_NOObl_l_tt_guide]"
 mtui_at_no_rt_NOObl_l_tt_guide_on:0 "\n--------------------------------------\nThe [Prov_Noble_P] can take many forms, and many roles across society. The most ancient of obligations is the call to arms, providing the rural elite with a means to serve and protect the realm at large. With effort however a new role can take hold, shifting obligations from war to the more peaceful yet powerful office desk.\n\n§GWhy it matters:§! Sets what the nobles may do and owe in this area, shifting power, loyalty and income between them and the state. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. The change applies at once and opens or joins a reform package (enacted in the State tab): enact it right away, or add further changes first. Reforming too much too quickly hurts stability and the estates may object severely."
 mtui_at_no_rt_NOObl_dn_tt:0 "Step back §YNoble Obligations§!. Opens or joins a reform package."
 mtui_at_no_rt_NOObl_i0_tt:0 "[Rights_NOObl1_title]\nThe [Prov_Noble_P] contributes to society solely in the form of service, providing the core of the nation’s military and meting out justice across the countryside.\n§YEffects§!\n§R+5.0%§!£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Gravity\n§G+80.0%§! Base Manpower from £estate_greater_nobles_icon_small£§O[Prov_Noble_P]§!\n§G+30.0%§! §O[Prov_Noble]§! investment in §YFeudal Levies§!"
 mtui_at_no_rt_NOObl_i1_tt:0 "[Rights_NOObl2_title]\n[Prov_Noble_P] pay their obligation to society in both service and limited cash dues, depending on where their loyalties lie.\n§YEffects§!\n§R+2.5%§!£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Gravity\n§G+40.0%§! Base Manpower from £estate_greater_nobles_icon_small£§O[Prov_Noble_P]§!\n§Y+50.0%§! £estate_greater_nobles_icon_small£§Y[Prov_Noble]§! Power Weight for Siphons\n§G+25.0%§! Revenue Tax from £estate_greater_nobles_icon_small£§Y[Prov_Noble_P]§!\n§G+15.0%§! §O[Prov_Noble]§! investment in §YFeudal Levies§!"
 mtui_at_no_rt_NOObl_i2_tt:0 "[Rights_NOObl3_title]\n[Prov_Noble_P] pay their share in financial obligations yet recoup their costs through lobbying and the corruption of the tax administration through bureaucratic service.\n§YEffects§!\n§Y+100.0%§! £estate_greater_nobles_icon_small£§Y[Prov_Noble]§! Power Weight for Siphons\n§G+50.0%§! Revenue Tax from £estate_greater_nobles_icon_small£§Y[Prov_Noble_P]§!"
 mtui_at_no_rt_NOObl_up_tt:0 "Reform §YNoble Obligations§!. Opens or joins a reform package."
 mtui_at_no_rt_NOTen_n:0 "Tenancy"
 mtui_at_no_rt_NOTen_n_tt:0 "§YTenancy§![mtui_at_no_rt_NOTen_n_tt_guide]"
 mtui_at_no_rt_NOTen_n_tt_guide_on:0 "\n--------------------------------------\nThe countryside is vast, worked by the great numbers of the peasantry across the land. While peasants can own land, tenancy otherwise often forms a crucial role in employment and productivity, allowing landlords to hire helping hands for their vast fields. The freedom of these tenants may be shaped by economic realities, yet their true rights are legal and political in nature.\n\n§GWhy it matters:§! Sets what the nobles may do and owe in this area, shifting power, loyalty and income between them and the state. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. The change applies at once and opens or joins a reform package (enacted in the State tab): enact it right away, or add further changes first. Reforming too much too quickly hurts stability and the estates may object severely."
 mtui_at_no_rt_NOTen_l:0 "§Y[mtui_L_RNOTen]§!"
 mtui_at_no_rt_NOTen_l_tt:0 "§YTenancy§![mtui_at_no_rt_NOTen_l_tt_guide]"
 mtui_at_no_rt_NOTen_l_tt_guide_on:0 "\n--------------------------------------\nThe countryside is vast, worked by the great numbers of the peasantry across the land. While peasants can own land, tenancy otherwise often forms a crucial role in employment and productivity, allowing landlords to hire helping hands for their vast fields. The freedom of these tenants may be shaped by economic realities, yet their true rights are legal and political in nature.\n\n§GWhy it matters:§! Sets what the nobles may do and owe in this area, shifting power, loyalty and income between them and the state. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. The change applies at once and opens or joins a reform package (enacted in the State tab): enact it right away, or add further changes first. Reforming too much too quickly hurts stability and the estates may object severely."
 mtui_at_no_rt_NOTen_dn_tt:0 "Step back §YTenancy§!. Opens or joins a reform package."
 mtui_at_no_rt_NOTen_i0_tt:0 "[Rights_NOTen1_title]\nDe-facto slavery is the principal source of agricultural labour, with only the landowner's compassion and certain social realities preventing most peasants from being worked to death.\n§YEffects§!\n§R-0.2§! Yearly Peasant Freedom\n§G+2.00§! £loc_pitchfork£Base Welfare"
 mtui_at_no_rt_NOTen_i1_tt:0 "[Rights_NOTen2_title]\nThe freedom of tenants varies across the realm, yet generally most have no protections against widespread abuses by the [Prov_Noble_P].\n§YEffects§!\n§R-0.10§! Yearly Peasant Freedom\n§G+20.0§! Minimum Peasant Freedom\n§R-2.00§! £loc_pitchfork£Base Welfare"
 mtui_at_no_rt_NOTen_i2_tt:0 "[Rights_NOTen3_title]\nThe worst excesses of landlords are kept in check, yet peasants remain subject to many arbitrary fees, laws and abuses.\n§YEffects§!\n§G+35.0§! Minimum Peasant Freedom\n§R-1.00§! £loc_pitchfork£Base Welfare"
 mtui_at_no_rt_NOTen_i3_tt:0 "[Rights_NOTen4_title]\nUninheritable contracts form the basis for the provision of all rural labour, backed by a legal framework granting all parties involved basic remedial rights.\n§YEffects§!\n§G+0.2§! Yearly Peasant Freedom\n§G+50.0§! Minimum Peasant Freedom\n§G+10.0%§! Rural Skills\n§G+1.00§! £loc_pitchfork£Base Welfare"
 mtui_at_no_rt_NOTen_up_tt:0 "Reform §YTenancy§!. Opens or joins a reform package."
 mtui_at_no_rt_NOSer_n:0 "Military Organisation"
 mtui_at_no_rt_NOSer_n_tt:0 "§YMilitary Organisation§![mtui_at_no_rt_NOSer_n_tt_guide]"
 mtui_at_no_rt_NOSer_n_tt_guide_on:0 "\n--------------------------------------\nThe call to arms is not met by the rural elite alone. The levies they raise and bring forth for war historically provide many societies with significant numbers and a loyal backbone to march into battle. The alternative is a more centralised administration, facilitating state recruitment and shifting the organisers from the elites to a new found state. While state organisation is more costly, it is also more reliable, disciplined and divorced of patronage based complications.\n\n§GWhy it matters:§! Sets what the nobles may do and owe in this area, shifting power, loyalty and income between them and the state. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. The change applies at once and opens or joins a reform package (enacted in the State tab): enact it right away, or add further changes first. Reforming too much too quickly hurts stability and the estates may object severely."
 mtui_at_no_rt_NOSer_l:0 "§Y[mtui_L_RNOSer]§!"
 mtui_at_no_rt_NOSer_l_tt:0 "§YMilitary Organisation§![mtui_at_no_rt_NOSer_l_tt_guide]"
 mtui_at_no_rt_NOSer_l_tt_guide_on:0 "\n--------------------------------------\nThe call to arms is not met by the rural elite alone. The levies they raise and bring forth for war historically provide many societies with significant numbers and a loyal backbone to march into battle. The alternative is a more centralised administration, facilitating state recruitment and shifting the organisers from the elites to a new found state. While state organisation is more costly, it is also more reliable, disciplined and divorced of patronage based complications.\n\n§GWhy it matters:§! Sets what the nobles may do and owe in this area, shifting power, loyalty and income between them and the state. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. The change applies at once and opens or joins a reform package (enacted in the State tab): enact it right away, or add further changes first. Reforming too much too quickly hurts stability and the estates may object severely."
 mtui_at_no_rt_NOSer_dn_tt:0 "Step back §YMilitary Organisation§!. Opens or joins a reform package."
 mtui_at_no_rt_NOSer_i0_tt:0 "[Rights_NOSer1_title]\nMuch of the military's manpower is provided by the [Prov_Noble_P], a collection of dues in the form of military service from both professional retainers and militia.\n§YEffects§!\n§R+5.0%§!£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Gravity\n§YFeudal Levy§! enabled\n	     (§Y50%§! *£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Property) Base Manpower from §lPeasantry§! subject to §YFeudal Dues§!\n	     (§Y50%§! * £estate_bureaucracy_icon_small£ §MBureau§! Property) Base Manpower from §lPeasantry§!\n§G+60.0%§! §O[Prov_Noble]§! investment in §YFeudal Levies§!\n§R+1.50%§! Yearly Army Tradition Decay\n§R-10.0%§! Army Professionalism"
 mtui_at_no_rt_NOSer_i1_tt:0 "[Rights_NOSer2_title]\nCodified extensions of societal obligations extends the forms of service available to the realm, empowering the basic enlistment of men into new forces of arms.\n§YEffects§!\n§R+2.5%§!£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Gravity\n§YFeudal Levy§! enabled\n	     (§Y35%§! *£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Property) Base Manpower from §lPeasantry§! subject to §YFeudal Dues§!\n	     (§Y35%§! * £estate_bureaucracy_icon_small£ §MBureau§! Property) Base Manpower from §lPeasantry§!\n§G+60.0%§! §O[Prov_Noble]§! investment in §YFeudal Levies§!\n§R+1.00%§! Yearly Army Tradition Decay\nEnables §YVolunteers§! via £estate_bureaucracy_icon_small£ §MBureau§!\n§R-5.0%§! Army Professionalism"
 mtui_at_no_rt_NOSer_i2_tt:0 "[Rights_NOSer3_title]\nAn emerging state has resulted in a confused mix of standing units and seasonal soldiers, with a noble's retinue often serving beside full-time soldiers and officers.\n§YEffects§!\n§YFeudal Levy§! enabled\n	     (§Y20%§! *£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Property) Base Manpower from §lPeasantry§! subject to §YFeudal Dues§!\n	     (§Y20%§! * £estate_bureaucracy_icon_small£ §MBureau§! Property) Base Manpower from §lPeasantry§!\n§G+30.0%§! §O[Prov_Noble]§! investment in §YFeudal Levies§!\n§R+0.50%§! Yearly Army Tradition Decay\nEnables §YEnlistment§! via £estate_bureaucracy_icon_small£ §MBureau§!"
 mtui_at_no_rt_NOSer_i3_tt:0 "[Rights_NOSer4_title]\nSalaried, enlisted soldiers form the core of the military, yet recruitment, enlistment and even organisational duties remain divided between the [Prov_Noble_P] and the bureaucracy.\n§YEffects§!\nEnables §YRecruitment§! via £estate_bureaucracy_icon_small£ §MBureau§!\n§G+5.0%§! Movement Speed\n§G-10.0%§! Land Attrition\n§G+10.0%§! Manpower Recovery Speed\n§G5.0%§! Army Professionalism"
 mtui_at_no_rt_NOSer_i4_tt:0 "[Rights_NOSer5_title]\nAll recruitment, enlistment and organisation is administered by a bureaucratised army core under the firm control of the state.\n§YEffects§!\nEnables §YRecruitment§! via £estate_bureaucracy_icon_small£ §MBureau§!\n§G+10.0%§! Movement Speed\n§G-20.0%§! Land Attrition\n§G+20.0%§! Manpower Recovery Speed\n§G+10.0%§! Army Professionalism"
 mtui_at_no_rt_NOSer_i5_tt:0 "[Rights_NOSer6_title]\nExtensive reform leaves enlistment, recruitment and service in the hands of a meritocratic administration, where promotions are earned, training is uniform and where soldiers are paid on time, every time.\n§YEffects§!\nEnables §YRecruitment§! via £estate_bureaucracy_icon_small£ §MBureau§!\n§G+15.0%§! Movement Speed\n§G-30.0%§! Land Attrition\n§G+30.0%§! Manpower Recovery Speed\n§G+20.0%§! Army Professionalism"
 mtui_at_no_rt_NOSer_up_tt:0 "Reform §YMilitary Organisation§!. Opens or joins a reform package."
