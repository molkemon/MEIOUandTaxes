 mtui_at_no_gl_rel_n:0 "Relations with the state"
 mtui_at_no_gl_rel_n_tt:0 "§YRelations with the state§!\n§TNatural Rest Point for Relations:§! §Y[This.GV_NO_RelationState_RestDisp]§!\n\nResting Point of Relations wih the §MState§! is affected by Faction Mood and base relations.\n\nBase Aristocratic Faction Relation with State: §Y[This.GV_Modi_FCNOState]§!\n[NORelationsRest_NOTitles][NORelationsRest_NODynastic]\nSources of Yearly Change:\n[NORelationsChange_AllyRivalRest][mtui_at_no_gl_rel_n_tt_guide]"
 mtui_at_no_gl_rel_n_tt_guide_on:0 "\n--------------------------------------\nHow the faction of the nobles at court and the state get along (-100 to +100).\n\n§GWhy it matters:§! Relations set the loyalty the estate settles at: from hostile (-100) to friendly (+100) its resting loyalty rises by 50 points. Together with the faction's influence and the estate's power they also add to our yearly legitimacy (or its equivalent for our government).\n\n§OHow to change it:§! Many actions and reforms change them: support and favours improve them, pressure, crackdowns and reforms against them worsen them."
 mtui_at_no_gl_rel_v:0 "[Rel_NO_State_Type] ([Rel_NO_State])"
 mtui_at_no_gl_rel_v_tt:0 "§YRelations with the state§!\n§TNatural Rest Point for Relations:§! §Y[This.GV_NO_RelationState_RestDisp]§!\n\nResting Point of Relations wih the §MState§! is affected by Faction Mood and base relations.\n\nBase Aristocratic Faction Relation with State: §Y[This.GV_Modi_FCNOState]§!\n[NORelationsRest_NOTitles][NORelationsRest_NODynastic]\nSources of Yearly Change:\n[NORelationsChange_AllyRivalRest][mtui_at_no_gl_rel_v_tt_guide]"
