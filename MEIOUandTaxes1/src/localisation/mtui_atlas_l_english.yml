 mtui_at_cl_gl_wealth_n_tt:0 "§YWealth§!\n§vIncome§!                                                £3px£§G[GVA433_CL_Income]§!¤\n\n§ALabour§!                                                 £1px£§G[GVA433_CL_IncomeProd]§!¤§!¤\n§YProperty§!                                               £1px£§G[GVA433_CL_IncomePrp]§!¤[CL_IncomeDole][CL_IncomeFarm]\n§YState Wages§!                                          £1px£§G[GVA433_CL_IncomeAdmin]§!¤\n§YCorruption§!                                           £2px£§G[GVA433_CL_IncomeCrpt]§!¤\n\n§YFlows§!                                                   §G[GVA433_CL_IncomeTax]§!¤[TaxD_DonationsCL][TaxD_TitheCL]\n\n§RSpending§!                                              £2px£§R[GVA433_CL_Spend]§!¤\n\n§OConsumption§!                                        £1px£§R[GVA433_CL_SpendProd]§!¤\n§OProperty§!                                               £1px£§R[GVA433_CL_SpendPrp]§!¤\n§OInfrastructure§!                                        £1px£§R[GVA433_CL_SpendInfra]§!¤\n§OFlows§!                                                   §R[GVA433_TaxD_CL_Flow]§!¤\n\n§OTaxes§!                                                   £1px£§R[GVA433_TaxD_CL_BU]§!¤[TaxD_CLFees][TaxD_ObligationsCL][TaxD_CLPoll][TaxD_CLExciseBU][TaxD_CLLand][TaxD_CLPropertyBU][TaxD_CLChattel][TaxD_CLInheritance][mtui_at_cl_gl_wealth_n_tt_guide]"
 mtui_at_cl_gl_wealth_n_tt_guide_on:0 "\n--------------------------------------\nThe accumulated wealth of the clergy: each year their income (below) is added and their spending taken off.\n\n§GWhy it matters:§! Wealth turns into power and pays their part of the taxes.\n\n§OHow to change it:§! Their income, which depends on the economy and on their privileges."
