 mtui_at_bg_rt_h:0 "§YRights§!"
 mtui_at_bg_rt_pk:0 "[mtui_pk_short]"
 mtui_at_bg_rt_BGCom_n:0 "Commerce"
 mtui_at_bg_rt_BGCom_n_tt:0 "§YCommerce§![mtui_at_bg_rt_BGCom_n_tt_guide]"
 mtui_at_bg_rt_BGCom_n_tt_guide_on:0 "\n--------------------------------------\nBeyond the fields, forests and resources of the countryside, merchants and trade provide the backbone of advanced societies, moving goods across great distances and transforming entire economies through integrated, multi-level networks. Even so, this essential service is not always welcome. Trade can live and die by the supporting framework of the realms they trade in, providing incentive or barriers from state to state. With the right reform and right ideas, a state can take a definitive stance on the role of merchants in the state, and the future of the realm at large.\n\n§GWhy it matters:§! Sets what the burghers may do and owe in this area, shifting power, loyalty and income between them and the state. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. The change applies at once and opens or joins a reform package (enacted in the State tab): enact it right away, or add further changes first. Reforming too much too quickly hurts stability and the estates may object severely."
 mtui_at_bg_rt_BGCom_l:0 "§Y[mtui_L_RBGCom]§!"
 mtui_at_bg_rt_BGCom_l_tt:0 "§YCommerce§![mtui_at_bg_rt_BGCom_l_tt_guide]"
 mtui_at_bg_rt_BGCom_l_tt_guide_on:0 "\n--------------------------------------\nBeyond the fields, forests and resources of the countryside, merchants and trade provide the backbone of advanced societies, moving goods across great distances and transforming entire economies through integrated, multi-level networks. Even so, this essential service is not always welcome. Trade can live and die by the supporting framework of the realms they trade in, providing incentive or barriers from state to state. With the right reform and right ideas, a state can take a definitive stance on the role of merchants in the state, and the future of the realm at large.\n\n§GWhy it matters:§! Sets what the burghers may do and owe in this area, shifting power, loyalty and income between them and the state. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. The change applies at once and opens or joins a reform package (enacted in the State tab): enact it right away, or add further changes first. Reforming too much too quickly hurts stability and the estates may object severely."
 mtui_at_bg_rt_BGCom_dn_tt:0 "Step back §YCommerce§!. Opens or joins a reform package."
 mtui_at_bg_rt_BGCom_i0_tt:0 "[Rights_BGCom1_title]\nThe exchange of goods is governed by the realm, facilitating exchange through investment in infrastructure and security for official agents while maintaining a system of stockpiles and exchange points.\n§YEffects§!\n§R-20.0%§! Ideal Burgher Size Modifier\n§R-80.0%§! Commerce Production\n§R-65.0%§! Merchants from Trade Centers\n(§Y15%§! * £estate_bureaucracy_icon_small£ §MState Reach§!) of £estate_city_burghers_icon_small£ §OBurgher§! Commerce Income transferred to §YLocal Tax Income§!"
 mtui_at_bg_rt_BGCom_i1_tt:0 "[Rights_BGCom2_title]\nCommercial activity is entirely controlled by the state, allowing only sanctioned actors limited ability to conduct independent commerce, allowing only small-scale and rural exchange through the limited reach of the state over its own territory.\n§YEffects§!\n§R-15.0%§! Ideal Burgher Size Modifier\n§R-65.0%§! Commerce Production\n§R-50.0%§! Merchants from Trade Centers\n(§Y7.5%§! * £estate_bureaucracy_icon_small£ §MState Reach§!) of £estate_city_burghers_icon_small£ §OBurgher§! Commerce Income transferred to §YLocal Tax Income§!"
 mtui_at_bg_rt_BGCom_i2_tt:0 "[Rights_BGCom3_title]\nExtensive regulation and administration provides the state with control over the legitimacy, movement and activity of merchant actors across the realm, controlling the flow of trade at the cost of investment from other parties.\n§YEffects§!\n§R-12.5%§! Ideal Burgher Size Modifier\n§R-50.0%§! Commerce Production\n§R-30.0%§! Merchants from Trade Centers\n(§Y5%§! * £estate_bureaucracy_icon_small£ §MState Reach§!) of £estate_city_burghers_icon_small£ §OBurgher§! Commerce Income transferred to §YLocal Tax Income§!"
 mtui_at_bg_rt_BGCom_i3_tt:0 "[Rights_BGCom4_title]\nA suffocating raft of measures protecting state interests over those of independent operators leaves the state with extensive influence over commercial activity at the cost of investment from other parties.\n§YEffects§!\n§R-10.0%§! Ideal Burgher Size Modifier\n§R-35.0%§! Commerce Production\n§R-10.0%§! Merchants from Trade Centers\n§R-0.50§! £estate_city_burghers_icon_small£ Base Consultation\n(§Y5%§! *£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power) of £estate_city_burghers_icon_small£ §OBurgher§! Income transferred to£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Wealth\n(§Y2.5%§! * £estate_bureaucracy_icon_small£ §MState Reach§!) of £estate_city_burghers_icon_small£ §OBurgher§! Commerce Income transferred to §YLocal Tax Income§!"
 mtui_at_bg_rt_BGCom_i4_tt:0 "[Rights_BGCom5_title]\nThe lack of rules- and the transience of those few that do exist- concerning trade makes it a highly lucrative venture for those willing to brave the risks involved - ultimately at the cost of those needing their services.\n§YEffects§!\n§R-5.0%§! Ideal Burgher Size Modifier\n§R-20.0%§! Commerce Production\n§R-1.00§! £estate_city_burghers_icon_small£ Base Consultation\n(§Y10%§! *£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power) of £estate_city_burghers_icon_small£ §OBurgher§! Commerce Income transferred to£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Wealth"
 mtui_at_bg_rt_BGCom_i5_tt:0 "[Rights_BGCom6_title]\nDecrees and protections that uphold the right to trade for those lucky enough to be presently in good favour with the government makes traders a highly desirable and widely available class of service providers.\n§YEffects§!\n§R-2.5%§! Ideal Burgher Size Modifier\n§R-10.0%§! Commerce Production\n(§Y5%§! *£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power) of £estate_city_burghers_icon_small£ §OBurgher§! Commerce Income transferred to£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Wealth"
 mtui_at_bg_rt_BGCom_i6_tt:0 "[Rights_BGCom7_title]\nCodified protections and rights for merchants within the realm leave commercial actors with general freedom to conduct their affairs in peace, facilitating trade across the realm.\n§YEffects§!\n§G+5.0%§! Ideal Burgher Size Modifier\n§G+0.50§! £estate_city_burghers_icon_small£ Base Consultation\n(§Y1%§! * £estate_bureaucracy_icon_small£ §MState Reach§!) of £estate_city_burghers_icon_small£ §OBurgher§! Commerce Income transferred to §YLocal Tax Income§!"
 mtui_at_bg_rt_BGCom_i7_tt:0 "[Rights_BGCom8_title]\nEven if not entirely favourable, a reliable legal context removes many of the disincentives from commercial activity, reducing uncertainty- and thus risk- at the cost of greater government oversight.\n§YEffects§!\n§G+7.5%§! Ideal Burgher Size Modifier\n§G+10.0%§! Trade Skill\n§G+1.00§! £estate_city_burghers_icon_small£ Base Consultation\n(§Y2%§! * £estate_bureaucracy_icon_small£ §MState Reach§!) of £estate_city_burghers_icon_small£ §OBurgher§! Commerce Income transferred to §YLocal Tax Income§!"
 mtui_at_bg_rt_BGCom_i8_tt:0 "[Rights_BGCom9_title]\nFreedom of movement, security of property and the realm's prosperity have become united in concept and law, allowing those capable and interested in trading to conduct their business across the realm- and potentially beyond- in relative freedom.\n§YEffects§!\n§G+10.0%§! Ideal Burgher Size Modifier\n§G+25.0%§! Trade Skill\n§G+1.50§! £estate_city_burghers_icon_small£ Base Consultation"
 mtui_at_bg_rt_BGCom_i9_tt:0 "[Rights_BGCom10_title]\nAn evolving expanse of legislation facilitates the creation and development of corporate entities and financial institutions, empowering the development of advanced commercial activity across the realm.\n§YEffects§!\n§G+12.5%§! Ideal Burgher Size Modifier\n§G+45.0%§! Trade Skill\n§G+2.00§! £estate_city_burghers_icon_small£ Base Consultation\n(§Y0.5%§! * £estate_bureaucracy_icon_small£ §MState Reach§!) of £estate_city_burghers_icon_small£ §OBurgher§! Commerce Income transferred to §YLocal Tax Income§!"
 mtui_at_bg_rt_BGCom_up_tt:0 "Reform §YCommerce§!. Opens or joins a reform package."
 mtui_at_bg_rt_BGGov_n:0 "Urban Governance"
 mtui_at_bg_rt_BGGov_n_tt:0 "§YUrban Governance§![mtui_at_bg_rt_BGGov_n_tt_guide]"
 mtui_at_bg_rt_BGGov_n_tt_guide_on:0 "\n--------------------------------------\nAs a great gathering of many people, the dense settlements of urban communities have a unique desire for security and just governance. The need for someone to provide essential services leaves the community with a fundamental question of who will act as the settlement's benefactor. Generally a community can either support the flourishing elites of successful settlements known as the Burghers, or disempower them in favour of state support and funding. The need for a given direction is situational, yet the necessity of moving in any directon is undeniable.\n\n§GWhy it matters:§! Sets what the burghers may do and owe in this area, shifting power, loyalty and income between them and the state. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. The change applies at once and opens or joins a reform package (enacted in the State tab): enact it right away, or add further changes first. Reforming too much too quickly hurts stability and the estates may object severely."
 mtui_at_bg_rt_BGGov_l:0 "§Y[mtui_L_RBGGov]§!"
 mtui_at_bg_rt_BGGov_l_tt:0 "§YUrban Governance§![mtui_at_bg_rt_BGGov_l_tt_guide]"
 mtui_at_bg_rt_BGGov_l_tt_guide_on:0 "\n--------------------------------------\nAs a great gathering of many people, the dense settlements of urban communities have a unique desire for security and just governance. The need for someone to provide essential services leaves the community with a fundamental question of who will act as the settlement's benefactor. Generally a community can either support the flourishing elites of successful settlements known as the Burghers, or disempower them in favour of state support and funding. The need for a given direction is situational, yet the necessity of moving in any directon is undeniable.\n\n§GWhy it matters:§! Sets what the burghers may do and owe in this area, shifting power, loyalty and income between them and the state. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. The change applies at once and opens or joins a reform package (enacted in the State tab): enact it right away, or add further changes first. Reforming too much too quickly hurts stability and the estates may object severely."
 mtui_at_bg_rt_BGGov_dn_tt:0 "Step back §YUrban Governance§!. Opens or joins a reform package."
 mtui_at_bg_rt_BGGov_i0_tt:0 "[Rights_BGGov1_title]\nSpecialised bureaucracy governs most urban centers, providing towns and cities with a guaranteed means of municipal funding and local justice.\n§YEffects§!\n§G+60.0%§! §TResident§! Wealth expenditure on Urban Infrastructure\n§R-5.0%§! £estate_city_burghers_icon_small£ §OBurgher§! Wealth expenditure on Urban Infrastructure\n§G+1.00§! £estate_city_burghers_icon_small£ Base Consultation\n§G+5.0%§! Urban Skill\n§Y-50.0%§! £estate_city_burghers_icon_small£ §OBurghers§! Power from Wealth"
 mtui_at_bg_rt_BGGov_i1_tt:0 "[Rights_BGGov2_title]\nLocal governors assign officials to oversee important urban centers, ensuring somewhat ad-hoc funding and guaranteeing some form of state justice.\n§YEffects§!\n§G+50.0%§! §TResident§! Wealth expenditure on  Urban Infrastructure\n§R-5.0%§! £estate_city_burghers_icon_small£ §OBurgher§! Wealth expenditure on Urban Infrastructure\n§R-5.0%§! Urban Skill\n§Y-25.0%§! £estate_city_burghers_icon_small£ §OBurghers§! Power from Wealth"
 mtui_at_bg_rt_BGGov_i2_tt:0 "[Rights_BGGov3_title]\nWithout any realm laws or protections for urban centers, residents rely on communal efforts to fund infrastructure and preserve their way of life.\n§YEffects§!\n§G+40.0%§! §TResident§! Wealth expenditure on Urban Infrastructure\n§R-5.0%§! £estate_city_burghers_icon_small£ §OBurgher§! Wealth expenditure on Urban Infrastructure\n§R-15.0%§! Urban Skill\n§R-2.00§! £estate_city_burghers_icon_small£ Base Consultation"
 mtui_at_bg_rt_BGGov_i3_tt:0 "[Rights_BGGov4_title]\nPermits granted by landholders or the state provide towns with the legal right to make certain arrangements for themselves within specific geographic bounds, permitting them collect dues such as tolls for necessities such as maintenance and justice.\n§YEffects§!\n§R-20.0%§! §TResident§! Wealth expenditure on Urban Infrastructure\n§R-2.5%§! £estate_city_burghers_icon_small£ §OBurgher§! Wealth expenditure on  Urban Infrastructure\n§YProperty Tax (£estate_city_burghers_icon_small£)§!\n	     (§Y0.5%§! * £estate_city_burghers_icon_small£ §OBurgher§! Power) of §TResident§! Wealth transferred to £estate_city_burghers_icon_small£ §OBurgher§! Wealth\n§R-5.0%§! Urban Skill\n§R+25.0%§! Autonomy from £estate_city_burghers_icon_small£ §OBurghers§!\n§R+10.0%§! £estate_city_burghers_icon_small£ §OBurghers§! Power from Wealth"
 mtui_at_bg_rt_BGGov_i4_tt:0 "[Rights_BGGov5_title]\nMore extensive charter permissions give those ruling the cities the right to collect taxes, mete out their own justice, and raise militias- most importantly though, they grant freedom from those same dues when it comes to the state and landowner.\n§YEffects§!\n§R-40.0%§! §TResident§! Wealth expenditure on Urban Infrastructure\n§G+5.0%§! £estate_city_burghers_icon_small£ §OBurgher§! Wealth expenditure on Urban Infrastructure\n§YProperty Tax (£estate_city_burghers_icon_small£)§!\n	     (§Y0.8%§! * £estate_city_burghers_icon_small£ §OBurgher§! Power) of §TResident§! Wealth transferred to £estate_city_burghers_icon_small£ §OBurgher§! Wealth\n§G+5.0%§! Urban Skill\n§YCitizens Levy§!\n	     §Y10%§! Base Manpower from §TResidents§!\n§R+50.0%§! Autonomy from £estate_city_burghers_icon_small£ §OBurghers§!\n§R+20.0%§! £estate_city_burghers_icon_small£ §OBurghers§! Power from Wealth"
 mtui_at_bg_rt_BGGov_i5_tt:0 "[Rights_BGGov6_title]\nThe most prominent urban centres are ruled as practically independent realms compared to the countryside, although often their jurisdiction extends far beyond the city's walls.\n§YEffects§!\n§R-60.0%§! §TResident§! Wealth expenditure on Urban Infrastructure\n§G+7.5%§! £estate_city_burghers_icon_small£ §OBurgher§! Wealth expenditure on Urban Infrastructure\n§YProperty Tax (£estate_city_burghers_icon_small£)§!\n	     (§Y1%§! * £estate_city_burghers_icon_small£ §OBurgher§! Power) of §TResident§! Wealth transferred to £estate_city_burghers_icon_small£ §OBurgher§! Wealth\n	     (§Y0.2%§! * £estate_city_burghers_icon_small£ §OBurgher§! Power) of §lPeasantry§! Wealth transferred to £estate_city_burghers_icon_small£ §OBurgher§! Wealth\n§G+5.0%§! Urban Skill\n§G+10.0%§! Fashion and Trade Skill\n§G+15.0%§! Education Skill\n§YCitizens Levy§!\n	     §Y20%§! Base Manpower from §TResidents§!\n§R+75.0%§! Autonomy from £estate_city_burghers_icon_small£ §OBurghers§!\n§R+35.0%§! £estate_city_burghers_icon_small£ §OBurghers§! Power from Wealth\n§R+10.0%§! £estate_city_burghers_icon_small£ §OBurgher§! Gravity"
 mtui_at_bg_rt_BGGov_i6_tt:0 "[Rights_BGGov7_title]\nThe rule of cities and the rule of the countryside are one and the same, city government having extended to cover nigh on the entire realm, leaving provincial government to a patchwork of whichever municipalities have jurisdiction over the countryside.\n§YEffects§!\n§R-80.0%§! §TResident§! Wealth expenditure on Urban Infrastructure\n§G+10.0%§! £estate_city_burghers_icon_small£ §OBurgher§! Wealth expenditure on Urban Infrastructure\n§YEffects§!\n§YProperty Tax (£estate_city_burghers_icon_small£)§!\n	     (§Y1%§! * £estate_city_burghers_icon_small£ §OBurgher§! Power) of §TResident§! Wealth transferred to £estate_city_burghers_icon_small£ §OBurgher§! Wealth\n	     (§Y0.5%§! * £estate_city_burghers_icon_small£ §OBurgher§! Power) of §lPeasantry§! Wealth transferred to £estate_city_burghers_icon_small£ §OBurgher§! Wealth\n§G+5.0%§! Urban Skill\n§G+20.0%§! Fashion and Trade Skill\n§G+30.0%§! Education Skill\n§YCitizens Levy§!\n	     §Y30%§! Base Manpower from §TResidents§!\n§R+100.0%§! Autonomy from £estate_city_burghers_icon_small£ §OBurghers§!\n§R+50.0%§! £estate_city_burghers_icon_small£ §OBurghers§! Power from Wealth\n§R+20.0%§! £estate_city_burghers_icon_small£ §OBurgher§! Gravity"
