 mtui_at_s_bq_corrupt_n:0 "Provincial corruption"
 mtui_at_s_bq_corrupt_n_tt:0 "§YProvincial corruption§!: [mtui_C_corrupt] ([Prov_BULoyChange])\nThe average §Yprovincial corruption§!, in brackets its change at the last yearly census. (The §Ystate corruption§! of the central government is the number beside the corruption icon in the top bar.)\n\n§YSources of Corruption§!\n - £estate_greater_nobles_icon_small£[Prov_Noble_P]: §R+[GV_Crpt_NO]%§! £loc_corruption£\n - £estate_city_burghers_icon_small£ Burghers: §R+[GV_Crpt_BG]%§! £loc_corruption£\n - £estate_church_icon_small£ Clergy: §R+[GV_Crpt_CL]%§! £loc_corruption£\n - £estate_bureaucracy_icon_small£ State: §R+[GV_Crpt_State]%§! £loc_corruption£\n - £estate_bureaucracy_icon_small£ Laws: §R+[GV_Crpt_Reform]%§! £loc_corruption£\n - £estate_bureaucracy_icon_small£ State Property: §R+[GV_Crpt_StateP]%§! £loc_corruption£\n\n§YSource Multipliers (in order)§!\n - £loc_autonomy£ Autonomy: §R[GV_Crpt_LA]x§!\n - £loc_cash_no£ Wages: §R[GV_Crpt_Wages]x§! (scaled by §MState Reach§! £estate_bureaucracy_icon_small£)\n - £loc_policies£ Other: §R[GV_Crpt_Other]x§!\n--------------------------------------\n§YSources of Corruption from Laws:§!\n[Crpt_Reform_Sources_BUOffice][Crpt_Reform_Sources_BUFarm][Crpt_Reform_Sources_BUTenure][Crpt_Reform_Sources_BUHierarchy][Crpt_Reform_Sources_BUHire][Crpt_Reform_Sources_BUExams][Crpt_Reform_Sources_BUOversight][Crpt_Reform_Sources_BUCourts][Crpt_Reform_Sources_BURotate][Crpt_Reform_Sources_CrptRecall][Crpt_Reform_DifficultyLevel]  - Current State Reach: §Yx [GV_Prov_BUPow]% ^2§!\n  - Balancing factor: §Gx 0.8§! (to be removed)\n\n Provincial corruption redirects the same percentage of tax and property income to the elites before any expenses. High provincial corruption can bankrupt a nation and destroy state armies. State reach being squared means that at low state reach corruption from laws in negligable whilst quickly becoming the largest factor to corruption as it climbs higher. The provincial corruption number here is an average of your provinces provincial corruption, it does not do anything by itself all effects applied locally with the local level of provincial corruption.[mtui_tb_corrupt_tt_guide]\n\n§gClick the icon: open the State tab of the Nation Atlas§!"
 mtui_at_s_bq_corrupt_v:0 "[mtui_C_corrupt] ([Prov_BULoyChange])"
 mtui_at_s_bq_corrupt_v_tt:0 "§YProvincial corruption§!: [mtui_C_corrupt] ([Prov_BULoyChange])\nThe average §Yprovincial corruption§!, in brackets its change at the last yearly census. (The §Ystate corruption§! of the central government is the number beside the corruption icon in the top bar.)\n\n§YSources of Corruption§!\n - £estate_greater_nobles_icon_small£[Prov_Noble_P]: §R+[GV_Crpt_NO]%§! £loc_corruption£\n - £estate_city_burghers_icon_small£ Burghers: §R+[GV_Crpt_BG]%§! £loc_corruption£\n - £estate_church_icon_small£ Clergy: §R+[GV_Crpt_CL]%§! £loc_corruption£\n - £estate_bureaucracy_icon_small£ State: §R+[GV_Crpt_State]%§! £loc_corruption£\n - £estate_bureaucracy_icon_small£ Laws: §R+[GV_Crpt_Reform]%§! £loc_corruption£\n - £estate_bureaucracy_icon_small£ State Property: §R+[GV_Crpt_StateP]%§! £loc_corruption£\n\n§YSource Multipliers (in order)§!\n - £loc_autonomy£ Autonomy: §R[GV_Crpt_LA]x§!\n - £loc_cash_no£ Wages: §R[GV_Crpt_Wages]x§! (scaled by §MState Reach§! £estate_bureaucracy_icon_small£)\n - £loc_policies£ Other: §R[GV_Crpt_Other]x§!\n--------------------------------------\n§YSources of Corruption from Laws:§!\n[Crpt_Reform_Sources_BUOffice][Crpt_Reform_Sources_BUFarm][Crpt_Reform_Sources_BUTenure][Crpt_Reform_Sources_BUHierarchy][Crpt_Reform_Sources_BUHire][Crpt_Reform_Sources_BUExams][Crpt_Reform_Sources_BUOversight][Crpt_Reform_Sources_BUCourts][Crpt_Reform_Sources_BURotate][Crpt_Reform_Sources_CrptRecall][Crpt_Reform_DifficultyLevel]  - Current State Reach: §Yx [GV_Prov_BUPow]% ^2§!\n  - Balancing factor: §Gx 0.8§! (to be removed)\n\n Provincial corruption redirects the same percentage of tax and property income to the elites before any expenses. High provincial corruption can bankrupt a nation and destroy state armies. State reach being squared means that at low state reach corruption from laws in negligable whilst quickly becoming the largest factor to corruption as it climbs higher. The provincial corruption number here is an average of your provinces provincial corruption, it does not do anything by itself all effects applied locally with the local level of provincial corruption.[mtui_tb_corrupt_tt_guide]\n\n§gClick the icon: open the State tab of the Nation Atlas§!"
 mtui_at_s_bq_authority_n:0 "Authority"
 mtui_at_s_bq_authority_n_tt:0 "§YAuthority§!: [mtui_C_authority]\n§Y[Root.Monarch.GetTitle] [Root.Monarch.GetName] [Root.Monarch.Dynasty.GetName]§!'s Skill\n £adm£ [GV_Ruler_SkillADM] £dip£ [GV_Ruler_SkillDIP] £mil£ [GV_Ruler_SkillMIL]\n\n§YRuler Impact§!: [Ruler_ImpactCol]\n  - Ruler Authority: §Y[GV_Ruler_AuthRuler]§! £loc_loyalty£ (change of §Y[GV_Ruler_AuthRulerChange]§! yearly, towards resting point of §Y[GV_Ruler_AuthRulerRest]§!)\n[RulerPower_Base][RulerPower_Personality][RulerPower_GovtReforms][RulerPower_NIs][RulerPower_representation_ideas_5][RulerPower_bureaucracy_ideas_3]\n  - Institutional Authority: §Y[GV_Ruler_AuthInstitution]§! £loc_stability£ (change of §Y[GV_Ruler_AuthInstitutionChange]§! yearly, towards resting point of §Y[GV_Ruler_AuthInstitutionRest]§!)\n[InstPower_Base][InstPower_Personality][InstPower_GovtReforms][InstPower_NIs][InstPower_representation_ideas_5][InstPower_bureaucracy_ideas_3]\n§YExecutive Power§!: £loc_diplomatic£  [GV_Ruler_SkillScaled] ([Ruler_PowerCol])\n £adm£ [GV_Ruler_ADM] £dip£ [GV_Ruler_DIP] £mil£ [GV_Ruler_MIL]\n  - Power Void: §R+[GV_Ruler_CrptImpact]§! £icon_corruption_small£\n\nExecutive Authority represents the potential power of the executive over the state, and the ability to exert that power. Absolutist rule can empower strong leaders and unleash their potential, while strong institutions or representative rule can help prevent a weak leader from unleashing instability and chaos. Executive authority also has influences on how many reforms can be enacted at the same time.\n\nThe capacity of the ruler to impact the realm is summed as the average of Ruler Authority and inverse Institutional Authority. Lower Ruler Impact will mean a more reliable power output, at the cost of nullifying the potential benefits of a strong ruler.[mtui_tb_authority_tt_guide]"
 mtui_at_s_bq_authority_v:0 "[mtui_C_authority]"
 mtui_at_s_bq_authority_v_tt:0 "§YAuthority§!: [mtui_C_authority]\n§Y[Root.Monarch.GetTitle] [Root.Monarch.GetName] [Root.Monarch.Dynasty.GetName]§!'s Skill\n £adm£ [GV_Ruler_SkillADM] £dip£ [GV_Ruler_SkillDIP] £mil£ [GV_Ruler_SkillMIL]\n\n§YRuler Impact§!: [Ruler_ImpactCol]\n  - Ruler Authority: §Y[GV_Ruler_AuthRuler]§! £loc_loyalty£ (change of §Y[GV_Ruler_AuthRulerChange]§! yearly, towards resting point of §Y[GV_Ruler_AuthRulerRest]§!)\n[RulerPower_Base][RulerPower_Personality][RulerPower_GovtReforms][RulerPower_NIs][RulerPower_representation_ideas_5][RulerPower_bureaucracy_ideas_3]\n  - Institutional Authority: §Y[GV_Ruler_AuthInstitution]§! £loc_stability£ (change of §Y[GV_Ruler_AuthInstitutionChange]§! yearly, towards resting point of §Y[GV_Ruler_AuthInstitutionRest]§!)\n[InstPower_Base][InstPower_Personality][InstPower_GovtReforms][InstPower_NIs][InstPower_representation_ideas_5][InstPower_bureaucracy_ideas_3]\n§YExecutive Power§!: £loc_diplomatic£  [GV_Ruler_SkillScaled] ([Ruler_PowerCol])\n £adm£ [GV_Ruler_ADM] £dip£ [GV_Ruler_DIP] £mil£ [GV_Ruler_MIL]\n  - Power Void: §R+[GV_Ruler_CrptImpact]§! £icon_corruption_small£\n\nExecutive Authority represents the potential power of the executive over the state, and the ability to exert that power. Absolutist rule can empower strong leaders and unleash their potential, while strong institutions or representative rule can help prevent a weak leader from unleashing instability and chaos. Executive authority also has influences on how many reforms can be enacted at the same time.\n\nThe capacity of the ruler to impact the realm is summed as the average of Ruler Authority and inverse Institutional Authority. Lower Ruler Impact will mean a more reliable power output, at the cost of nullifying the potential benefits of a strong ruler.[mtui_tb_authority_tt_guide]"
 mtui_at_s_bq_property_n:0 "State property"
 mtui_at_s_bq_property_n_tt:0 "§YState property§!: §Y[mtui_V_property]%§! of cap\nThe State owns rights to §G[GV_StatePropertyTotal]§! units of a countrywide total property of §G[GV_PropertyTotal]§! owned by all classes together.\nThe state owns §G[GV_StatePropertyPercTotal]%§! of the total property.\n\nWith §G[GV_StatePropertyTotalModified]§! of max. §G[GV_StatePropertyCapacity]§! units of property, the state controls §G[GV_StatePropertyPercCap]%§! of the possible State Property Ownership. The State Property unmodified is §G[GV_StatePropertyTotal]§! and modified §G[GV_StatePropertyTotalModified]§!.\n\nYour State property capacity is calculated from:\n§G[GV_Modi_StatePropertyFlat]§! x §G[GV_Modi_StatePropertyPerc]§! = §G[GV_StatePropertyCapacity]§!\n\nCalculation for each modified property:\n§G[GV_Modi_StatePropertyAgriculture]§! x Agriculture Property = §G[GV_StatePropertyAgriculture]§!\n§G[GV_Modi_StatePropertyForestry]§! x Forestry Property = §G[GV_StatePropertyForestry]§!\n§G[GV_Modi_StatePropertyExtraction]§! x Extraction Property = §G[GV_StatePropertyExtraction]§!\n§G[GV_Modi_StatePropertyFishery]§! x Fishery Property = §G[GV_StatePropertyFishery]§!\n§G[GV_Modi_StatePropertyIndustrial]§! x Industrial Property = §G[GV_StatePropertyIndustrial]§!\n§G[GV_Modi_StatePropertyCommercial]§! x Commercial Property = §G[GV_StatePropertyCommercial]§!\n§G[GV_Modi_StatePropertyAcademic]§! x Academic Property = §G[GV_StatePropertyAcademic]§![mtui_tb_property_tt_guide]"
 mtui_at_s_bq_property_v:0 "§Y[mtui_V_property]%§!"
 mtui_at_s_bq_property_v_tt:0 "§YState property§!: §Y[mtui_V_property]%§! of cap\nThe State owns rights to §G[GV_StatePropertyTotal]§! units of a countrywide total property of §G[GV_PropertyTotal]§! owned by all classes together.\nThe state owns §G[GV_StatePropertyPercTotal]%§! of the total property.\n\nWith §G[GV_StatePropertyTotalModified]§! of max. §G[GV_StatePropertyCapacity]§! units of property, the state controls §G[GV_StatePropertyPercCap]%§! of the possible State Property Ownership. The State Property unmodified is §G[GV_StatePropertyTotal]§! and modified §G[GV_StatePropertyTotalModified]§!.\n\nYour State property capacity is calculated from:\n§G[GV_Modi_StatePropertyFlat]§! x §G[GV_Modi_StatePropertyPerc]§! = §G[GV_StatePropertyCapacity]§!\n\nCalculation for each modified property:\n§G[GV_Modi_StatePropertyAgriculture]§! x Agriculture Property = §G[GV_StatePropertyAgriculture]§!\n§G[GV_Modi_StatePropertyForestry]§! x Forestry Property = §G[GV_StatePropertyForestry]§!\n§G[GV_Modi_StatePropertyExtraction]§! x Extraction Property = §G[GV_StatePropertyExtraction]§!\n§G[GV_Modi_StatePropertyFishery]§! x Fishery Property = §G[GV_StatePropertyFishery]§!\n§G[GV_Modi_StatePropertyIndustrial]§! x Industrial Property = §G[GV_StatePropertyIndustrial]§!\n§G[GV_Modi_StatePropertyCommercial]§! x Commercial Property = §G[GV_StatePropertyCommercial]§!\n§G[GV_Modi_StatePropertyAcademic]§! x Academic Property = §G[GV_StatePropertyAcademic]§![mtui_tb_property_tt_guide]"
 mtui_at_s_rt_h:0 "§YState Rights§!"
 mtui_at_s_rt_pk:0 "[mtui_pk_short]"
 mtui_at_s_rt_BUTax_n:0 "Tax Collection"
 mtui_at_s_rt_BUTax_n_tt:0 "§YTax Collection§![mtui_at_s_rt_BUTax_n_tt_guide]"
 mtui_at_s_rt_BUTax_n_tt_guide_on:0 "\n--------------------------------------\nFor a central governing authority to collect revenues beyond the natural relationship between the ruler and the elites, a real administrative apparatus is required as an intermediary. In the absence of such a service, collection can be farmed by private individuals, splitting revenues in exchange for the majority cut. With a real bureaucracy however, advanced flows of wealth can be legally collected across the realm, developing a loyal administration with the capabilities and efficiency to build a real state.\n\n§GWhy it matters:§! Decides who collects the taxes: private tax farmers who keep a cut, or salaried officials. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. The change applies at once and opens a reform package (right): enact it right away, or add further changes first. Reforming too much too quickly hurts stability and angers the elites."
 mtui_at_s_rt_BUTax_l:0 "§Y[mtui_L_RBUTax]§!"
 mtui_at_s_rt_BUTax_l_tt:0 "§YTax Collection§![mtui_at_s_rt_BUTax_l_tt_guide]"
 mtui_at_s_rt_BUTax_l_tt_guide_on:0 "\n--------------------------------------\nFor a central governing authority to collect revenues beyond the natural relationship between the ruler and the elites, a real administrative apparatus is required as an intermediary. In the absence of such a service, collection can be farmed by private individuals, splitting revenues in exchange for the majority cut. With a real bureaucracy however, advanced flows of wealth can be legally collected across the realm, developing a loyal administration with the capabilities and efficiency to build a real state.\n\n§GWhy it matters:§! Decides who collects the taxes: private tax farmers who keep a cut, or salaried officials. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. The change applies at once and opens a reform package (right): enact it right away, or add further changes first. Reforming too much too quickly hurts stability and angers the elites."
 mtui_at_s_rt_BUTax_dn_tt:0 "Step back §YTax Collection§!. Opens or joins a reform package."
 mtui_at_s_rt_BUTax_i0_tt:0 "[Rights_BUTax1_title]\nAny and all tax collection is handled by private individuals who, on an annual basis, buy the right to collect taxes, the money they give substituting for actual tax revenue.\n§YEffects§!\n§Y5%§! + (§Y5%§! * £estate_bureaucracy_icon_small£ §MState Reach§!) Base Tax Efficiency\n§R+30.0%§! Tax Revenue transferred to Elites based on Power share\n§GEnables§! £adm£§YLand Tax§! taxation\n§GEnables§! £adm£§YTollage§! taxation\n§GEnables§! £adm£§YPoll Tax§! taxation\n§R-1.00§! £loc_pitchfork£Base Welfare"
 mtui_at_s_rt_BUTax_i1_tt:0 "[Rights_BUTax2_title]\nState officials responsible for revenues manage a network of private individuals who lease the right of tax collection, handling the process for the state with minimal bureaucratic overhead.\n§YEffects§!\n§Y10%§! + (§Y10%§! * £estate_bureaucracy_icon_small£ §MState Reach§!) Base Tax Efficiency\n§G-5.0%§! Mana Cost of all State Taxes\n§R+10.0%§! Tax Revenue transferred to Elites based on Power share\n§GEnables§! £adm£§YLand Tax§! taxation\n§GEnables§! £adm£§YTollage§! taxation\n§GEnables§! £adm£§YPoll Tax§! taxation\n§GEnables§! £adm£§YSalt Excise§! taxation\n§GEnables§! £adm£§YTimber Excise§! taxation"
 mtui_at_s_rt_BUTax_i2_tt:0 "[Rights_BUTax3_title]\nA unified tax administration of civil servants collects tax across the realm, working for the state in exchange for a salary and possible promotion.\n§YEffects§!\n(§Y80%§! * £estate_bureaucracy_icon_small£ §MState Reach§!) Base Tax Efficiency\n§G-30.0%§! Mana Cost of all State Taxes\n§GEnables§! use of all £estate_bureaucracy_icon_small£ §MState§! taxation\n§G+0.15§! Yearly £estate_bureaucracy_icon_small£ §MState Reach§!"
 mtui_at_s_rt_BUTax_i3_tt:0 "[Rights_BUTax4_title]\nA highly bureaucratic and meritocratic civil service administers tax collection across the realm, loyal to the state and actively working to prevent tax fraud.\n§YEffects§!\n(§Y100%§! * £estate_bureaucracy_icon_small£ §MState Reach§!) Base Tax Efficiency\n§G-30.0%§! Mana Cost of all State Taxes\n§GEnables§! use of all £estate_bureaucracy_icon_small£ §MState§! taxation\n§G+0.50§! Yearly £estate_bureaucracy_icon_small£ §MState Reach§!"
 mtui_at_s_rt_BUTax_up_tt:0 "Reform §YTax Collection§!. Opens or joins a reform package."
 mtui_at_s_rt_BUDir_n:0 "Direct Taxation"
 mtui_at_s_rt_BUDir_n_tt:0 "§YDirect Taxation§![mtui_at_s_rt_BUDir_n_tt_guide]"
 mtui_at_s_rt_BUDir_n_tt_guide_on:0 "\n--------------------------------------\nThe most expansive taxes with the greatest potential have the highest burden upon any state administration. Reforms to the collection of direct taxation can provide real revenues for the state, while improving the capacity of the state to also expand that apparatus to military organisation and recruitment.\n\n§GWhy it matters:§! How far the state may tax people and property directly, instead of relying on the elites. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. The change applies at once and opens a reform package (right): enact it right away, or add further changes first. Reforming too much too quickly hurts stability and angers the elites."
 mtui_at_s_rt_BUDir_l:0 "§Y[mtui_L_RBUDir]§!"
 mtui_at_s_rt_BUDir_l_tt:0 "§YDirect Taxation§![mtui_at_s_rt_BUDir_l_tt_guide]"
 mtui_at_s_rt_BUDir_l_tt_guide_on:0 "\n--------------------------------------\nThe most expansive taxes with the greatest potential have the highest burden upon any state administration. Reforms to the collection of direct taxation can provide real revenues for the state, while improving the capacity of the state to also expand that apparatus to military organisation and recruitment.\n\n§GWhy it matters:§! How far the state may tax people and property directly, instead of relying on the elites. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. The change applies at once and opens a reform package (right): enact it right away, or add further changes first. Reforming too much too quickly hurts stability and angers the elites."
 mtui_at_s_rt_BUDir_dn_tt:0 "Step back §YDirect Taxation§!. Opens or joins a reform package."
 mtui_at_s_rt_BUDir_i0_tt:0 "[Rights_BUDir1_title]\nThe rights to collect most direct taxes are sold to tax farmers, reducing state costs and administrative overextension.\n§YEffects§!\n§Y10%§! + (§Y10%§! * £estate_bureaucracy_icon_small£ §MState Reach§!) Base Direct Tax Efficiency\n§G-5.0%§! Mana Cost of all State Direct Taxes\n§GEnables§! £adm£§YLand Tax§! taxation\n§GEnables§! £adm£§YPoll Tax§! taxation\n§R-0.50§! £loc_pitchfork£Base Welfare"
 mtui_at_s_rt_BUDir_i1_tt:0 "[Rights_BUDir2_title]\nThe state's collection of all direct taxes is managed by way of a crude bureaucracy of collectors and regional officials, reducing dependency on third parties and avoiding the worst excesses of tax farmers.\n§YEffects§!\n(§Y40%§! * £estate_bureaucracy_icon_small£ §MState Reach§!) Base Direct Tax Efficiency\n§G-10.0%§! Mana Cost of all State Direct Taxes\n§GEnables§! £adm£§YLand Tax§! taxation\n§GEnables§! £adm£§YPoll Tax§! taxation\n§GEnables§! £adm£§YProperty Tax§! taxation\n§GEnables§! £adm£§YInheritance Tax§! taxation"
 mtui_at_s_rt_BUDir_i2_tt:0 "[Rights_BUDir3_title]\nDirect taxation is administered by an institutional tax bureaucracy staffed by civil servants, whose job is just as much to collect and record information about taxpayers as it is to actually collect.\n§YEffects§!\n(§Y60%§! * £estate_bureaucracy_icon_small£ §MState Reach§!) Base Direct Tax Efficiency\n§G-20.0%§! Mana Cost of all State Direct Taxes\n§GEnables§! £adm£§YLand Tax§! taxation\n§GEnables§! £adm£§YPoll Tax§! taxation\n§GEnables§! £adm£§YProperty Tax§! taxation\n§GEnables§! £adm£§YInheritance Tax§! taxation\n§GEnables§! £adm£§YChattels Tax§! taxation"
 mtui_at_s_rt_BUDir_up_tt:0 "Reform §YDirect Taxation§!. Opens or joins a reform package."
 mtui_at_s_rt_BUInd_n:0 "Indirect Taxation"
 mtui_at_s_rt_BUInd_n_tt:0 "§YIndirect Taxation§![mtui_at_s_rt_BUInd_n_tt_guide]"
 mtui_at_s_rt_BUInd_n_tt_guide_on:0 "\n--------------------------------------\nThrough a focus on collecting revenues from goods and services instead of sources of income, indirect taxation can be easier to reform for a newfound state.\n\n§GWhy it matters:§! How far the state may tax trade and goods (excises, tariffs). Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. The change applies at once and opens a reform package (right): enact it right away, or add further changes first. Reforming too much too quickly hurts stability and angers the elites."
 mtui_at_s_rt_BUInd_l:0 "§Y[mtui_L_RBUInd]§!"
 mtui_at_s_rt_BUInd_l_tt:0 "§YIndirect Taxation§![mtui_at_s_rt_BUInd_l_tt_guide]"
 mtui_at_s_rt_BUInd_l_tt_guide_on:0 "\n--------------------------------------\nThrough a focus on collecting revenues from goods and services instead of sources of income, indirect taxation can be easier to reform for a newfound state.\n\n§GWhy it matters:§! How far the state may tax trade and goods (excises, tariffs). Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. The change applies at once and opens a reform package (right): enact it right away, or add further changes first. Reforming too much too quickly hurts stability and angers the elites."
 mtui_at_s_rt_BUInd_dn_tt:0 "Step back §YIndirect Taxation§!. Opens or joins a reform package."
 mtui_at_s_rt_BUInd_i0_tt:0 "[Rights_BUInd1_title]\nThe rights to tax certain activities or transactions within a jurisdiction are sold to tax farmers, reducing state costs and administrative bloat.\n§YEffects§!\n§Y10%§! + (§Y10%§! * £estate_bureaucracy_icon_small£ §MState Reach§!) Base Indirect Tax Efficiency\n§G-5.0%§! Mana Cost of all State Indirect Taxes\n§GEnables§! £adm£§YTollage§! taxation\n§GEnables§! £adm£§YSalt Excise§! taxation\n§GEnables§! £adm£§YTimber Excise§! taxation\n§R-0.50§! £loc_pitchfork£Base Welfare"
 mtui_at_s_rt_BUInd_i1_tt:0 "[Rights_BUInd2_title]\nThe state's collection of indirect taxes is managed by way of a crude bureaucracy of customs officials, informants and inspectors, reducing dependency on third parties and avoiding the worst excesses of tax farmers.\n§YEffects§!\n(§Y40%§! * £estate_bureaucracy_icon_small£ §MState Reach§!) Base Indirect Tax Efficiency\n§G-10.0%§! Mana Cost of all State Indirect Taxes\n§GEnables§! £adm£§YTollage§! taxation\n§GEnables§! £adm£§YSalt Excise§! taxation\n§GEnables§! £adm£§YTimber Excise§! taxation\n§GEnables§! £adm£§YSubstances Excise§! taxation"
 mtui_at_s_rt_BUInd_i2_tt:0 "[Rights_BUInd3_title]\nIndirect taxes are administered by an institutional tax bureaucracy staffed by civil servants, whose job is just as much to collect and record information about the activities they tax as it is to actually tax them.\n§YEffects§!\n(§Y60%§! * £estate_bureaucracy_icon_small£ §MState Reach§!) Base Indirect Tax Efficiency\n§G-20.0%§! Mana Cost of all State Indirect Taxes\n§GEnables§! £adm£§YTollage§! taxation\n§GEnables§! £adm£§YSalt Excise§! taxation\n§GEnables§! £adm£§YTimber Excise§! taxation\n§GEnables§! £adm£§YSubstances Excise§! taxation\n§GEnables§! £adm£§YAlcohol Excise§! taxation"
 mtui_at_s_rt_BUInd_up_tt:0 "Reform §YIndirect Taxation§!. Opens or joins a reform package."
 mtui_at_s_rt_BUSer_n:0 "Military Service"
 mtui_at_s_rt_BUSer_n_tt:0 "§YMilitary Service§![mtui_at_s_rt_BUSer_n_tt_guide]"
 mtui_at_s_rt_BUSer_n_tt_guide_on:0 "\n--------------------------------------\nOnce the beginnings of an alternative organisation structure has been established for military service, new forms of recruitment can be implemented through enlistment reform. Levying men directly through governmental administration can require a strong bureaucracy and supporting service, yet provides the highest potential for massive mobilisation for a rising state.\n\n§GWhy it matters:§! How soldiers are raised: through the elites, or by the state itself. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. The change applies at once and opens a reform package (right): enact it right away, or add further changes first. Reforming too much too quickly hurts stability and angers the elites."
 mtui_at_s_rt_BUSer_l:0 "§Y[mtui_L_RBUSer]§!"
 mtui_at_s_rt_BUSer_l_tt:0 "§YMilitary Service§![mtui_at_s_rt_BUSer_l_tt_guide]"
 mtui_at_s_rt_BUSer_l_tt_guide_on:0 "\n--------------------------------------\nOnce the beginnings of an alternative organisation structure has been established for military service, new forms of recruitment can be implemented through enlistment reform. Levying men directly through governmental administration can require a strong bureaucracy and supporting service, yet provides the highest potential for massive mobilisation for a rising state.\n\n§GWhy it matters:§! How soldiers are raised: through the elites, or by the state itself. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. The change applies at once and opens a reform package (right): enact it right away, or add further changes first. Reforming too much too quickly hurts stability and angers the elites."
 mtui_at_s_rt_BUSer_dn_tt:0 "Step back §YMilitary Service§!. Opens or joins a reform package."
 mtui_at_s_rt_BUSer_i0_tt:0 "[Rights_BUSer1_title]\nAll recruitment and organisation is devolved to the [Prov_Noble_P], including recruitment from the state demesne.\n§YEffects§!\n§G+1.00§!£estate_greater_nobles_icon_small£Base Hierarchy\n§R-5.0%§! Army Professionalism"
 mtui_at_s_rt_BUSer_i1_tt:0 "[Rights_BUSer2_title]\nBasic infrastructure allows for the recruitment of volunteers into a state levy, ready to serve in times of need.\n§YEffects§!\n(§Y0.1§! * £loc_pitchfork£Welfare) * (§Y5%§! * £estate_bureaucracy_icon_small£ §MState Reach§!) Base Manpower from all non-Elite classes"
 mtui_at_s_rt_BUSer_i2_tt:0 "[Rights_BUSer3_title]\nExtensive investments allow for the enlistment of a permanent army core, serving the state in exchange for some form of reward.\n§YEffects§!\n(§Y50%§! * £estate_bureaucracy_icon_small£ §MState Reach§!) Base Manpower from all non-Elite classes\n§G+5.0%§! Army Professionalism\n-§R100.0%§! Mercenary Company Size"
 mtui_at_s_rt_BUSer_i3_tt:0 "[Rights_BUSer4_title]\nAll male citizens above a certain age are required to serve if called upon, creating a vast pool of manpower to serve in the military.\n§YEffects§!\n(§Y100%§! * £estate_bureaucracy_icon_small£ §MState Reach§!) Base Manpower from all non-Elite classes\n§G10.0%§! Army Professionalism\n-§R100.0%§! Mercenary Company Size"
 mtui_at_s_rt_BUSer_up_tt:0 "Reform §YMilitary Service§!. Opens or joins a reform package."
 mtui_at_s_dir_h:0 "§YDirect the Bureaucrats§!"
 mtui_at_s_dir_d:0 "§gWin the bureaucrats over, or put them to work.§!"
 mtui_at_s_a_boost_l:0 "Promote Faction"
 mtui_at_s_a_boost_tt:0 "§YPromote the bureaucrat faction.§!\nGives the bureaucrats more influence at court, which many reforms require."
 mtui_at_s_a_advisor_l:0 "Align the Cabinet"
 mtui_at_s_a_advisor_tt:0 "§YAlign the cabinet with the bureaucrats.§!\nBrings bureaucrats into the government for a while. Some reforms require it."
 mtui_at_s_a_traders_l:0 "Empower Traders"
 mtui_at_s_a_traders_tt:0 "§YEmpower local traders.§!\nLets the officials of our trade posts work with local merchants."
 mtui_at_s_a_develop_l:0 "Expand Bureaucracy"
 mtui_at_s_a_develop_tt:0 "§YIncrease state reach.§!\nAppoint more officials across the realm. Raises state reach (better taxation) but also corruption."
 mtui_at_s_crpt_h:0 "§YFight Corruption§!"
 mtui_at_s_crpt_d:0 "§gMeasures against corruption. They share one cooldown: after one, the next has to wait.§!"
 mtui_at_s_crpt_cd:0 "[mtui_crpt_cd]"
 mtui_at_s_a_c_loy_l:0 "Leverage the Elites"
 mtui_at_s_a_c_loy_tt:0 "§YLeverage the elites against corruption.§!\nCuts corruption at the cost of the elites' loyalty."
 mtui_at_s_a_c_stab_l:0 "Overturn Status Quo"
 mtui_at_s_a_c_stab_tt:0 "§YOverturn the status quo.§!\nA purge of the administration: cuts corruption, but costs stability."
 mtui_at_s_a_c_skill_l:0 "Influence Executive"
 mtui_at_s_a_c_skill_tt:0 "§YThe ruler steps in personally.§!\nA skilled ruler can cut corruption sharply, at a high cost in power and prestige."
 mtui_at_s_a_c_wages_l:0 "Raise Wages"
 mtui_at_s_a_c_wages_tt:0 "§YRaise administrative wages.§!\nBetter paid officials steal less, but the bureaucracy costs more."
 mtui_at_s_a_c_recall_l:0 "Recall Officials"
 mtui_at_s_a_c_recall_tt:0 "§YRecall corrupt officials.§!\nReplaces corrupt officials; state reach cannot be expanded meanwhile."
 mtui_at_s_a_c_revit_l:0 "Revitalise Admin"
 mtui_at_s_a_c_revit_tt:0 "§YRevitalise the administration.§!\nA thorough reorganisation against corruption that angers the bureaucrats."
 mtui_at_s_pk_h:0 "§YReform Package§!"
 mtui_at_s_pk_st:0 "[mtui_pk_status]"
 mtui_at_s_pk_st_tt:0 "§YReform package§![mtui_at_s_pk_st_tt_guide]"
 mtui_at_s_pk_st_tt_guide_on:0 "\n--------------------------------------\nChanges to the rights of the state and of the estates are passed as a reform package: a single change enacted right away, or several changes planned together. A package is enacted automatically six months after its first change, or earlier with Enact now.\n\n§GWhy it matters:§! Reform unsettles the realm. Every package costs stability and legitimacy and leaves the administration unable to pass new rights reforms for years. The more you change at once, the harsher the blow: the elites object to changes that touch them, and an estate pushed too far may rise in civil war.\n\n§OHow to change it:§! Be cautious: change little at a time, and enact at high stability and with strong executive authority. Backing down drops the whole package, at a cost to our authority."
 mtui_at_s_pk_sev:0 "Severity §Y[This.mtui_a_rf_sev.GetValue]§! of 10\nIf enacted now: [mtui_pk_tier]"
 mtui_at_s_pk_sev_tt:0 "§YSeverity§![mtui_at_s_pk_sev_tt_guide]"
 mtui_at_s_pk_sev_tt_guide_on:0 "\n--------------------------------------\nHow disruptive the planned package is. Every change adds to it; it is multiplied by a stability factor (x1.1 to x1.5 at very high or very low stability) and by executive authority (weak authority makes it worse).\n\n§GWhy it matters:§! The severity decides the penalty when the package is enacted: from -50% stability progress (minor) to -5 stability and more (extreme), plus legitimacy and years of more expensive stability. Above 10 no further changes can be added.\n\n§OHow to change it:§! Plan fewer changes, raise stability and executive authority before enacting."
 mtui_at_s_pk_ch_h:0 "§YPlanned Changes§!"
 mtui_at_s_pk_ch:0 "[mtui_pk_NOGov][mtui_pk_NOObl][mtui_pk_NOTen][mtui_pk_NOSer][mtui_pk_BGCom][mtui_pk_BGGov][mtui_pk_CLHie][mtui_pk_CLObl][mtui_pk_CLTax][mtui_pk_BUTax][mtui_pk_BUDir][mtui_pk_BUInd][mtui_pk_BUSer]"
 mtui_at_s_pk_m_h:0 "§YExpected Reactions§!"
 mtui_at_s_pk_m:0 "[mtui_pk_m_NO][mtui_pk_m_BG][mtui_pk_m_CL][mtui_pk_m_TR][mtui_pk_m_BU]"
 mtui_at_s_pk_m_tt:0 "How each estate will react when the package is enacted. Displeased estates lose loyalty; furious ones may rise in civil war."
 mtui_at_s_pk_enact_l:0 "Enact Now"
 mtui_at_s_pk_enact_tt:0 "§YEnact the reform package now.§!\nThe planned changes are passed; stability suffers and the estates react."
 mtui_at_s_pk_back_l:0 "Back Down"
 mtui_at_s_pk_back_tt:0 "§YAbandon the reform package.§!\nAll planned changes are undone. Our authority suffers and no new reforms can be planned for about ten years."
 mtui_at_no_pv_h:0 "§YPrivileges§!"
 mtui_at_no_pv_d:0 "§gGranting more pleases them, revoking angers them. Hover a level for its effects.§!"
 mtui_at_no_pv_h0:0 "§YPrivilege§!"
 mtui_at_no_pv_h1:0 "§YLevels§!"
 mtui_at_no_pv_h2:0 "§YCurrent§!"
 mtui_at_no_pv_NOProcessing_n:0 "Processing Monopoly"
 mtui_at_no_pv_NOProcessing_n_tt:0 "§YProcessing Monopoly§![mtui_at_no_pv_NOProcessing_n_tt_guide]"
 mtui_at_no_pv_NOProcessing_n_tt_guide_on:0 "\n--------------------------------------\nThe natural domain of the [Prov_Noble_P] is always extendable, best exemplified in the case of a Processing Monopoly. Special laws and statutes can force tenants on seigneurial land to use the facilities of their rightful lord, granting the [Prov_Noble_P] new revenue and increased power over the peasantry.\n\n§GWhy it matters:§! Each level gives the nobles more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the nobles to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_no_pv_NOProcessing_dn_tt:0 "Lower: [mtui_LD_NOProcessing]"
 mtui_at_no_pv_NOProcessing_i0_tt:0 "[Privilege_NOProcessing0_title]\nThe [Prov_Noble_P] holds no monopoly over processing facilities.§YNo effects§!"
 mtui_at_no_pv_NOProcessing_i1_tt:0 "[Privilege_NOProcessing1_title]\nThe [Prov_Noble_P] holds a partial monopoly over processing facilities, forcing many tenants to use their facilities for tasks such as milling.\n§YEffects§!\n§R+1.0%§!£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Gravity\n§YFeudal Dues§!\n	     §Y+2.5%§! Base Rate for all §lPeasantry§! Dues owed to the£estate_greater_nobles_icon_small£§O[Prov_Noble_P]§!\n§YState Property Capacity Impact§!\n	     §Y-5.0%§! Capacity cost of holding extraction property\n	     §Y+25.0§! State Property Capacity"
 mtui_at_no_pv_NOProcessing_i2_tt:0 "[Privilege_NOProcessing2_title]\nThe [Prov_Noble_P] hold a complete monopoly over processing facilities, forcing tenants wherever possible to use [Prov_Noble] facilities for various tasks, including milling, woodcutting and more.\n§YEffects§!\n§R+2.0%§!£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Gravity\n§YFeudal Dues§!\n	     §Y+5.0%§! Base Rate for all §lPeasantry§! Dues owed to the£estate_greater_nobles_icon_small£§O[Prov_Noble_P]§!\n§YState Property Capacity Impact§!\n	     §Y-10.0%§! Capacity cost of holding extraction property\n	     §Y+50.0§! State Property Capacity"
 mtui_at_no_pv_NOProcessing_up_tt:0 "Raise: [mtui_LU_NOProcessing]"
 mtui_at_no_pv_NOProcessing_l:0 "§Y[mtui_L_NOProcessing]§!"
 mtui_at_no_pv_NOProcessing_l_tt:0 "§YProcessing Monopoly§![mtui_at_no_pv_NOProcessing_l_tt_guide]"
 mtui_at_no_pv_NOProcessing_l_tt_guide_on:0 "\n--------------------------------------\nThe natural domain of the [Prov_Noble_P] is always extendable, best exemplified in the case of a Processing Monopoly. Special laws and statutes can force tenants on seigneurial land to use the facilities of their rightful lord, granting the [Prov_Noble_P] new revenue and increased power over the peasantry.\n\n§GWhy it matters:§! Each level gives the nobles more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the nobles to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_no_pv_NOGame_n:0 "Game Monopoly"
 mtui_at_no_pv_NOGame_n_tt:0 "§YGame Monopoly§![mtui_at_no_pv_NOGame_n_tt_guide]"
 mtui_at_no_pv_NOGame_n_tt_guide_on:0 "\n--------------------------------------\nThe practice of hunting and fishing is an instrumental part of the human experience, and often rewarding for those involved. Though the extent of [Prov_Noble] power varies across the endless expanses of our realm's terrain, special privileges can ensure that where wildlife is involved, the [Prov_Noble_P]'s reach translates into a fair share of all benefits.\n\n§GWhy it matters:§! Each level gives the nobles more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the nobles to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_no_pv_NOGame_dn_tt:0 "Lower: [mtui_LD_NOGame]"
 mtui_at_no_pv_NOGame_i0_tt:0 "[Privilege_NOGame0_title]\nThe [Prov_Noble_P] hold no monopoly on hunting or fishing.§YNo effects§!"
 mtui_at_no_pv_NOGame_i1_tt:0 "[Privilege_NOGame1_title]\nThe [Prov_Noble_P] hold a partial theoretical monopoly over all hunting and fishing, leading to a confusing arrangement for the common folk most commonly resulting in a notably severe tithe.\n§YEffects§!\n§R+1.0%§!£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Gravity\n§YFeudal Dues§!\n	     §Y+15.0%§! of all revenue from §OGame§! industry transfered to £estate_greater_nobles_icon_small£§O[Prov_Noble]§! Wealth\n§YState Property Capacity Impact§!\n	     §Y-5.0%§! Capacity cost of holding forestry property\n	     §Y-5.0%§! Capacity cost of holding fishery property\n	     §Y+25.0§! State Property Capacity"
 mtui_at_no_pv_NOGame_i2_tt:0 "[Privilege_NOGame2_title]\nThe [Prov_Noble_P] hold a theoretically complete monopoly over all hunting and fishing, in practice leading to a mandatory tithe in all territories where the [Prov_Noble_P] hold power.\n§YEffects§!\n§R+2.0%§!£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Gravity\n§YFeudal Dues§!\n	     §Y+30.0%§! of all revenue from §OGame§! industry transfered to £estate_greater_nobles_icon_small£§O[Prov_Noble]§! Wealth\n§YState Property Capacity Impact§!\n	     §Y-15.0%§! Capacity cost of holding forestry property\n	     §Y-10.0%§! Capacity cost of holding fishery property\n	     §Y+50.0§! State Property Capacity"
 mtui_at_no_pv_NOGame_up_tt:0 "Raise: [mtui_LU_NOGame]"
 mtui_at_no_pv_NOGame_l:0 "§Y[mtui_L_NOGame]§!"
 mtui_at_no_pv_NOGame_l_tt:0 "§YGame Monopoly§![mtui_at_no_pv_NOGame_l_tt_guide]"
 mtui_at_no_pv_NOGame_l_tt_guide_on:0 "\n--------------------------------------\nThe practice of hunting and fishing is an instrumental part of the human experience, and often rewarding for those involved. Though the extent of [Prov_Noble] power varies across the endless expanses of our realm's terrain, special privileges can ensure that where wildlife is involved, the [Prov_Noble_P]'s reach translates into a fair share of all benefits.\n\n§GWhy it matters:§! Each level gives the nobles more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the nobles to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_no_pv_NOForestry_n:0 "Forestry Monopoly"
 mtui_at_no_pv_NOForestry_n_tt:0 "§YForestry Monopoly§![mtui_at_no_pv_NOForestry_n_tt_guide]"
 mtui_at_no_pv_NOForestry_n_tt_guide_on:0 "\n--------------------------------------\nThe woods and forests of the realm are as essential to the Peasantry as the fields and pastoral land that sprawls the countryside, providing essential building materials for our people. It is only natural that the §O[Prov_Noble_P]§! would seek to extend their domain to encompass the harvesting and use of timber itself.\n\n§GWhy it matters:§! Each level gives the nobles more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the nobles to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_no_pv_NOForestry_dn_tt:0 "Lower: [mtui_LD_NOForestry]"
 mtui_at_no_pv_NOForestry_i0_tt:0 "[Privilege_NOForestry0_title]\nThe [Prov_Noble_P] hold no monopoly over the realm's forests.§YNo effects§!"
 mtui_at_no_pv_NOForestry_i1_tt:0 "[Privilege_NOForestry1_title]\nThe reach of the [Prov_Noble_P] extends to the realm's forests, enforcing many small dues and fees wherever they can on any harvest of timber.\n§YEffects§!\n§R+1.0%§!£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Gravity\n§YFeudal Dues§!\n	     §Y+15.0%§! of all revenue from §OForestry§! industry transfered to £estate_greater_nobles_icon_small£§O[Prov_Noble]§! Wealth\n§YState Property Capacity Impact§!\n	     §Y-5.0%§! Capacity cost of holding forestry property\n	     §Y+25.0§! State Property Capacity"
 mtui_at_no_pv_NOForestry_i2_tt:0 "[Privilege_NOForestry2_title]\nAll harvests of timber from the realm's forests are accompanied by a mandatory tithe to the [Prov_Noble_P] in either cash or kind, only avoided in lands where the reach of the powerful holds no sway.\n§YEffects§!\n§R+2.0%§!£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Gravity\n§YFeudal Dues§!\n	     §Y+30.0%§! of all revenue from §OForestry§! industry transfered to £estate_greater_nobles_icon_small£§O[Prov_Noble]§! Wealth.\n§YState Property Capacity Impact§!\n	     §Y-15.0%§! Capacity cost of holding forestry property\n	     §Y+50.0§! State Property Capacity"
 mtui_at_no_pv_NOForestry_up_tt:0 "Raise: [mtui_LU_NOForestry]"
 mtui_at_no_pv_NOForestry_l:0 "§Y[mtui_L_NOForestry]§!"
 mtui_at_no_pv_NOForestry_l_tt:0 "§YForestry Monopoly§![mtui_at_no_pv_NOForestry_l_tt_guide]"
 mtui_at_no_pv_NOForestry_l_tt_guide_on:0 "\n--------------------------------------\nThe woods and forests of the realm are as essential to the Peasantry as the fields and pastoral land that sprawls the countryside, providing essential building materials for our people. It is only natural that the §O[Prov_Noble_P]§! would seek to extend their domain to encompass the harvesting and use of timber itself.\n\n§GWhy it matters:§! Each level gives the nobles more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the nobles to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_no_pv_NOSeigneurial_n:0 "Seigneurial Courts"
 mtui_at_no_pv_NOSeigneurial_n_tt:0 "§YSeigneurial Courts§![mtui_at_no_pv_NOSeigneurial_n_tt_guide]"
 mtui_at_no_pv_NOSeigneurial_n_tt_guide_on:0 "\n--------------------------------------\nIn the great domains of the realm's most prestigious [Prov_Noble_P], even justice can be shaped towards the favor of the few. Seigneurial courts provide a means for the [Prov_Noble_P] to hold their own courts on their own estates for their subjects, ensuring the outcome considers the realities of the local area, while guaranteeing just outcome for the [Prov_Noble_P].\n\n§GWhy it matters:§! Each level gives the nobles more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the nobles to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_no_pv_NOSeigneurial_dn_tt:0 "Lower: [mtui_LD_NOSeigneurial]"
 mtui_at_no_pv_NOSeigneurial_i0_tt:0 "[Privilege_NOSeigneurial0_title]\nJustice is the domain of the realm, without additional considerations for the local [Prov_Noble_P].§YNo effects§!"
 mtui_at_no_pv_NOSeigneurial_i1_tt:0 "[Privilege_NOSeigneurial1_title]\nCourts are held with special consideration for the [Prov_Noble_P], often conducted on a [Prov_Noble]'s estate when the matter is considered local for good measure.\n§YEffects§!\n§R+1.0%§!£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Gravity\n§G+0.25§!£estate_greater_nobles_icon_small£Base Hierarchy\n§R+10.0%§! §YLocal Autonomy§! from£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power\n§R+5.0%§! §YLocal Corruption§! from£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power\n§R-0.25§! £loc_pitchfork£ Base Welfare"
 mtui_at_no_pv_NOSeigneurial_i2_tt:0 "[Privilege_NOSeigneurial2_title]\nPrestigious [Prov_Noble_P] hold the right to hold a seigneurial court on their estate for the most pressing of issues, with some courts acting in a semi-permanent manner.\n§YEffects§!\n§R+3.0%§!£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Gravity\n§G+0.50§!£estate_greater_nobles_icon_small£Base Hierarchy\n§R+20.0%§! §YLocal Autonomy§! from£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power\n§R+10.0%§! §YLocal Corruption§! from£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power\n§R-0.50§! £loc_pitchfork£ Base Welfare"
 mtui_at_no_pv_NOSeigneurial_i3_tt:0 "[Privilege_NOSeigneurial3_title]\nIt is a fundamental right of the [Prov_Noble_P] to hold their own seigneurial court on their estate, to ensure justice within their domain for all subjects under their rule.\n§YEffects§!\n§R+5.0%§!£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Gravity\n§G+1.00§!£estate_greater_nobles_icon_small£Base Hierarchy\n§R+30.0%§! §YLocal Autonomy§! from£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power\n§R+15.0%§! §YLocal Corruption§! from£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power\n§R-1.00§! £loc_pitchfork£ Base Welfare"
 mtui_at_no_pv_NOSeigneurial_up_tt:0 "Raise: [mtui_LU_NOSeigneurial]"
 mtui_at_no_pv_NOSeigneurial_l:0 "§Y[mtui_L_NOSeigneurial]§!"
 mtui_at_no_pv_NOSeigneurial_l_tt:0 "§YSeigneurial Courts§![mtui_at_no_pv_NOSeigneurial_l_tt_guide]"
 mtui_at_no_pv_NOSeigneurial_l_tt_guide_on:0 "\n--------------------------------------\nIn the great domains of the realm's most prestigious [Prov_Noble_P], even justice can be shaped towards the favor of the few. Seigneurial courts provide a means for the [Prov_Noble_P] to hold their own courts on their own estates for their subjects, ensuring the outcome considers the realities of the local area, while guaranteeing just outcome for the [Prov_Noble_P].\n\n§GWhy it matters:§! Each level gives the nobles more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the nobles to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_no_pv_NOTitles_n:0 "Court Titles"
 mtui_at_no_pv_NOTitles_n_tt:0 "§YCourt Titles§![mtui_at_no_pv_NOTitles_n_tt_guide]"
 mtui_at_no_pv_NOTitles_n_tt_guide_on:0 "\n--------------------------------------\nNo monarch is complete without the Court, unifying the realm in a dynamic melting pot of the most prestigious individuals of the realm. There is no higher form of patronage than a place in the court, a fact known well by the realm's [Prov_Noble_P].\n\n§GWhy it matters:§! Each level gives the nobles more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the nobles to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_no_pv_NOTitles_dn_tt:0 "Lower: [mtui_LD_NOTitles]"
 mtui_at_no_pv_NOTitles_i0_tt:0 "[Privilege_NOTitles0_title]\nCourt titles are granted only when appropriate, constrained to a small set of highly sought after powers and responsibilities."
 mtui_at_no_pv_NOTitles_i1_tt:0 "[Privilege_NOTitles1_title]\nA wide variety of titles exists to encompass many individuals, expanding the scope of the court at the cost of its prestigious reputation.\n§YEffects§!\n§Y+2%§!£estate_greater_nobles_icon_small£§OAristocratic§! Influence\n§G+2§! base relations between£estate_greater_nobles_icon_small£§OAristocrats§! and §Mthe State§!\n§R+0.10§! State Corruption\n§R+0.1%§! Prestige Decay"
 mtui_at_no_pv_NOTitles_i2_tt:0 "[Privilege_NOTitles2_title]\nA wide array of titles covers many aspects of life, allowing the entry of many individuals without strong patronage or meritocratic reputation, empowering the aspirations of ambitions personalities.\n§YEffects§!\n§Y+5.0%§!£estate_greater_nobles_icon_small£§OAristocratic§! Influence\n§G+5§! base relations between£estate_greater_nobles_icon_small£§OAristocrats§! and §Mthe State§!\n§R+0.20§! State Corruption\n§R+0.3%§! Prestige Decay"
 mtui_at_no_pv_NOTitles_i3_tt:0 "[Privilege_NOTitles3_title]\nTitles are extensive and given without real care for merit, leaving many functions and responsibilities of the court as entirely ceremonial or even theoretical duties.\n§YEffects§!\n§Y+10.0%§!£estate_greater_nobles_icon_small£§OAristocratic§! Influence\n§G+10§! base relations between£estate_greater_nobles_icon_small£§OAristocrats§! and §Mthe State§!\n§R+0.30§! State Corruption\n§R+0.5%§! Prestige Decay"
 mtui_at_no_pv_NOTitles_i4_tt:0 "[Privilege_NOTitles4_title]\nThe innumerable titles that together compose the realm's court are so extensive that their existence is often discovered after the fact, leaving many powerful individuals with a list of pompous and excessive titles.\n§YEffects§!\n§Y+20.0%§!£estate_greater_nobles_icon_small£§OAristocratic§! Influence\n§G+15§! base relations between£estate_greater_nobles_icon_small£§OAristocrats§! and §Mthe State§!\n§R+0.50§! State Corruption\n§R+1.0%§! Prestige Decay"
 mtui_at_no_pv_NOTitles_i5_tt:0 "[Privilege_NOTitles5_title]\nThe court and its titles are so utterly ridiculous in scope and application that the court in itself has lost meaning, empowering [Prov_Noble_P] without any real reputation, often leaving the presence of a title as a joke within itself. \n§YEffects§!\n§Y+30.0%§!£estate_greater_nobles_icon_small£§OAristocratic§! Influence\n§G+20§! base relations between£estate_greater_nobles_icon_small£§OAristocrats§! and §Mthe State§!\n§R+0.75§! State Corruption\n§R+1.5%§! Prestige Decay"
 mtui_at_no_pv_NOTitles_up_tt:0 "Raise: [mtui_LU_NOTitles]"
 mtui_at_no_pv_NOTitles_l:0 "§Y[mtui_L_NOTitles]§!"
 mtui_at_no_pv_NOTitles_l_tt:0 "§YCourt Titles§![mtui_at_no_pv_NOTitles_l_tt_guide]"
 mtui_at_no_pv_NOTitles_l_tt_guide_on:0 "\n--------------------------------------\nNo monarch is complete without the Court, unifying the realm in a dynamic melting pot of the most prestigious individuals of the realm. There is no higher form of patronage than a place in the court, a fact known well by the realm's [Prov_Noble_P].\n\n§GWhy it matters:§! Each level gives the nobles more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the nobles to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_no_pv_NOAutonomy_n:0 "Rural Autonomy"
 mtui_at_no_pv_NOAutonomy_n_tt:0 "§YRural Autonomy§![mtui_at_no_pv_NOAutonomy_n_tt_guide]"
 mtui_at_no_pv_NOAutonomy_n_tt_guide_on:0 "\n--------------------------------------\nWithin the bounds of the laws of the realm, every landlord knows the value that autonomous living can provide. Prying eyes open a window to the real activities of an estate, and as such the pursuit of greater autonomy is a prime directive of the rural elite.\n\n§GWhy it matters:§! Each level gives the nobles more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the nobles to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_no_pv_NOAutonomy_dn_tt:0 "Lower: [mtui_LD_NOAutonomy]"
 mtui_at_no_pv_NOAutonomy_i0_tt:0 "[Privilege_NOAutonomy0_title]\nThe rights and powers of the realm are generally balanced with those of the landlord, relying on a more universalist precedence for the rights of the rural estates."
 mtui_at_no_pv_NOAutonomy_i1_tt:0 "[Privilege_NOAutonomy1_title]\nA policy of indifference is the way of the land, providing landlords with the de-facto authority to ensure more favorable outcomes for their holdings.\n§YEffects§!\n§R+10.0%§! Autonomy from£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power\n§G+0.25§!£estate_greater_nobles_icon_small£Base Hierarchy\n§G-10.0%§! Bureaucrats needed per 1k Rural Population"
 mtui_at_no_pv_NOAutonomy_i2_tt:0 "[Privilege_NOAutonomy2_title]\nCodified privileges empower landlords across the realm with the blessing of apathetic oversight, diminishing the realm's presence across many rural estates.\n§YEffects§!\n§R+20.0%§! Autonomy from£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power\n§G+0.50§!£estate_greater_nobles_icon_small£Base Hierarchy\n§G-15.0%§! Bureaucrats needed per 1k Rural Population"
 mtui_at_no_pv_NOAutonomy_i3_tt:0 "[Privilege_NOAutonomy3_title]\nRural estates enjoy many privileges and protections, codifying the right of most landlords to self-reliance, self-direction and a high degree of freedom from the prying eyes of the realm.\n§YEffects§!\n§R+30.0%§! Autonomy from£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power\n§G+1.00§!£estate_greater_nobles_icon_small£Base Hierarchy\n§R+25.0%§! Mana Cost of Land Tax\n§G-20.0%§! Bureaucrats needed per 1k Rural Population"
 mtui_at_no_pv_NOAutonomy_i4_tt:0 "[Privilege_NOAutonomy4_title]\nThe estate is an island to itself, affording its owners a blind-eye from the realm and relative freedom within. The powers of the landlord are codified and their rule sovereign.\n§YEffects§!\n§R+40.0%§! Autonomy from£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power\n§G+1.50§!£estate_greater_nobles_icon_small£Base Hierarchy\n§R+50.0%§! Mana Cost of Land Tax\n§G-25.0%§! Bureaucrats needed per 1k Rural Population"
 mtui_at_no_pv_NOAutonomy_i5_tt:0 "[Privilege_NOAutonomy5_title]\nOur social order starts with the landlord, the enlightened sovereign of their land, lord of all those who reside within. The realm has no right to interfere, for the realm in itself depends on the landlord for its very foundation.\n§YEffects§!\n§R+50.0%§! Autonomy from£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power\n§G+2.00§!£estate_greater_nobles_icon_small£Base Hierarchy\n§R+100.0%§! Mana Cost of Land Tax\n§G-33%§! Bureaucrats needed per 1k Rural Population"
 mtui_at_no_pv_NOAutonomy_up_tt:0 "Raise: [mtui_LU_NOAutonomy]"
 mtui_at_no_pv_NOAutonomy_l:0 "§Y[mtui_L_NOAutonomy]§!"
 mtui_at_no_pv_NOAutonomy_l_tt:0 "§YRural Autonomy§![mtui_at_no_pv_NOAutonomy_l_tt_guide]"
 mtui_at_no_pv_NOAutonomy_l_tt_guide_on:0 "\n--------------------------------------\nWithin the bounds of the laws of the realm, every landlord knows the value that autonomous living can provide. Prying eyes open a window to the real activities of an estate, and as such the pursuit of greater autonomy is a prime directive of the rural elite.\n\n§GWhy it matters:§! Each level gives the nobles more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the nobles to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_no_pv_NODiplomacy_n:0 "Prestigious Diplomacy"
 mtui_at_no_pv_NODiplomacy_n_tt:0 "§YPrestigious Diplomacy§![mtui_at_no_pv_NODiplomacy_n_tt_guide]"
 mtui_at_no_pv_NODiplomacy_n_tt_guide_on:0 "\n--------------------------------------\nThe world of foreign relations is a complex mix of state interests and patronage, empowering those who can leverage their own personal networks for the greater interests of the realm. Some would consider it only natural that such a task be given only to those of great prestige and high birth.\n\n§GWhy it matters:§! Each level gives the nobles more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the nobles to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_no_pv_NODiplomacy_dn_tt:0 "Lower: [mtui_LD_NODiplomacy]"
 mtui_at_no_pv_NODiplomacy_i0_tt:0 "[Privilege_NODiplomacy0_title]\nDiplomats serve at the pleasure of the realm, appointed without any privileged conditions of birth or status."
 mtui_at_no_pv_NODiplomacy_i1_tt:0 "[Privilege_NODiplomacy1_title]\nThe envoys and diplomats of the state are those of high status, whether it be wealth or bloodline. Service is an honorable duty, only fit for those of prestige.\n§YEffects§!\n§R-1§! Diplomats\n§G+0.50§! Diplomatic Reputation\n§G+10.0%§! Improve Relations Modifier\n§G+0.25§!£estate_greater_nobles_icon_small£Base Hierarchy\n§R+0.25§! State Corruption"
 mtui_at_no_pv_NODiplomacy_i2_tt:0 "[Privilege_NODiplomacy2_title]\nOf all the [Rights_Subject] of the realm, only those of the highest calibre are fit to represent the [Rights_Realm]. Foreign emissaries enjoy the full support of the [Rights_Realm], generously rewarded for their service.\n§YEffects§!\n§R-1§! Diplomats\n§R-1§! Diplomatic Relations\n§G+1.00§! Diplomatic Reputation\n§G+25.0%§! Improve Relations Modifier\n§G+0.50§!£estate_greater_nobles_icon_small£Base Hierarchy\n§R+0.50§! State Corruption"
 mtui_at_no_pv_NODiplomacy_up_tt:0 "Raise: [mtui_LU_NODiplomacy]"
 mtui_at_no_pv_NODiplomacy_l:0 "§Y[mtui_L_NODiplomacy]§!"
 mtui_at_no_pv_NODiplomacy_l_tt:0 "§YPrestigious Diplomacy§![mtui_at_no_pv_NODiplomacy_l_tt_guide]"
 mtui_at_no_pv_NODiplomacy_l_tt_guide_on:0 "\n--------------------------------------\nThe world of foreign relations is a complex mix of state interests and patronage, empowering those who can leverage their own personal networks for the greater interests of the realm. Some would consider it only natural that such a task be given only to those of great prestige and high birth.\n\n§GWhy it matters:§! Each level gives the nobles more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the nobles to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_no_pv_NODynastic_n:0 "Familial Service"
 mtui_at_no_pv_NODynastic_n_tt:0 "§YFamilial Service§![mtui_at_no_pv_NODynastic_n_tt_guide]"
 mtui_at_no_pv_NODynastic_n_tt_guide_on:0 "\n--------------------------------------\nIf the realm is bound by loyalty, then no bond is stronger than that of family. The ends one may go to for their kin is both powerful and corruptive, inherently clouding judgement in times of decision and consequence. Any appointments must reconcile loyalty with nepotism, and the risks it poses for the [Rights_Realm] at large.\n\n§GWhy it matters:§! Each level gives the nobles more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the nobles to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_no_pv_NODynastic_dn_tt:0 "Lower: [mtui_LD_NODynastic]"
 mtui_at_no_pv_NODynastic_i0_tt:0 "[Privilege_NODynastic0_title]\nFamily and service are considered separate matters, with a general policy of segregation and non-familial appointments considered the norm for the ruling family.No effects"
 mtui_at_no_pv_NODynastic_i1_tt:0 "[Privilege_NODynastic1_title]\nAppointments of kin are considered no different in consequence or moral standing, affording the ruling family leeway to forge a loyal powerbase.\n§YEffects§!\n§G+0.20§! Yearly [Rights_Legitimacy]\n§G+0.20§! Yearly Prestige\n§R+0.50§! State Corruption\n§G+5§! base relations between£estate_greater_nobles_icon_small£§OAristocrats§! and §Mthe State§!"
 mtui_at_no_pv_NODynastic_i2_tt:0 "[Privilege_NODynastic2_title]\nFamilial appointment is the norm for the [Rights_Realm], with many notable positions and titles held by the royal family. Fealty is assured, and loyalty is expected.\n§YEffects§!\n§G+0.50§! Yearly [Rights_Legitimacy]\n§G+0.50§! Yearly Prestige\n§R+1.00§! State Corruption\n§G+10§! base relations between£estate_greater_nobles_icon_small£§OAristocrats§! and §Mthe State§!"
 mtui_at_no_pv_NODynastic_up_tt:0 "Raise: [mtui_LU_NODynastic]"
 mtui_at_no_pv_NODynastic_l:0 "§Y[mtui_L_NODynastic]§!"
 mtui_at_no_pv_NODynastic_l_tt:0 "§YFamilial Service§![mtui_at_no_pv_NODynastic_l_tt_guide]"
 mtui_at_no_pv_NODynastic_l_tt_guide_on:0 "\n--------------------------------------\nIf the realm is bound by loyalty, then no bond is stronger than that of family. The ends one may go to for their kin is both powerful and corruptive, inherently clouding judgement in times of decision and consequence. Any appointments must reconcile loyalty with nepotism, and the risks it poses for the [Rights_Realm] at large.\n\n§GWhy it matters:§! Each level gives the nobles more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the nobles to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_no_pv_NOHierarchy_n:0 "[Prov_Noble] Hierarchy"
 mtui_at_no_pv_NOHierarchy_n_tt:0 "§Y[Prov_Noble] Hierarchy§![mtui_at_no_pv_NOHierarchy_n_tt_guide]"
 mtui_at_no_pv_NOHierarchy_n_tt_guide_on:0 "\n--------------------------------------\nThe natural hierarchy of humanity exists even within the ranks of the [Prov_Noble_P] themselves. [Prov_Noble_P] of greater rank extend their power over the lesser [Prov_Noble_P], powerful magnates rule over the great, and the [Rights_Realm] rules over all. Concentration of noble power can simplify the relations of the realm, at the risk of wild swings in the support and fortunes of those at the top.\n\n§GWhy it matters:§! Each level gives the nobles more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the nobles to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_no_pv_NOHierarchy_dn_tt:0 "Lower: [mtui_LD_NOHierarchy]"
 mtui_at_no_pv_NOHierarchy_i0_tt:0 "[Privilege_NOHierarchy0_title]\nThe ranks of the [Prov_Noble_P] are decentralised and diverse, affording those in power with the blessing and curse of dealing with a great number of influential [Prov_Noble_P].§YNo effects§!"
 mtui_at_no_pv_NOHierarchy_i1_tt:0 "[Privilege_NOHierarchy1_title]\nLands and titles endowed upon the [Prov_Noble_P] often end up in the hands of a smaller section of the [Prov_Noble_P], affording them with more influence over the realm than the majority of [Prov_Noble_P].\n§YEffects§!\n§Y+25.0%§!£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power Shift Speed\n§Y+25.0%§!£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Loyalty Shift Speed\n§Y+10.0%§!£estate_greater_nobles_icon_small£§OAristocratic§! Influence"
 mtui_at_no_pv_NOHierarchy_i2_tt:0 "[Privilege_NOHierarchy2_title]\nThe concentration of wealth and power within the few has led to increased stratification of noble society, leaving a small minority with considerable power over the [Prov_Noble_P] at large.\n§YEffects§!\n§Y+50.0%§!£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power Shift Speed\n§Y+50.0%§!£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Loyalty Shift Speed\n§R+5.0%§!£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Gravity"
 mtui_at_no_pv_NOHierarchy_i3_tt:0 "[Privilege_NOHierarchy3_title]\nThe power of the [Prov_Noble_P] is synonymous with the influence of a handful of prominent [Prov_Noble_P], magnates of the realm who dominate aristocratic politics. If the interests of the [Rights_Realm] fall out of alignment with the magnates, the loyalty of the [Prov_Noble_P] will fall with them.\n§YEffects§!\n§Y+100.0%§!£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power Shift Speed\n§Y+100.0%§!£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Loyalty Shift Speed\n§R+10.0%§!£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Gravity"
 mtui_at_no_pv_NOHierarchy_up_tt:0 "Raise: [mtui_LU_NOHierarchy]"
 mtui_at_no_pv_NOHierarchy_l:0 "§Y[mtui_L_NOHierarchy]§!"
 mtui_at_no_pv_NOHierarchy_l_tt:0 "§Y[Prov_Noble] Hierarchy§![mtui_at_no_pv_NOHierarchy_l_tt_guide]"
 mtui_at_no_pv_NOHierarchy_l_tt_guide_on:0 "\n--------------------------------------\nThe natural hierarchy of humanity exists even within the ranks of the [Prov_Noble_P] themselves. [Prov_Noble_P] of greater rank extend their power over the lesser [Prov_Noble_P], powerful magnates rule over the great, and the [Rights_Realm] rules over all. Concentration of noble power can simplify the relations of the realm, at the risk of wild swings in the support and fortunes of those at the top.\n\n§GWhy it matters:§! Each level gives the nobles more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the nobles to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_no_pv_NOTaxE_n:0 "[Prov_Noble] Dues"
 mtui_at_no_pv_NOTaxE_n_tt:0 "§Y[Prov_Noble] Dues§![mtui_at_no_pv_NOTaxE_n_tt_guide]"
 mtui_at_no_pv_NOTaxE_n_tt_guide_on:0 "\n--------------------------------------\nOf all the obligations of the [Prov_Noble_P], dues or tax in cash or kind are the most suspectible to exemption and commutation. A relaxation of dues is a power level for loyalty, though not without consequence.\n\n§GWhy it matters:§! Each level gives the nobles more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the nobles to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_no_pv_NOTaxE_dn_tt:0 "Lower: [mtui_LD_NOTaxE]"
 mtui_at_no_pv_NOTaxE_i0_tt:0 "[Privilege_NOTaxE0_title]\nThe [Rights_Realm] expects the [Prov_Noble_P] to fulfill its societal obligations in cash or kind, with no notable special considerations or exemptions."
 mtui_at_no_pv_NOTaxE_i1_tt:0 "[Privilege_NOTaxE1_title]\nSpecial consideration is taken to the burden placed on the most prominent of [Prov_Noble_P], lowering their obligations appropriately.\n§YEffects§!\n§R+20.0%§! Mana Cost for §Y[Prov_Noble] Dues§!\n(§R-20.0%§! *£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Loyalty) Tax from£estate_greater_nobles_icon_small£§O[Prov_Noble_P]§!"
 mtui_at_no_pv_NOTaxE_i2_tt:0 "[Privilege_NOTaxE2_title]\nMany powerful [Prov_Noble_P] enjoy notable exemptions for tax and dues, leaving the [Rights_Realm] with a more difficult task of collection.\n§YEffects§!\n§R+40.0%§! Mana Cost for §Y[Prov_Noble] Dues§!\n(§R-40.0%§! *£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Loyalty) Tax from£estate_greater_nobles_icon_small£§O[Prov_Noble_P]§!"
 mtui_at_no_pv_NOTaxE_i3_tt:0 "[Privilege_NOTaxE3_title]\nThe [Rights_Realm] is faced with a difficult and costly task of collecting the tax and dues owed by the [Prov_Noble_P], with major exemptions enjoyed by a majority of [Prov_Noble_P].\n§YEffects§!\n§R+60.0%§! Mana Cost for §Y[Prov_Noble] Dues§!\n(§R-60.0%§! *£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Loyalty) Tax from£estate_greater_nobles_icon_small£§O[Prov_Noble_P]§!"
 mtui_at_no_pv_NOTaxE_i4_tt:0 "[Privilege_NOTaxE4_title]\nThe obligations of the [Prov_Noble_P] owed in tax or dues to the [Rights_Realm] often exist on paper at best, with widespread exemptions from taxation and commutation of most [Prov_Noble] dues.\n§YEffects§!\n§R+80.0%§! Mana Cost for §Y[Prov_Noble] Dues§!\n(§R-80.0%§! *£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Loyalty) Tax from£estate_greater_nobles_icon_small£§O[Prov_Noble_P]§!"
 mtui_at_no_pv_NOTaxE_i5_tt:0 "[Privilege_NOTaxE5_title]\nAny obligations in dues owed by the [Prov_Noble_P] enjoy extensive exemptions, clauses and commutations, with virtually no tax and minimal dues owed to the [Rights_Realm].\n§YEffects§!\n§R+100.0%§! Mana Cost for §Y[Prov_Noble] Dues§!\n(§R-100.0%§! *£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Loyalty) Tax from£estate_greater_nobles_icon_small£§O[Prov_Noble_P]§!"
 mtui_at_no_pv_NOTaxE_up_tt:0 "Raise: [mtui_LU_NOTaxE]"
 mtui_at_no_pv_NOTaxE_l:0 "§Y[mtui_L_NOTaxE]§!"
 mtui_at_no_pv_NOTaxE_l_tt:0 "§Y[Prov_Noble] Dues§![mtui_at_no_pv_NOTaxE_l_tt_guide]"
 mtui_at_no_pv_NOTaxE_l_tt_guide_on:0 "\n--------------------------------------\nOf all the obligations of the [Prov_Noble_P], dues or tax in cash or kind are the most suspectible to exemption and commutation. A relaxation of dues is a power level for loyalty, though not without consequence.\n\n§GWhy it matters:§! Each level gives the nobles more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the nobles to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_no_pv_NOServiceE_n:0 "[Prov_Noble] Service"
 mtui_at_no_pv_NOServiceE_n_tt:0 "§Y[Prov_Noble] Service§![mtui_at_no_pv_NOServiceE_n_tt_guide]"
 mtui_at_no_pv_NOServiceE_n_tt_guide_on:0 "\n--------------------------------------\nThe life of a [Prov_Noble] is varied yet inherently privileged compared to the common man. There is however one core obligation that places the [Prov_Noble_P] in harm's way, the call to arms of the realm. Avoiding this sworn service can mean the difference between a luxurious life and a gruesome death, no matter how glorious it may be.\n\n§GWhy it matters:§! Each level gives the nobles more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the nobles to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_no_pv_NOServiceE_dn_tt:0 "Lower: [mtui_LD_NOServiceE]"
 mtui_at_no_pv_NOServiceE_i0_tt:0 "[Privilege_NOServiceE0_title]\nThe [Prov_Noble_P] are expected the fulfill their service obligations, with no notable exemptions for the aristocratic elite."
 mtui_at_no_pv_NOServiceE_i1_tt:0 "[Privilege_NOServiceE1_title]\nService requirements for the most prominent of [Prov_Noble_P] enjoy exemptions and extensive capacity for exemption, leaving most other [Prov_Noble_P] however without special treatment.\n§YEffects§!\n§R+20.0%§! Mana Cost for §Y[Prov_Noble] Levies§!\n(§R-20.0%§! *£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Loyalty) State Manpower from£estate_greater_nobles_icon_small£§O[Prov_Noble_P]§!"
 mtui_at_no_pv_NOServiceE_i2_tt:0 "[Privilege_NOServiceE2_title]\nExemptions for service are common for the majority of [Prov_Noble_P], leaving many [Prov_Noble_P] enjoying a lifestyle where societal service is optional.\n§YEffects§!\n§R+40.0%§! Mana Cost for §Y[Prov_Noble] Levies§!\n(§R-40.0%§! *£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Loyalty) State Manpower from£estate_greater_nobles_icon_small£§O[Prov_Noble_P]§!"
 mtui_at_no_pv_NOServiceE_i3_tt:0 "[Privilege_NOServiceE3_title]\nSweeping exemptions provide almost all [Prov_Noble_P] with at least some form of commutation or privileged form of service.\n§YEffects§!\n§R+60.0%§! Mana Cost for §Y[Prov_Noble] Levies§!\n(§R-60.0%§! *£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Loyalty) State Manpower from£estate_greater_nobles_icon_small£§O[Prov_Noble_P]§!"
 mtui_at_no_pv_NOServiceE_i4_tt:0 "[Privilege_NOServiceE4_title]\nObligations of service for the [Prov_Noble_P] is largely an optional endeavor, with only the committed or lesser [Prov_Noble_P] seeing any form of enforcement for their societal dues.\n§YEffects§!\n§R+80.0%§! Mana Cost for §Y[Prov_Noble] Levies§!\n(§R-80.0%§! *£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Loyalty) State Manpower from£estate_greater_nobles_icon_small£§O[Prov_Noble_P]§!"
 mtui_at_no_pv_NOServiceE_i5_tt:0 "[Privilege_NOServiceE5_title]\nComplete and comprehsive privileges leave the [Prov_Noble_P] outside the scope of service enlistment, instead only serving with considerable effort on the states behalf or when a [Prov_Noble] sees the value in such an endeavour.\n§YEffects§!\n§R+100.0%§! Mana Cost for §Y[Prov_Noble] Levies§!\n(§R-100.0%§! *£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Loyalty) State Manpower from£estate_greater_nobles_icon_small£§O[Prov_Noble_P]§!"
 mtui_at_no_pv_NOServiceE_up_tt:0 "Raise: [mtui_LU_NOServiceE]"
 mtui_at_no_pv_NOServiceE_l:0 "§Y[mtui_L_NOServiceE]§!"
