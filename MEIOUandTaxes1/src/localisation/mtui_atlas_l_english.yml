 mtui_at_b_t_farming_n_tt:0 "§YTax farming§![mtui_at_b_t_farming_n_tt_guide]"
 mtui_at_b_t_farming_n_tt_guide_on:0 "\n--------------------------------------\nThe share of taxes kept by private tax farmers who collect on our behalf.\n\n§GWhy it matters:§! Tax farming lets a weak state collect at all, but the farmers keep a cut.\n\n§OHow to change it:§! The Tax Farming reform on the State tab: less farming needs a stronger bureaucracy."
