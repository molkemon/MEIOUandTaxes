 mtui_at_b_t_dole_n:0 "Grain dole"
 mtui_at_b_t_dole_n_tt:0 "§YGrain dole§![mtui_at_b_t_dole_n_tt_guide]"
 mtui_at_b_t_dole_n_tt_guide_on:0 "\n--------------------------------------\nGrain handed out to commoners.\n\n§GWhy it matters:§! Feeds the poor and buys stability.\n\n§OHow to change it:§! The grain dole buttons to the right."
 mtui_at_b_t_dole_p:0 "§g([mtui_A_p_dole]%)§!"
