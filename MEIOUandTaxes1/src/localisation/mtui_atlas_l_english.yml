 mtui_at_b_t_milrec_n_tt_guide_on:0 "\n--------------------------------------\nRecruiting state manpower.\n\n§GWhy it matters:§! Determines how much state manpower we can raise.\n\n§OHow to change it:§! The military budget to the right."
 mtui_at_b_t_milrec_p:0 "§g([mtui_A_p_milrec]%)§!"
