 mtui_at_b_t_indirect_n:0 "Indirect taxation"
 mtui_at_b_t_indirect_n_tt:0 "§YIndirect taxation§!\n\n  Fees                                       §G[GVA_TaxD_Fees]§!¤\n  Tariffs                                    §G[GVA_Tariff_Income]§!¤\n  Excises (salt, substances)          £2px£§G[GVA_TaxD_ExciseBU]§!¤\n  Industry duties                        £2px£§G[GVA_TaxD_Industry]§!¤\n     §gof which tolls§!                       £1px£§G[GVA_TaxD_TollBU]§!¤\n     §gof which timber§!                    §G[GVA_TaxD_TimberBU]§!¤\n     §gof which alcohol§!                   §G[GVA_TaxD_AlcoholBU]§!¤\n  Obligations                             §G[GVA_TaxD_Obligations]§!¤\n  Other (commerce, tributes...)   £2px£§G[GVA_MTUI_OtherIndirect]§!¤[mtui_at_b_t_indirect_n_tt_guide]"
 mtui_at_b_t_indirect_n_tt_guide_on:0 "\n--------------------------------------\nTaxes on goods, trade and services: fees, tariffs, excises, industry duties (including tolls, timber and alcohol), obligations and more.\n\n§GWhy it matters:§! Grows with trade and consumption, so it rises as the economy develops.\n\n§OHow to change it:§! More trade and richer consumers, plus the commerce and excise rights."
