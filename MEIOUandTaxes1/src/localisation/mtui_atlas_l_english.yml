 mtui_at_cl_gl_prop_v_tt_guide_on:0 "\n--------------------------------------\nShare of urban and industrial property owned by the clergy.\n\n§GWhy it matters:§! Property earns income in the cities and gives power there.\n\n§OHow to change it:§! Property grants and expropriation."
 mtui_at_cl_rt_h:0 "§YRights§!"
 mtui_at_cl_rt_pk:0 "[mtui_pk_short]"
 mtui_at_cl_rt_CLHie_n:0 "Church Authority"
 mtui_at_cl_rt_CLHie_n_tt:0 "§YChurch Authority§![mtui_at_cl_rt_CLHie_n_tt_guide]"
 mtui_at_cl_rt_CLHie_n_tt_guide_on:0 "\n--------------------------------------\nThe realm of the divine finds its intermediaries on Earth in the form of the Clergy, leaving only the question of the organisation and authority of spiritual institutions. Powerful structures provide abundant resources for use in charitable and benevolent works of the Clergy, while subordinaton and secularity leave all authority in alternative governmental structures, and the Clergy in the role of support.\n\n§GWhy it matters:§! Sets what the clergy may do and owe in this area, shifting power, loyalty and income between them and the state. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. The change applies at once and opens or joins a reform package (enacted in the State tab): enact it right away, or add further changes first. Reforming too much too quickly hurts stability and the estates may object severely."
 mtui_at_cl_rt_CLHie_l:0 "§Y[mtui_L_RCLHie]§!"
 mtui_at_cl_rt_CLHie_l_tt:0 "§YChurch Authority§![mtui_at_cl_rt_CLHie_l_tt_guide]"
 mtui_at_cl_rt_CLHie_l_tt_guide_on:0 "\n--------------------------------------\nThe realm of the divine finds its intermediaries on Earth in the form of the Clergy, leaving only the question of the organisation and authority of spiritual institutions. Powerful structures provide abundant resources for use in charitable and benevolent works of the Clergy, while subordinaton and secularity leave all authority in alternative governmental structures, and the Clergy in the role of support.\n\n§GWhy it matters:§! Sets what the clergy may do and owe in this area, shifting power, loyalty and income between them and the state. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. The change applies at once and opens or joins a reform package (enacted in the State tab): enact it right away, or add further changes first. Reforming too much too quickly hurts stability and the estates may object severely."
 mtui_at_cl_rt_CLHie_dn_tt:0 "Step back §YChurch Authority§!. Opens or joins a reform package."
 mtui_at_cl_rt_CLHie_i0_tt:0 "[Rights_CLHie1_title]\nThe church is effectively a sovereign state independent from the actual state's authority, capable of holding and exercising substantial influence over the government whilst answering only to itself.\n§YEffects§!\n§R+30.0%§! £estate_church_icon_small£ §OClergy§! Gravity\n§Y+2.00§! £estate_church_icon_small£ Base Spirituality\n§R+50.0%§! Autonomy from £estate_church_icon_small£ §OClergy§!"
 mtui_at_cl_rt_CLHie_i1_tt:0 "[Rights_CLHie2_title]\nThe church is an arm of the state, with the hierarchy subject to the demands of the state executive, and the church at the mercy of its will.\n§YEffects§!\n§R+15.0%§! £estate_church_icon_small£ §OClergy§! Gravity\n§Y+1.00§! £estate_church_icon_small£ Base Spirituality\n§R+25.0%§! Autonomy from £estate_church_icon_small£ §OClergy§!\n§R+50.0%§!£estate_church_icon_small£§OClergy§! Power from Wealth"
 mtui_at_cl_rt_CLHie_i2_tt:0 "[Rights_CLHie3_title]\nThe state has no special powers over the church, yet the church holds no inherent powers within the state, marking their relationship as one of ordinary organisation and legal authority, nothing more.\n§YEffects§!\n§R-2.00§! £estate_church_icon_small£ Base Spirituality\n§R+100.0%§!£estate_church_icon_small£§OClergy§! Power from Wealth"
 mtui_at_cl_rt_CLHie_up_tt:0 "Reform §YChurch Authority§!. Opens or joins a reform package."
 mtui_at_cl_rt_CLObl_n:0 "Clergy Obligations"
 mtui_at_cl_rt_CLObl_n_tt:0 "§YClergy Obligations§![mtui_at_cl_rt_CLObl_n_tt_guide]"
 mtui_at_cl_rt_CLObl_n_tt_guide_on:0 "\n--------------------------------------\nIn exchange for the charitable services of the realm's divine representatives, the state can provide a general exemption to all regular dues owed by spritual institutions and places of worship, deciding the contribution of the Clergy with the stroke of a pen.\n\n§GWhy it matters:§! Sets what the clergy may do and owe in this area, shifting power, loyalty and income between them and the state. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. The change applies at once and opens or joins a reform package (enacted in the State tab): enact it right away, or add further changes first. Reforming too much too quickly hurts stability and the estates may object severely."
 mtui_at_cl_rt_CLObl_l:0 "§Y[mtui_L_RCLObl]§!"
 mtui_at_cl_rt_CLObl_l_tt:0 "§YClergy Obligations§![mtui_at_cl_rt_CLObl_l_tt_guide]"
 mtui_at_cl_rt_CLObl_l_tt_guide_on:0 "\n--------------------------------------\nIn exchange for the charitable services of the realm's divine representatives, the state can provide a general exemption to all regular dues owed by spritual institutions and places of worship, deciding the contribution of the Clergy with the stroke of a pen.\n\n§GWhy it matters:§! Sets what the clergy may do and owe in this area, shifting power, loyalty and income between them and the state. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. The change applies at once and opens or joins a reform package (enacted in the State tab): enact it right away, or add further changes first. Reforming too much too quickly hurts stability and the estates may object severely."
 mtui_at_cl_rt_CLObl_dn_tt:0 "Step back §YClergy Obligations§!. Opens or joins a reform package."
 mtui_at_cl_rt_CLObl_i0_tt:0 "[Rights_CLObl1_title]\nNo taxes are paid by the clergy, their societal dues ostensibly substituted with far-reaching charity for the poor and destitute across the realm.\n§YEffects§!\n§R-100.0%§! Tax from £estate_church_icon_small£ §OClergy§!\n§G+1.00§! £estate_church_icon_small£ Base Spirituality"
 mtui_at_cl_rt_CLObl_i1_tt:0 "[Rights_CLObl2_title]\nIn exchange for state support for clergy exemptions, the church has generously agreed to donate a portion of their revenues to the state, to assist them in their divinely ordained work.\n§YEffects§!\n§R-100.0%§! Tax from £estate_church_icon_small£ §OClergy§!\n§YChurch Support§!\n	     (§Y5%§! * £estate_church_icon_small£ §OClergy§! Power) of §OClergy§! Income transferred to Local Tax Income"
 mtui_at_cl_rt_CLObl_i2_tt:0 "[Rights_CLObl3_title]\nThe Clergy are treated no differently than any other, subject to death and taxes like the rest.\n§YEffects§!\n§R-1.00§! £estate_church_icon_small£ Base Spirituality"
 mtui_at_cl_rt_CLObl_up_tt:0 "Reform §YClergy Obligations§!. Opens or joins a reform package."
 mtui_at_cl_rt_CLTax_n:0 "Church Finance"
 mtui_at_cl_rt_CLTax_n_tt:0 "§YChurch Finance§![mtui_at_cl_rt_CLTax_n_tt_guide]"
 mtui_at_cl_rt_CLTax_n_tt_guide_on:0 "\n--------------------------------------\nThrough the authority they hold across the realm, the Clergy can utilise their governmental structure to self-finance their activities in a more direct and expensive manner, providing truly immense resources through a more reliable tithe expected of the pious.\n\n§GWhy it matters:§! Sets what the clergy may do and owe in this area, shifting power, loyalty and income between them and the state. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. The change applies at once and opens or joins a reform package (enacted in the State tab): enact it right away, or add further changes first. Reforming too much too quickly hurts stability and the estates may object severely."
 mtui_at_cl_rt_CLTax_l:0 "§Y[mtui_L_RCLTax]§!"
 mtui_at_cl_rt_CLTax_l_tt:0 "§YChurch Finance§![mtui_at_cl_rt_CLTax_l_tt_guide]"
 mtui_at_cl_rt_CLTax_l_tt_guide_on:0 "\n--------------------------------------\nThrough the authority they hold across the realm, the Clergy can utilise their governmental structure to self-finance their activities in a more direct and expensive manner, providing truly immense resources through a more reliable tithe expected of the pious.\n\n§GWhy it matters:§! Sets what the clergy may do and owe in this area, shifting power, loyalty and income between them and the state. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. The change applies at once and opens or joins a reform package (enacted in the State tab): enact it right away, or add further changes first. Reforming too much too quickly hurts stability and the estates may object severely."
 mtui_at_cl_rt_CLTax_dn_tt:0 "Step back §YChurch Finance§!. Opens or joins a reform package."
 mtui_at_cl_rt_CLTax_i0_tt:0 "[Rights_CLTax1_title]\nExtensive powers allow the church to act as the de-facto administration of the countryside wherever their influence can be felt, providing untold wealth and realm-wide authority.\n§YEffects§!\n§YGenerous Tithing enabled§!\n	     (§Y20%§! * £estate_church_icon_small£ §OClergy§! Power) of §lPeasantry§! Income transferred to £estate_church_icon_small£ §OClergy§! Wealth\n	     (§Y8%§! * £estate_church_icon_small£ §OClergy§! Power) of §TResident§! Income transferred to £estate_church_icon_small£ §OClergy§! Wealth\n§R+25.0%§! Autonomy from £estate_church_icon_small£ §OClergy§!"
 mtui_at_cl_rt_CLTax_i1_tt:0 "[Rights_CLTax2_title]\nWherever the church makes its authority known, a 1/10th tithe of all income soon follows, providing the church with vast reserves of wealth.\n§YEffects§!\n§YTithing§!\n	     (§Y10%§! * £estate_church_icon_small£ §OClergy§! Power) of §lPeasantry§! Income transferred to £estate_church_icon_small£ §OClergy§! Wealth\n§YDonations§! enabled\n	     (§Y0.35%§! * £estate_church_icon_small£ §OClergy§! Power) + §Y0.4%§! of §TResident§! Income transferred to £estate_church_icon_small£ §OClergy§! Wealth"
 mtui_at_cl_rt_CLTax_i2_tt:0 "[Rights_CLTax3_title]\nThe church collects no taxes or obligations from the people, relying solely on donations and the profits from whatever properties they own in their own right.\n§YEffects§!\n§YDonations enabled§!\n	     (§Y0.35%§! * £estate_church_icon_small£ §OClergy§! Power) + §Y0.4%§! of §lPeasantry§! Income transferred to £estate_church_icon_small£ §OClergy§! Wealth\n	     (§Y0.35%§! * £estate_church_icon_small£ §OClergy§! Power) + §Y0.4%§! of §TResident§! Income transferred to £estate_church_icon_small£ §OClergy§! Wealth"
 mtui_at_cl_rt_CLTax_up_tt:0 "Reform §YChurch Finance§!. Opens or joins a reform package."
