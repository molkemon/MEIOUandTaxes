 mtui_at_b_t_infra_n:0 "Infrastructure"
 mtui_at_b_t_infra_n_tt:0 "§YInfrastructure§![mtui_at_b_t_infra_n_tt_guide]"
 mtui_at_b_t_infra_n_tt_guide_on:0 "\n--------------------------------------\nUpkeep the state pays for infrastructure.\n\n§GWhy it matters:§! Unfunded infrastructure decays unless the elites pay for it.\n\n§OHow to change it:§! Infrastructure funding in the middle column."
