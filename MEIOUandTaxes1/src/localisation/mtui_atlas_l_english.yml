 mtui_at_b_t_milmaint_n:0 "Military maintenance"
 mtui_at_b_t_milmaint_n_tt:0 "§YMilitary maintenance§![mtui_at_b_t_milmaint_n_tt_guide]"
 mtui_at_b_t_milmaint_n_tt_guide_on:0 "\n--------------------------------------\nUpkeep of state manpower and units paid from the treasury.\n\n§GWhy it matters:§! Estate levies are free, state troops are not.\n\n§OHow to change it:§! Army size and composition; the military budget."
 mtui_at_b_t_milmaint_p:0 "§g([mtui_A_p_milmaint]%)§!"
 mtui_at_b_t_milmaint_p_tt:0 "§YMilitary maintenance§![mtui_at_b_t_milmaint_p_tt_guide]"
 mtui_at_b_t_milmaint_p_tt_guide_on:0 "\n--------------------------------------\nUpkeep of state manpower and units paid from the treasury.\n\n§GWhy it matters:§! Estate levies are free, state troops are not.\n\n§OHow to change it:§! Army size and composition; the military budget."
