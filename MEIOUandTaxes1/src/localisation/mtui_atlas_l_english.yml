 mtui_at_tr_gl_income_n:0 "Yearly income"
 mtui_at_tr_gl_income_n_tt:0 "§YYearly income§![mtui_at_tr_gl_income_n_tt_guide]"
 mtui_at_tr_gl_income_n_tt_guide_on:0 "\n--------------------------------------\nWhat the clans earned over the last year.\n\n§GWhy it matters:§! Income adds to their wealth and to what the state can tax.\n\n§OHow to change it:§! The economy, their land and property, and privileges that hand them revenue."
