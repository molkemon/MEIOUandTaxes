 mtui_at_o_help:0 "The Atlas gathers the running of the state in one place, sorted into tabs:\n\n§YBudget§!: revenue and expenses, infrastructure funding, the military budget, welfare, land and property.\n\n§YState§!: the bureaucracy reforms, the measures against corruption, the rights of the state and the reform package.\n\n§YEstates§!: power, loyalty, rights, privileges and interactions of each estate.\n\nHover any number for what it means, why it matters and how to change it."
 mtui_at_b_treas_h:0 "§YTreasury§!"
 mtui_at_b_t_rev_n:0 "§YRevenue (last year)§!"
 mtui_at_b_t_rev_n_tt:0 "§YRevenue§!\n§YDirect taxation§!                          £1px£§G[GVA_TaxD_Direct]§!¤\n  Rents                                     £2px£§G[GVA_TaxD_Rents]§!¤\n  Land tax                                 £1px£§G[GVA_TaxD_Land]§!¤\n  Property tax                            £1px£§G[GVA_TaxD_PropertyBU]§!¤\n  Poll tax                                  £2px£§G[GVA_TaxD_Poll]§!¤\n  Chattel tax                              §G[GVA_TaxD_Chattel]§!¤\n  Inheritance tax                        £2px£§G[GVA_TaxD_Inheritance]§!¤\n  State property (net)                  §G[GVA_TaxD_BUProperty]§!¤\n§YIndirect taxation§!                        £1px£§G[GVA_TaxD_Indirect]§!¤\n  Fees                                       §G[GVA_TaxD_Fees]§!¤\n  Tariffs                                    §G[GVA_Tariff_Income]§!¤\n  Excises (salt, substances)          £2px£§G[GVA_TaxD_ExciseBU]§!¤\n  Industry duties                        £2px£§G[GVA_TaxD_Industry]§!¤\n     §gof which tolls§!                       £1px£§G[GVA_TaxD_TollBU]§!¤\n     §gof which timber§!                    §G[GVA_TaxD_TimberBU]§!¤\n     §gof which alcohol§!                   §G[GVA_TaxD_AlcoholBU]§!¤\n  Obligations                             §G[GVA_TaxD_Obligations]§!¤\n  Other (commerce, tributes...)   £2px£§G[GVA_MTUI_OtherIndirect]§!¤\n§YSpecial income§!                          §G[GVA_MTUI_Special]§!¤\n  Teutonic holdings                    §G[GVA_TaxD_Teuton]§!¤\n  Imperial taxes                         £2px£§G[GVA_TaxD_HRE]§!¤\n  Knight holdings                       §G[GVA_TaxD_Knights]§!¤\n  Trade posts                             §G[GVA_Post_Fees]§!¤\n  Lost to tax farming                  £3px£§R[GVA_TaxD_Farming]§!¤\n  Lost to corruption                   £3px£§R[GVA_TaxD_Corruption]§!¤\n--------------------------------------\n§YRevenue§!                                   £2px£§G[GVA_TaxD_Total]§!¤[mtui_at_b_t_rev_n_tt_guide]"
 mtui_at_b_t_rev_n_tt_guide_on:0 "\n--------------------------------------\nEverything the state collected at the last yearly census, line by line: direct and indirect taxes, special income, minus what tax farmers and corrupt officials kept.\n\n§GWhy it matters:§! Revenue pays for officials, the army, infrastructure and loan interest. It is the base of the military budget.\n\n§OHow to change it:§! Richer classes, higher state reach, tax rights and lower corruption all raise it."
 mtui_at_b_t_rev_v:0 "§G[mtui_A_revenue]§!¤"
