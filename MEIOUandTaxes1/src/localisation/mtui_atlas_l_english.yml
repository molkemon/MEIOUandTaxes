 mtui_at_o_tr_h:0 "§YTrade§!"
 mtui_at_o_tr_d:0 "§gTrade happens in order of rank: the better our best sector center ranks, the more of the market our merchants reach first.§!"
 mtui_at_o_tr_rank_n:0 "Best trade rank"
 mtui_at_o_tr_rank_n_tt:0 "§YBest trade rank§![mtui_at_o_tr_rank_n_tt_guide]"
 mtui_at_o_tr_rank_n_tt_guide_on:0 "\n--------------------------------------\nEvery sector center gets a rank each year; rank 1 trades first. This is the best rank among the sector centers we own: [mtui_A_rank_where]\n\n§GWhy it matters:§! Higher ranked centres buy and sell before everyone else: our burghers buy cheaper, sell dearer and grow richer, and our people pay less for goods. Even a few ranks make a large difference.\n\n§OHow to change it:§! Trade power, trade efficiency, merchants and the size of our fleet (trade ships count double) decide the rank."
 mtui_at_o_tr_rank_v:0 "[mtui_A_rank_t]"
 mtui_at_o_tr_rank_v_tt:0 "§YBest trade rank§![mtui_at_o_tr_rank_v_tt_guide]"
 mtui_at_o_tr_rank_v_tt_guide_on:0 "\n--------------------------------------\nEvery sector center gets a rank each year; rank 1 trades first. This is the best rank among the sector centers we own: [mtui_A_rank_where]\n\n§GWhy it matters:§! Higher ranked centres buy and sell before everyone else: our burghers buy cheaper, sell dearer and grow richer, and our people pay less for goods. Even a few ranks make a large difference.\n\n§OHow to change it:§! Trade power, trade efficiency, merchants and the size of our fleet (trade ships count double) decide the rank."
 mtui_at_o_tr_tcent_n:0 "Sector centers owned"
 mtui_at_o_tr_tcent_n_tt:0 "§YSector centers owned§![mtui_at_o_tr_tcent_n_tt_guide]"
 mtui_at_o_tr_tcent_n_tt_guide_on:0 "\n--------------------------------------\nA sector is all the provinces of one nation inside one trade node. Its sector center is the province that runs it: usually our province with the most trade power there. A nation has at most one sector center per trade node, but can have centers in several nodes. The center trades with the other nations present in the node and handles the trade between our own sectors.\n\n§GWhy it matters:§! Without a sector center in a node our provinces there cannot take part in its trade. The more nodes we hold a center in, the more of our trade we run ourselves.\n\n§OHow to change it:§! Own provinces in more trade nodes and build up their trade power; the strongest one becomes the center."
 mtui_at_o_tr_tcent_v:0 "§Y[This.mtui_a_tcent.GetValue]§!"
 mtui_at_o_tr_tcent_v_tt:0 "§YSector centers owned§![mtui_at_o_tr_tcent_v_tt_guide]"
 mtui_at_o_tr_tcent_v_tt_guide_on:0 "\n--------------------------------------\nA sector is all the provinces of one nation inside one trade node. Its sector center is the province that runs it: usually our province with the most trade power there. A nation has at most one sector center per trade node, but can have centers in several nodes. The center trades with the other nations present in the node and handles the trade between our own sectors.\n\n§GWhy it matters:§! Without a sector center in a node our provinces there cannot take part in its trade. The more nodes we hold a center in, the more of our trade we run ourselves.\n\n§OHow to change it:§! Own provinces in more trade nodes and build up their trade power; the strongest one becomes the center."
 mtui_at_o_tr_tariff_n:0 "Tariff income"
 mtui_at_o_tr_tariff_n_tt:0 "§YTariff income§![mtui_at_o_tr_tariff_n_tt_guide]"
 mtui_at_o_tr_tariff_n_tt_guide_on:0 "\n--------------------------------------\nTariffs collected on goods crossing our borders over the last year, part of indirect taxation.\n\n§GWhy it matters:§! Grows with foreign trade through our markets.\n\n§OHow to change it:§! More foreign trade; the commerce and excise rights."
 mtui_at_o_tr_tariff_v:0 "§G[mtui_A_tariff]§!¤"
 mtui_at_o_tr_tariff_v_tt:0 "§YTariff income§![mtui_at_o_tr_tariff_v_tt_guide]"
 mtui_at_o_tr_tariff_v_tt_guide_on:0 "\n--------------------------------------\nTariffs collected on goods crossing our borders over the last year, part of indirect taxation.\n\n§GWhy it matters:§! Grows with foreign trade through our markets.\n\n§OHow to change it:§! More foreign trade; the commerce and excise rights."
 mtui_at_o_tr_commerce_n:0 "Commerce taxes"
 mtui_at_o_tr_commerce_n_tt:0 "§YCommerce taxes§![mtui_at_o_tr_commerce_n_tt_guide]"
 mtui_at_o_tr_commerce_n_tt_guide_on:0 "\n--------------------------------------\nTaxes on the commerce of the burghers over the last year.\n\n§GWhy it matters:§! Shows how much the state earns from the trade of its cities.\n\n§OHow to change it:§! Richer burghers and better trade rank; the commerce rights of the burghers."
