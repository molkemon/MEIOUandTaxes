 mtui_at_s_bu_h:0 "§YBureaucracy Reforms§!"
 mtui_at_s_bu_d:0 "§gHover a level for what it does, an arrow for its costs and requirements.§!"
 mtui_at_s_bu_h0:0 "§YReform§!"
 mtui_at_s_bu_h1:0 "§YLevels§!"
 mtui_at_s_bu_h2:0 "§YCurrent§!"
 mtui_at_s_rf_BUOffice_n:0 "Sale of Office"
 mtui_at_s_rf_BUOffice_n_tt:0 "§YSale of Office§![mtui_at_s_rf_BUOffice_n_tt_guide]"
 mtui_at_s_rf_BUOffice_n_tt_guide_on:0 "\n--------------------------------------\nThe purchase and sale of office is a powerful means to gain wealth in the face of widespread corruption through an upfront fee. The cost however is fundamental, in that it allows wealth to be the sole indicator of value for a position, diminishing bureaucratic quality as a whole.\n\n§GWhy it matters:§! Each level changes what the administration costs and how corrupt, loyal and capable it is. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Each step costs power and needs enough support among the bureaucrats; hover an arrow for its requirements."
 mtui_at_s_rf_BUOffice_dn_tt:0 "Step back: [mtui_LD_BUOffice]"
 mtui_at_s_rf_BUOffice_i0_tt:0 "[Privilege_BUOffice0_title]\nThe sale of offices is a widespread phenomenon, renumerating officials serving the administration and the state at large, yet compromising the quality of the administration.\n§YEffects§!\n§G-50.0%§! £estate_bureaucracy_icon_small£ §MAdministration Cost§!\n§R+0.30§! £loc_corruption£ Provincial Corruption\n§R+0.20§! £loc_corruption£ State Corruption"
 mtui_at_s_rf_BUOffice_i1_tt:0 "[Privilege_BUOffice1_title]\nMany low-level and common offices are bought and sold across the realm, providing the realm with a new source of income at the expense of bureaucratic competence and loyalty.\n§YEffects§!\n§G-20.0%§! £estate_bureaucracy_icon_small£ §MAdministration Cost§!\n§R+0.10§! £loc_corruption£ Provincial Corruption\n§R+0.10§! £loc_corruption£ State Corruption"
 mtui_at_s_rf_BUOffice_i2_tt:0 "[Privilege_BUOffice2_title]\nThe practice of selling offices of the realm is forbidden under penalty of law, leaving employment through hire as the only path to political service.§YNo Effects.§!"
 mtui_at_s_rf_BUOffice_up_tt:0 "Reform: [mtui_LU_BUOffice]"
 mtui_at_s_rf_BUOffice_l:0 "§Y[mtui_L_BUOffice]§!"
 mtui_at_s_rf_BUOffice_l_tt:0 "§YSale of Office§![mtui_at_s_rf_BUOffice_l_tt_guide]"
 mtui_at_s_rf_BUOffice_l_tt_guide_on:0 "\n--------------------------------------\nThe purchase and sale of office is a powerful means to gain wealth in the face of widespread corruption through an upfront fee. The cost however is fundamental, in that it allows wealth to be the sole indicator of value for a position, diminishing bureaucratic quality as a whole.\n\n§GWhy it matters:§! Each level changes what the administration costs and how corrupt, loyal and capable it is. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Each step costs power and needs enough support among the bureaucrats; hover an arrow for its requirements."
 mtui_at_s_rf_BUFarm_n:0 "Tax Farming"
 mtui_at_s_rf_BUFarm_n_tt:0 "§YTax Farming§![mtui_at_s_rf_BUFarm_n_tt_guide]"
 mtui_at_s_rf_BUFarm_n_tt_guide_on:0 "\n--------------------------------------\nThe leasing of revenue collection to designated agents has been common practice for much of human history, providing the realm with a simple, cheap and generally effective means of raising taxes without the need for a formalised public service. The autonomy provided to officials is the main point of weakness however, as tax-farmers use their standing to raise revenue at any cost, inherently incentivised to collect as much revenue as possible by any means necessary.\n\n§GWhy it matters:§! Each level changes what the administration costs and how corrupt, loyal and capable it is. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Each step costs power and needs enough support among the bureaucrats; hover an arrow for its requirements."
 mtui_at_s_rf_BUFarm_dn_tt:0 "Step back: [mtui_LD_BUFarm]"
 mtui_at_s_rf_BUFarm_i0_tt:0 "[Privilege_BUFarm0_title]\nTax-farmers are employed on an ad-hoc basis, with poorly defined and irregular leases without major conditions or oversight. The practice is cheap, yet the autonomy provided to farmers is immense.\n§YEffects§!\n§R-0.50§! £loc_pitchfork£ Base Welfare\n§R-10.0%§! £estate_bureaucracy_icon_small£ §MState§! Share of Tax Revenue\n§R+0.10§! £loc_corruption£ Provincial Corruption"
 mtui_at_s_rf_BUFarm_i1_tt:0 "[Privilege_BUFarm1_title]\nRevenue leases are an official position granted to trustworthy or at the least reliable individuals, improving the reliability of farming yet still leaving the means of collection at the discretion of the tax-farmer.\n§YEffects§!\n§R-0.25§! £loc_pitchfork£ Base Welfare\n§R-5.0%§! £estate_bureaucracy_icon_small£ §MState§! Share of Tax Revenue\n§R+0.05§! £loc_corruption£ Provincial Corruption"
 mtui_at_s_rf_BUFarm_i2_tt:0 "[Privilege_BUFarm2_title]\nTax-farming is an official profession overseen by state officials, one with a reasonable degree of regulation to prevent the worst abuses by tax-farmers under the employ of the state.§YNo Effects.§!"
 mtui_at_s_rf_BUFarm_up_tt:0 "Reform: [mtui_LU_BUFarm]"
 mtui_at_s_rf_BUFarm_l:0 "§Y[mtui_L_BUFarm]§!"
 mtui_at_s_rf_BUFarm_l_tt:0 "§YTax Farming§![mtui_at_s_rf_BUFarm_l_tt_guide]"
 mtui_at_s_rf_BUFarm_l_tt_guide_on:0 "\n--------------------------------------\nThe leasing of revenue collection to designated agents has been common practice for much of human history, providing the realm with a simple, cheap and generally effective means of raising taxes without the need for a formalised public service. The autonomy provided to officials is the main point of weakness however, as tax-farmers use their standing to raise revenue at any cost, inherently incentivised to collect as much revenue as possible by any means necessary.\n\n§GWhy it matters:§! Each level changes what the administration costs and how corrupt, loyal and capable it is. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Each step costs power and needs enough support among the bureaucrats; hover an arrow for its requirements."
 mtui_at_s_rf_BUTenure_n:0 "Term of Office"
 mtui_at_s_rf_BUTenure_n_tt:0 "§YTerm of Office§![mtui_at_s_rf_BUTenure_n_tt_guide]"
 mtui_at_s_rf_BUTenure_n_tt_guide_on:0 "\n--------------------------------------\nThe right to hold a title for life allows those with talent to serve without fear of replacement or withdrawal. This certainty however compromises the recycling of talent, and often festers corruption through the eternal agent known as time.\n\n§GWhy it matters:§! Each level changes what the administration costs and how corrupt, loyal and capable it is. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Each step costs power and needs enough support among the bureaucrats; hover an arrow for its requirements."
 mtui_at_s_rf_BUTenure_dn_tt:0 "Step back: [mtui_LD_BUTenure]"
 mtui_at_s_rf_BUTenure_i0_tt:0 "[Privilege_BUTenure0_title]\nAdministrative positions more often than not have no theoretical end to their tenure, allowing individuals to serve as long as desired, often for life.\n§YEffects§!\n§R+0.20§! £loc_corruption£ Provincial Corruption\n§R+0.10§! £loc_corruption£ State Corruption"
 mtui_at_s_rf_BUTenure_i1_tt:0 "[Privilege_BUTenure1_title]\nWhen a title is held for life, one can see a means where those who serve closely with a title holder can... continue their appointment, as the charge can be considered as never truly ending.\n§YEffects§!\n§R+0.10§! £loc_corruption£ Provincial Corruption\n§R+0.05§! £loc_corruption£ State Corruption"
 mtui_at_s_rf_BUTenure_i2_tt:0 "[Privilege_BUTenure2_title]\nFormal review of employed positions at the end of a given tenure ensures the systematic recycling of talent, granting the state full power over the duration of tenures.§YNo Effects.§!"
 mtui_at_s_rf_BUTenure_up_tt:0 "Reform: [mtui_LU_BUTenure]"
 mtui_at_s_rf_BUTenure_l:0 "§Y[mtui_L_BUTenure]§!"
 mtui_at_s_rf_BUTenure_l_tt:0 "§YTerm of Office§![mtui_at_s_rf_BUTenure_l_tt_guide]"
 mtui_at_s_rf_BUTenure_l_tt_guide_on:0 "\n--------------------------------------\nThe right to hold a title for life allows those with talent to serve without fear of replacement or withdrawal. This certainty however compromises the recycling of talent, and often festers corruption through the eternal agent known as time.\n\n§GWhy it matters:§! Each level changes what the administration costs and how corrupt, loyal and capable it is. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Each step costs power and needs enough support among the bureaucrats; hover an arrow for its requirements."
 mtui_at_s_rf_BUWages_n:0 "Official Wages"
 mtui_at_s_rf_BUWages_n_tt:0 "§YOfficial Wages§![mtui_at_s_rf_BUWages_n_tt_guide]"
 mtui_at_s_rf_BUWages_n_tt_guide_on:0 "\n--------------------------------------\nWhen the bureaucracy expands, so does the cost of administration paid by the realm most often compromised of wages. The obvious solution for many is to keep wages low, to rely on trust and loyalty and the right of service, an instinct that can ignore the reality of where one's loyalties truly lie.\n\n§GWhy it matters:§! Each level changes what the administration costs and how corrupt, loyal and capable it is. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Each step costs power and needs enough support among the bureaucrats; hover an arrow for its requirements."
 mtui_at_s_rf_BUWages_dn_tt:0 "Step back: [mtui_LD_BUWages]"
 mtui_at_s_rf_BUWages_i0_tt:0 "[Privilege_BUWages0_title]\nThose who serve the realm as a loyal administrator are owed little, for their entire service is a privilege bestowed upon them. A bloated pay would as such be immoral, they will have to serve with what they have.\n§YEffects§!\n§Y-80.0%§!¤ Wages Paid to Officials\nLow §YWages§! increase §Rcorruption§! across the provinces, and reduce the efficiency of the §Madministration§!"
 mtui_at_s_rf_BUWages_i1_tt:0 "[Privilege_BUWages1_title]\nAdministrators widely supplement what little wages they have by collecting fees from the populace, ensuring their prosperity at the cost of increased potential for corruption.\n§YEffects§!\n§Y-50.0%§!¤ Wages Paid to Officials\nLow §YWages§! increase §Rcorruption§! across the provinces, and reduce the efficiency of the §Madministration§!"
 mtui_at_s_rf_BUWages_i2_tt:0 "[Privilege_BUWages2_title]\nThe state pays officials a sufficient, often living wage, covering the needs of most officials and removing the most common incentive for corruption.\n§YEffects§!\n§Y-20.0%§!¤ Wages Paid to Officials\nLow §YWages§! increase §Rcorruption§! across the provinces, and reduce the efficiency of the §Madministration§!"
 mtui_at_s_rf_BUWages_i3_tt:0 "[Privilege_BUWages3_title]\nDecent wages across the bureaucratic hierarchy are widely supplemented with various rewards and incentives for those who exceed expectations, and avoid the worst impulses of political service."
 mtui_at_s_rf_BUWages_up_tt:0 "Reform: [mtui_LU_BUWages]"
 mtui_at_s_rf_BUWages_l:0 "§Y[mtui_L_BUWages]§!"
 mtui_at_s_rf_BUWages_l_tt:0 "§YOfficial Wages§![mtui_at_s_rf_BUWages_l_tt_guide]"
 mtui_at_s_rf_BUWages_l_tt_guide_on:0 "\n--------------------------------------\nWhen the bureaucracy expands, so does the cost of administration paid by the realm most often compromised of wages. The obvious solution for many is to keep wages low, to rely on trust and loyalty and the right of service, an instinct that can ignore the reality of where one's loyalties truly lie.\n\n§GWhy it matters:§! Each level changes what the administration costs and how corrupt, loyal and capable it is. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Each step costs power and needs enough support among the bureaucrats; hover an arrow for its requirements."
 mtui_at_s_rf_BUHierarchy_n:0 "Bureaucratic Hierarchy"
 mtui_at_s_rf_BUHierarchy_n_tt:0 "§YBureaucratic Hierarchy§![mtui_at_s_rf_BUHierarchy_n_tt_guide]"
 mtui_at_s_rf_BUHierarchy_n_tt_guide_on:0 "\n--------------------------------------\nA competent, meritocratic bureaucracy is dependent upon the existence of a clearly defined hierarchy of competance and formal division of labor. Such formal lines of authority lowers the scope of corruption for any given official, and ensures the existence of an official checking over every shoulder.\n\n§GWhy it matters:§! Each level changes what the administration costs and how corrupt, loyal and capable it is. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Each step costs power and needs enough support among the bureaucrats; hover an arrow for its requirements."
 mtui_at_s_rf_BUHierarchy_dn_tt:0 "Step back: [mtui_LD_BUHierarchy]"
 mtui_at_s_rf_BUHierarchy_i0_tt:0 "[Privilege_BUHierarchy0_title]\nThe realm's administration is an adhoc collection of titles, ranks and prestigious positions that leave no real path for advancement beyond making a favorable impression on powerful elites.\n§YEffects§!\n§R+0.10§! £loc_autonomy£ Global Autonomy\n§G-20.0%§! £estate_bureaucracy_icon_small£ §MAdministration Cost§!\n§R+0.10§! £loc_corruption£ Provincial Corruption\n§R+0.10§! £loc_corruption£ State Corruption"
 mtui_at_s_rf_BUHierarchy_i1_tt:0 "[Privilege_BUHierarchy1_title]\nAn administrative hierarchy is present across the realm, often supplemented where regionally appropriate yet rudimentary enough to offer a path to progress through the administration's ranks.\n§YEffects§!\n§R+0.05§! £loc_autonomy£ Global Autonomy\n§G-5.0%§! £estate_bureaucracy_icon_small£ §MAdministration Cost§!\n§R+0.05§! £loc_corruption£ Provincial Corruption\n§R+0.05§! £loc_corruption£ State Corruption"
 mtui_at_s_rf_BUHierarchy_i2_tt:0 "[Privilege_BUHierarchy2_title]\nA formal hierarchy is uniformally present across the realm, consisting of a clearly hierarchial organisation with formal lines of authority, rigid division of labour and merit-based advancement.\n§YEffects§!\n§R+5.0%§! £estate_bureaucracy_icon_small£ §MAdministration Cost§!\n§G-0.05§! £loc_corruption£ Provincial Corruption"
 mtui_at_s_rf_BUHierarchy_up_tt:0 "Reform: [mtui_LU_BUHierarchy]"
 mtui_at_s_rf_BUHierarchy_l:0 "§Y[mtui_L_BUHierarchy]§!"
 mtui_at_s_rf_BUHierarchy_l_tt:0 "§YBureaucratic Hierarchy§![mtui_at_s_rf_BUHierarchy_l_tt_guide]"
 mtui_at_s_rf_BUHierarchy_l_tt_guide_on:0 "\n--------------------------------------\nA competent, meritocratic bureaucracy is dependent upon the existence of a clearly defined hierarchy of competance and formal division of labor. Such formal lines of authority lowers the scope of corruption for any given official, and ensures the existence of an official checking over every shoulder.\n\n§GWhy it matters:§! Each level changes what the administration costs and how corrupt, loyal and capable it is. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Each step costs power and needs enough support among the bureaucrats; hover an arrow for its requirements."
 mtui_at_s_rf_BUHire_n:0 "Means of Recruitment"
 mtui_at_s_rf_BUHire_n_tt:0 "§YMeans of Recruitment§![mtui_at_s_rf_BUHire_n_tt_guide]"
 mtui_at_s_rf_BUHire_n_tt_guide_on:0 "\n--------------------------------------\nThe recruitment of new officials into the administration is often the most deterministic factor in the competence and corruption of the bureaucracy, subject to many influencing factors including nepotism, politicisation and personal dependence. The alternative is the establishment of merit-based hire, reducing the influence of existing political actors in enlistment at great political cost.\n\n§GWhy it matters:§! Each level changes what the administration costs and how corrupt, loyal and capable it is. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Each step costs power and needs enough support among the bureaucrats; hover an arrow for its requirements."
 mtui_at_s_rf_BUHire_dn_tt:0 "Step back: [mtui_LD_BUHire]"
 mtui_at_s_rf_BUHire_i0_tt:0 "[Privilege_BUHire0_title]\nRecruitment of new officials is subject to no formal policy, simply hiring individuals as needed based on the whims of those already established within the administration.\n§YEffects§!\n§R+30.0%§! £estates_icon_small£ §OElite§! Power from Autonomy\n§R+0.25§! £loc_corruption£ Provincial Corruption\n§R+0.10§! £loc_corruption£ State Corruption"
 mtui_at_s_rf_BUHire_i1_tt:0 "[Privilege_BUHire1_title]\nAll recruitment into the administration is handled through patronage, leaving significant influence of administrative policy in the hands of major factions in play.\n§YEffects§!\n§R+20.0%§! £estates_icon_small£ §OElite§! Power from Autonomy\n§R+0.20§! £loc_corruption£ Provincial Corruption\n§R+0.05§! £loc_corruption£ State Corruption"
 mtui_at_s_rf_BUHire_i2_tt:0 "[Privilege_BUHire2_title]\nWhile officials are picked by those within the administration, there exists simple examinations to ensure a level of quality and understanding of the administration for all officials.\n§YEffects§!\n§R+10.0%§! £estates_icon_small£ §OElite§! Power from Autonomy\n§R+0.10§! £loc_corruption£ Provincial Corruption\n§R+0.025§! £loc_corruption£ State Corruption"
 mtui_at_s_rf_BUHire_i3_tt:0 "[Privilege_BUHire3_title]\nRegardless of origin, there exists a means to apply for the examinations, which serves as the sole means of entry to the administration. Recruits are evaulated and selected by examiners, individuals with broad autonomy in decision making.\n§YEffects§!\n§R+5.0%§! £estates_icon_small£ §OElite§! Power from Autonomy\n§R+0.05§! £loc_corruption£ Provincial Corruption"
 mtui_at_s_rf_BUHire_i4_tt:0 "[Privilege_BUHire4_title]\nIndividuals that pass civil examinations are reviewed by an independent commission, tasked with the evaluation of candidates on a meritocratic basis."
 mtui_at_s_rf_BUHire_up_tt:0 "Reform: [mtui_LU_BUHire]"
 mtui_at_s_rf_BUHire_l:0 "§Y[mtui_L_BUHire]§!"
 mtui_at_s_rf_BUHire_l_tt:0 "§YMeans of Recruitment§![mtui_at_s_rf_BUHire_l_tt_guide]"
 mtui_at_s_rf_BUHire_l_tt_guide_on:0 "\n--------------------------------------\nThe recruitment of new officials into the administration is often the most deterministic factor in the competence and corruption of the bureaucracy, subject to many influencing factors including nepotism, politicisation and personal dependence. The alternative is the establishment of merit-based hire, reducing the influence of existing political actors in enlistment at great political cost.\n\n§GWhy it matters:§! Each level changes what the administration costs and how corrupt, loyal and capable it is. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Each step costs power and needs enough support among the bureaucrats; hover an arrow for its requirements."
 mtui_at_s_rf_BUExams_n:0 "Civil Examinations"
 mtui_at_s_rf_BUExams_n_tt:0 "§YCivil Examinations§![mtui_at_s_rf_BUExams_n_tt_guide]"
 mtui_at_s_rf_BUExams_n_tt_guide_on:0 "\n--------------------------------------\nThe quality of officials within the administration is often dependent on the restrictions that exist at the recruitment stage, in the forms of tests, feats of strength or systematic examination. It is the standard officials are held to that is paramount to the effectiveness of the administration.\n\n§GWhy it matters:§! Each level changes what the administration costs and how corrupt, loyal and capable it is. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Each step costs power and needs enough support among the bureaucrats; hover an arrow for its requirements."
 mtui_at_s_rf_BUExams_dn_tt:0 "Step back: [mtui_LD_BUExams]"
 mtui_at_s_rf_BUExams_i0_tt:0 "[Privilege_BUExams0_title]\nPotential prospects for the administration are chosen purely on subjective assessment, often composed of feats of strength or tests of intelligence, or simply one's loyalty to the ruling class.\n§YEffects§!\n§G-10.0%§! £estate_bureaucracy_icon_small£ §MAdministration Cost§!\n§R+0.30§! £loc_corruption£ Provincial Corruption\n§R+0.20§! £loc_corruption£ State Corruption"
 mtui_at_s_rf_BUExams_i1_tt:0 "[Privilege_BUExams1_title]\nNew officials are formally considered through a variety of often adhoc tests by various officials across the realm, often bypassed through the right recommendation or family connection.\n§YEffects§!\n§R+0.20§! £loc_corruption£ Provincial Corruption\n§R+0.20§! £loc_corruption£ State Corruption"
 mtui_at_s_rf_BUExams_i2_tt:0 "[Privilege_BUExams2_title]\nAn intermittent official examination is offered across the realm to field potential recruits for the administration, yet the lack of regularity and continuous examination can lead to periods of stagnation and festering corruption.\n§YEffects§!\n§R+10.0%§! £estate_bureaucracy_icon_small£ §MAdministration Cost§!\n§R+0.10§! £loc_corruption£ Provincial Corruption\n§R+0.05§! £loc_corruption£ State Corruption"
 mtui_at_s_rf_BUExams_i3_tt:0 "[Privilege_BUExams3_title]\nRegular and mandatory examinations are held across the realm for the recruitment of new officials into the administration, ensuring a minimum standard of competancy across the realm.\n§YEffects§!\n§R+15.0%§! £estate_bureaucracy_icon_small£ §MAdministration Cost§!"
 mtui_at_s_rf_BUExams_up_tt:0 "Reform: [mtui_LU_BUExams]"
 mtui_at_s_rf_BUExams_l:0 "§Y[mtui_L_BUExams]§!"
 mtui_at_s_rf_BUExams_l_tt:0 "§YCivil Examinations§![mtui_at_s_rf_BUExams_l_tt_guide]"
 mtui_at_s_rf_BUExams_l_tt_guide_on:0 "\n--------------------------------------\nThe quality of officials within the administration is often dependent on the restrictions that exist at the recruitment stage, in the forms of tests, feats of strength or systematic examination. It is the standard officials are held to that is paramount to the effectiveness of the administration.\n\n§GWhy it matters:§! Each level changes what the administration costs and how corrupt, loyal and capable it is. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Each step costs power and needs enough support among the bureaucrats; hover an arrow for its requirements."
 mtui_at_s_rf_BUOversight_n:0 "Institutional Oversight"
 mtui_at_s_rf_BUOversight_n_tt:0 "§YInstitutional Oversight§![mtui_at_s_rf_BUOversight_n_tt_guide]"
 mtui_at_s_rf_BUOversight_n_tt_guide_on:0 "\n--------------------------------------\nTrust, while implicit, is built through time and effort. Such time cannot be afforded as officials are continiously recruited, rotated and promoted across the realm. Without someone watching over their shoulder, there is no true means to enact any form of harsh penalty, scornful look or financial penalty for nefarious behavior.\n\n§GWhy it matters:§! Each level changes what the administration costs and how corrupt, loyal and capable it is. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Each step costs power and needs enough support among the bureaucrats; hover an arrow for its requirements."
 mtui_at_s_rf_BUOversight_dn_tt:0 "Step back: [mtui_LD_BUOversight]"
 mtui_at_s_rf_BUOversight_i0_tt:0 "[Privilege_BUOversight0_title]\nThe activities of officials across the realm are fundamentally a private affair, with no serious effort by the government to monitor the actions of those under its employ.\n§YEffects§!\n§R+0.20§! £loc_corruption£ Provincial Corruption\n§R+0.10§! £loc_corruption£ State Corruption"
 mtui_at_s_rf_BUOversight_i1_tt:0 "[Privilege_BUOversight1_title]\nThe bureaucratic hierarchy includes individuals tasked with the oversight of the realm's officials, an admirable task considering their limited numbers and threadbare budget.\n§YEffects§!\n§R+5.0%§! £estate_bureaucracy_icon_small£ §MAdministration Cost§!\n§R+0.10§! £loc_corruption£ Provincial Corruption\n§R+0.05§! £loc_corruption£ State Corruption"
 mtui_at_s_rf_BUOversight_i2_tt:0 "[Privilege_BUOversight2_title]\nAn institutional effort to monitor the activities of agents under employ of the state mitigates the most obvious and excessive forms of corruption, minimising economic harm to the realm.\n§YEffects§!\n§R+10.0%§! £estate_bureaucracy_icon_small£ §MAdministration Cost§!"
 mtui_at_s_rf_BUOversight_up_tt:0 "Reform: [mtui_LU_BUOversight]"
 mtui_at_s_rf_BUOversight_l:0 "§Y[mtui_L_BUOversight]§!"
 mtui_at_s_rf_BUOversight_l_tt:0 "§YInstitutional Oversight§![mtui_at_s_rf_BUOversight_l_tt_guide]"
 mtui_at_s_rf_BUOversight_l_tt_guide_on:0 "\n--------------------------------------\nTrust, while implicit, is built through time and effort. Such time cannot be afforded as officials are continiously recruited, rotated and promoted across the realm. Without someone watching over their shoulder, there is no true means to enact any form of harsh penalty, scornful look or financial penalty for nefarious behavior.\n\n§GWhy it matters:§! Each level changes what the administration costs and how corrupt, loyal and capable it is. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Each step costs power and needs enough support among the bureaucrats; hover an arrow for its requirements."
 mtui_at_s_rf_BUEnlist_n:0 "Entry Requirements"
 mtui_at_s_rf_BUEnlist_n_tt:0 "§YEntry Requirements§![mtui_at_s_rf_BUEnlist_n_tt_guide]"
 mtui_at_s_rf_BUEnlist_n_tt_guide_on:0 "\n--------------------------------------\nThe many recruits of the realm come from various backgrounds of divergent socioeconomic circumstances, leaving much diversity in the quality and suitability of candidates. Some measure of basic requirements must be considered to protect the prestige and effectiveness of the administration.\n\n§GWhy it matters:§! Each level changes what the administration costs and how corrupt, loyal and capable it is. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Each step costs power and needs enough support among the bureaucrats; hover an arrow for its requirements."
 mtui_at_s_rf_BUEnlist_dn_tt:0 "Step back: [mtui_LD_BUEnlist]"
 mtui_at_s_rf_BUEnlist_i0_tt:0 "[Privilege_BUEnlist0_title]\nThe lack of education requirements allows widespread employment, but leaves the quality of many applications as less than desirable.\n§YEffects§!\n§R-2.5%§! Administrative Efficiency\n§G-10.0%§! £estates_icon_small£ §OElite§! Power from Wealth"
 mtui_at_s_rf_BUEnlist_i1_tt:0 "[Privilege_BUEnlist1_title]\nEvery official entering the administration is expected to pass, amongst other things, a basic literacy test to ensure a minimum capacity of potential prospects."
 mtui_at_s_rf_BUEnlist_i2_tt:0 "[Privilege_BUEnlist2_title]\nOfficials are expected to be well versed in essential literature and common educational teachings, ensuring only the most capable and prestigious officials enter the administration.\n§YEffects§!\n§G+2.5%§! Administrative Efficiency\n§R+10.0%§! £estates_icon_small£ §OElite§! Power from Wealth"
 mtui_at_s_rf_BUEnlist_up_tt:0 "Reform: [mtui_LU_BUEnlist]"
 mtui_at_s_rf_BUEnlist_l:0 "§Y[mtui_L_BUEnlist]§!"
 mtui_at_s_rf_BUEnlist_l_tt:0 "§YEntry Requirements§![mtui_at_s_rf_BUEnlist_l_tt_guide]"
 mtui_at_s_rf_BUEnlist_l_tt_guide_on:0 "\n--------------------------------------\nThe many recruits of the realm come from various backgrounds of divergent socioeconomic circumstances, leaving much diversity in the quality and suitability of candidates. Some measure of basic requirements must be considered to protect the prestige and effectiveness of the administration.\n\n§GWhy it matters:§! Each level changes what the administration costs and how corrupt, loyal and capable it is. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Each step costs power and needs enough support among the bureaucrats; hover an arrow for its requirements."
 mtui_at_s_rf_BUStructure_n:0 "Provincial Administration"
 mtui_at_s_rf_BUStructure_n_tt:0 "§YProvincial Administration§![mtui_at_s_rf_BUStructure_n_tt_guide]"
 mtui_at_s_rf_BUStructure_n_tt_guide_on:0 "\n--------------------------------------\nEvery realm has its end, as loosely defined as its borders may be. While external borders drive conflict and solve disputes, internal borders determine the balance of power within the nation. Ancient divisions form future provinces, geographical divides form natural barriers between administrators, and the realm seeks to realise its power over all.\n\n§GWhy it matters:§! Each level changes what the administration costs and how corrupt, loyal and capable it is. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Each step costs power and needs enough support among the bureaucrats; hover an arrow for its requirements."
 mtui_at_s_rf_BUStructure_dn_tt:0 "Step back: [mtui_LD_BUStructure]"
 mtui_at_s_rf_BUStructure_i0_tt:0 "[Privilege_BUStructure0_title]\nThe realm is a concept, a title and a geographic entity, yet its structure is simply what it is. Any attempt to make sense of it's internal composition is meaningless.\n§YEffects§!\n§R-7.5%§! Administrative Efficiency\n§R-0.20§! Yearly £estate_bureaucracy_icon_small£ §MState Reach§!\n§R+0.15§! £loc_autonomy£ Global Autonomy\n§G-50.0%§! £estate_bureaucracy_icon_small£ §MAdministration Cost§!"
 mtui_at_s_rf_BUStructure_i1_tt:0 "[Privilege_BUStructure1_title]\nWhile the administration is intermittent and highly changeable, a series of informal divisions exist across the realm, dividing its geographic territory into some form of administrative unit.\n§YEffects§!\n§R-2.5%§! Administrative Efficiency\n§R-0.10§! Yearly £estate_bureaucracy_icon_small£ §MState Reach§!\n§R+0.05§! £loc_autonomy£ Global Autonomy\n§G-20.0%§! £estate_bureaucracy_icon_small£ §MAdministration Cost§!"
 mtui_at_s_rf_BUStructure_i2_tt:0 "[Privilege_BUStructure2_title]\nThe administration of the realm is divided amongst a series of formalised divisions, often based on historical precedent, the circumstances of their creation and the various rights and obligations of those who rule them.§YState Property Capacity Impact§!\n	     §Y+100.0§! State Property Capacity"
 mtui_at_s_rf_BUStructure_i3_tt:0 "[Privilege_BUStructure3_title]\nThe realm is organised into a series of structured, rationally divided administrative units, distributed based on population and geographical constraints.\n§YEffects§!\n§G+5.0%§! Administrative Efficiency\n§G+0.10§! Yearly £estate_bureaucracy_icon_small£ §MState Reach§!\n§G-25.0%§! £estate_bureaucracy_icon_small£ §MAdministration Cost§!\n§YState Property Capacity Impact§!\n	     §Y+200.0§! State Property Capacity"
 mtui_at_s_rf_BUStructure_up_tt:0 "Reform: [mtui_LU_BUStructure]"
 mtui_at_s_rf_BUStructure_l:0 "§Y[mtui_L_BUStructure]§!"
 mtui_at_s_rf_BUStructure_l_tt:0 "§YProvincial Administration§![mtui_at_s_rf_BUStructure_l_tt_guide]"
 mtui_at_s_rf_BUStructure_l_tt_guide_on:0 "\n--------------------------------------\nEvery realm has its end, as loosely defined as its borders may be. While external borders drive conflict and solve disputes, internal borders determine the balance of power within the nation. Ancient divisions form future provinces, geographical divides form natural barriers between administrators, and the realm seeks to realise its power over all.\n\n§GWhy it matters:§! Each level changes what the administration costs and how corrupt, loyal and capable it is. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Each step costs power and needs enough support among the bureaucrats; hover an arrow for its requirements."
 mtui_at_s_rf_BUCourts_n:0 "Sovereign Courts"
 mtui_at_s_rf_BUCourts_n_tt:0 "§YSovereign Courts§![mtui_at_s_rf_BUCourts_n_tt_guide]"
 mtui_at_s_rf_BUCourts_n_tt_guide_on:0 "\n--------------------------------------\nIf a realm is to centralise, to control the levers of power and enforce a single standard, the realm must enforce its sovereign right over the law of the realm. Great power can be found in the deliverance of law, a fact known by those who would oppose the centralisation of justice itself.\n\n§GWhy it matters:§! Each level changes what the administration costs and how corrupt, loyal and capable it is. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Each step costs power and needs enough support among the bureaucrats; hover an arrow for its requirements."
 mtui_at_s_rf_BUCourts_dn_tt:0 "Step back: [mtui_LD_BUCourts]"
 mtui_at_s_rf_BUCourts_i0_tt:0 "[Privilege_BUCourts0_title]\nWhile the realm can perform its own justice if so desired, law is generally devolved to local communities and elites.\n§YEffects§!\n§R+10.0%§! Stability Increase Interval\n§R+0.1§! £loc_autonomy£ Global Autonomy\n§R-0.50§! £loc_pitchfork£ Base Welfare\n§R+0.15§! £loc_corruption£ Provincial Corruption"
 mtui_at_s_rf_BUCourts_i1_tt:0 "[Privilege_BUCourts1_title]\nThe provision of law and justice is often local with great variance, yet most communities can rely on the presence of an appointed magistrate for appeal.\n§YEffects§!\n§R+5.0%§! Stability Increase Interval\n§R+0.05§! £loc_autonomy£ Global Autonomy\n§R-0.25§! £loc_pitchfork£ Base Welfare\n§R+0.10§! £loc_corruption£ Provincial Corruption"
 mtui_at_s_rf_BUCourts_i2_tt:0 "[Privilege_BUCourts2_title]\nA widespread system of sovereign courts ensures the presence of the state across the realm, enforcing a general standard of law that local communities most often conform to."
 mtui_at_s_rf_BUCourts_i3_tt:0 "[Privilege_BUCourts3_title]\nA single, rational law code is enforced across all jurisdictions of the realm, ensuring trial under a single idea of justice is guaranteed for all.\n§YEffects§!\n§G-10.0%§! Stability Increase Interval\n§G-0.1§! £loc_autonomy£ Global Autonomy\n§G+0.50§! £loc_pitchfork£ Base Welfare"
 mtui_at_s_rf_BUCourts_up_tt:0 "Reform: [mtui_LU_BUCourts]"
 mtui_at_s_rf_BUCourts_l:0 "§Y[mtui_L_BUCourts]§!"
 mtui_at_s_rf_BUCourts_l_tt:0 "§YSovereign Courts§![mtui_at_s_rf_BUCourts_l_tt_guide]"
 mtui_at_s_rf_BUCourts_l_tt_guide_on:0 "\n--------------------------------------\nIf a realm is to centralise, to control the levers of power and enforce a single standard, the realm must enforce its sovereign right over the law of the realm. Great power can be found in the deliverance of law, a fact known by those who would oppose the centralisation of justice itself.\n\n§GWhy it matters:§! Each level changes what the administration costs and how corrupt, loyal and capable it is. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Each step costs power and needs enough support among the bureaucrats; hover an arrow for its requirements."
 mtui_at_s_rf_BUPolitics_n:0 "Bureaucratic Politicisation"
 mtui_at_s_rf_BUPolitics_n_tt:0 "§YBureaucratic Politicisation§![mtui_at_s_rf_BUPolitics_n_tt_guide]"
 mtui_at_s_rf_BUPolitics_n_tt_guide_on:0 "\n--------------------------------------\nThe formation of factions in government is a natural phenomenon in politics, yet the consequences of unchecked factionalism are far beyond the norm. Extreme polarisation, factional hire and outright purges can lead to rampant instability while reducing the willingness of officials to hire without consideration for an individuals political leanings.\n\n§GWhy it matters:§! Each level changes what the administration costs and how corrupt, loyal and capable it is. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Each step costs power and needs enough support among the bureaucrats; hover an arrow for its requirements."
 mtui_at_s_rf_BUPolitics_dn_tt:0 "Step back: [mtui_LD_BUPolitics]"
 mtui_at_s_rf_BUPolitics_i0_tt:0 "[Privilege_BUPolitics0_title]\nThe administration is synonymous with the factions that rule it, with no restrictions on the extent that factions can exert influence across the government.\n§YEffects§!\n§R-50.0%§! £estate_bureaucracy_icon_small£ Bureaucratic Influence\n§R+0.20§! £loc_corruption£ State Corruption"
 mtui_at_s_rf_BUPolitics_i1_tt:0 "[Privilege_BUPolitics1_title]\nThe administration is largely influenced by ruling factions, with new officials often hired based on their political leanings and connections.\n§YEffects§!\n§R-25.0%§! £estate_bureaucracy_icon_small£ Bureaucratic Influence\n§R+0.15§! £loc_corruption£ State Corruption\n§G-5.0%§! Stability Increase Interval"
 mtui_at_s_rf_BUPolitics_i2_tt:0 "[Privilege_BUPolitics2_title]\nThe arrival of a new ruling faction often coincides with a major shift across parts of the administration as officials are replaced with like-minded individuals. This loyalist sweep is not all-encompassing, and many officials remain in office for decades.\n§YEffects§!\n§R-10.0%§! £estate_bureaucracy_icon_small£ Bureaucratic Influence\n§R+0.10§! £loc_corruption£ State Corruption\n§G-10.0%§! Stability Increase Interval"
 mtui_at_s_rf_BUPolitics_i3_tt:0 "[Privilege_BUPolitics3_title]\nWhile hire based on an individual's political leanings is not unheard of, the general depoliticisation of government leaves most officials are hired on meritocratic principles."
 mtui_at_s_rf_BUPolitics_up_tt:0 "Reform: [mtui_LU_BUPolitics]"
 mtui_at_s_rf_BUPolitics_l:0 "§Y[mtui_L_BUPolitics]§!"
 mtui_at_s_rf_BUPolitics_l_tt:0 "§YBureaucratic Politicisation§![mtui_at_s_rf_BUPolitics_l_tt_guide]"
 mtui_at_s_rf_BUPolitics_l_tt_guide_on:0 "\n--------------------------------------\nThe formation of factions in government is a natural phenomenon in politics, yet the consequences of unchecked factionalism are far beyond the norm. Extreme polarisation, factional hire and outright purges can lead to rampant instability while reducing the willingness of officials to hire without consideration for an individuals political leanings.\n\n§GWhy it matters:§! Each level changes what the administration costs and how corrupt, loyal and capable it is. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Each step costs power and needs enough support among the bureaucrats; hover an arrow for its requirements."
 mtui_at_s_rf_BURotate_n:0 "Regional Tenure"
 mtui_at_s_rf_BURotate_n_tt:0 "§YRegional Tenure§![mtui_at_s_rf_BURotate_n_tt_guide]"
 mtui_at_s_rf_BURotate_n_tt_guide_on:0 "\n--------------------------------------\nRecruitment is only the first step for a new official entering the administration. Essential to the outcomes of the bureaucracy is the placement of officials across the realm. Traditionally, a tendenacy towards localism is the norm, yet serving amongst those you know is not necesarily conductive towards honest behavior.\n\n§GWhy it matters:§! Each level changes what the administration costs and how corrupt, loyal and capable it is. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Each step costs power and needs enough support among the bureaucrats; hover an arrow for its requirements."
 mtui_at_s_rf_BURotate_dn_tt:0 "Step back: [mtui_LD_BURotate]"
 mtui_at_s_rf_BURotate_i0_tt:0 "[Privilege_BURotate0_title]\nAll administrator serve in areas they know best. They can utilise their knowledge of the area, their local connections and patrons to serve their area the best they can, even at the risk of a culture of corruption.\n§YEffects§!\n§G+2.5%§! Administrative Efficiency\n§G+0.50§! £loc_pitchfork£ Base Welfare\n§R+0.10§! £loc_corruption£ Provincial Corruption"
 mtui_at_s_rf_BURotate_i1_tt:0 "[Privilege_BURotate1_title]\nAll officials are subject to rotation into new positions on a regular basis, reducing the capacity for individuals to form patronage networks or become too attached to the locals."
 mtui_at_s_rf_BURotate_up_tt:0 "Reform: [mtui_LU_BURotate]"
 mtui_at_s_rf_BURotate_l:0 "§Y[mtui_L_BURotate]§!"
 mtui_at_s_rf_BURotate_l_tt:0 "§YRegional Tenure§![mtui_at_s_rf_BURotate_l_tt_guide]"
 mtui_at_s_rf_BURotate_l_tt_guide_on:0 "\n--------------------------------------\nRecruitment is only the first step for a new official entering the administration. Essential to the outcomes of the bureaucracy is the placement of officials across the realm. Traditionally, a tendenacy towards localism is the norm, yet serving amongst those you know is not necesarily conductive towards honest behavior.\n\n§GWhy it matters:§! Each level changes what the administration costs and how corrupt, loyal and capable it is. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Each step costs power and needs enough support among the bureaucrats; hover an arrow for its requirements."
