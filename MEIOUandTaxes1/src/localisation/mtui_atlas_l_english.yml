 mtui_at_b_t_propneg_p_tt:0 "§YState property§![mtui_at_b_t_propneg_p_tt_guide]"
 mtui_at_b_t_propneg_p_tt_guide_on:0 "\n--------------------------------------\nRunning costs of property the state owns, where they exceed what it earns.\n\n§GWhy it matters:§! Owned property earns income but costs upkeep.\n\n§OHow to change it:§! Buy, grant or confiscate property."
