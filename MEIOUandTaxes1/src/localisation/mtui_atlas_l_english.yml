 mtui_at_b_t_dole_v_tt_guide_on:0 "\n--------------------------------------\nGrain handed out to commoners.\n\n§GWhy it matters:§! Feeds the poor and buys stability.\n\n§OHow to change it:§! The grain dole buttons to the right."
 mtui_at_b_t_colonial_n:0 "Colonial subsidies"
 mtui_at_b_t_colonial_n_tt:0 "§YColonial subsidies§![mtui_at_b_t_colonial_n_tt_guide]"
 mtui_at_b_t_colonial_n_tt_guide_on:0 "\n--------------------------------------\nSupport paid to our colonies.\n\n§GWhy it matters:§! Colonies grow faster with support.\n\n§OHow to change it:§! Colonial policy and the number of colonies."
 mtui_at_b_t_colonial_p:0 "§g([mtui_A_p_colonial]%)§!"
 mtui_at_b_t_colonial_p_tt:0 "§YColonial subsidies§![mtui_at_b_t_colonial_p_tt_guide]"
 mtui_at_b_t_colonial_p_tt_guide_on:0 "\n--------------------------------------\nSupport paid to our colonies.\n\n§GWhy it matters:§! Colonies grow faster with support.\n\n§OHow to change it:§! Colonial policy and the number of colonies."
 mtui_at_b_t_colonial_v:0 "§R[mtui_A_colonial]§!¤"
 mtui_at_b_t_colonial_v_tt:0 "§YColonial subsidies§![mtui_at_b_t_colonial_v_tt_guide]"
 mtui_at_b_t_colonial_v_tt_guide_on:0 "\n--------------------------------------\nSupport paid to our colonies.\n\n§GWhy it matters:§! Colonies grow faster with support.\n\n§OHow to change it:§! Colonial policy and the number of colonies."
 mtui_at_b_t_bal_n:0 "§YBalance§!"
 mtui_at_b_t_bal_n_tt:0 "§YBalance§![mtui_at_b_t_bal_n_tt_guide]"
 mtui_at_b_t_bal_n_tt_guide_on:0 "\n--------------------------------------\nRevenue minus expenses over the last year. Loans, interest and non-tax income are not included.\n\n§GWhy it matters:§! A lasting deficit drains the treasury and leads to loans and, eventually, bankruptcy.\n\n§OHow to change it:§! Raise revenue (reach, wealth, tax rights) or cut costs (military budget, infrastructure, welfare)."
 mtui_at_b_t_bal_v:0 "[mtui_A_balance_c]"
 mtui_at_b_t_bal_v_tt:0 "§YBalance§![mtui_at_b_t_bal_v_tt_guide]"
 mtui_at_b_t_bal_v_tt_guide_on:0 "\n--------------------------------------\nRevenue minus expenses over the last year. Loans, interest and non-tax income are not included.\n\n§GWhy it matters:§! A lasting deficit drains the treasury and leads to loans and, eventually, bankruptcy.\n\n§OHow to change it:§! Raise revenue (reach, wealth, tax rights) or cut costs (military budget, infrastructure, welfare)."
 mtui_at_b_infra_h:0 "§YInfrastructure Funding§!"
 mtui_at_b_infra_d:0 "Share of upkeep the state pays in a province. The rest is left to the elites, who only fund what serves them."
 mtui_at_b_if_Capitol:0 "Capitol"
 mtui_at_b_if_Capitol_tt:0 "§YCapitol funding§![mtui_at_b_if_Capitol_tt_guide]"
 mtui_at_b_if_Capitol_tt_guide_on:0 "\n--------------------------------------\nAdministrative buildings and courts. Supports state reach and administration.\n\n§GWhy it matters:§! Infrastructure the state does not pay for is maintained only where the elites see a benefit; the rest decays.\n\n§OHow to change it:§! Pick a share below, then press Apply. 100% means the state pays all upkeep in those provinces."
