 mtui_at_bg_pv_BGIndustry_n:0 "Industrial Monopoly"
 mtui_at_bg_pv_BGIndustry_n_tt:0 "§YIndustrial Monopoly§![mtui_at_bg_pv_BGIndustry_n_tt_guide]"
 mtui_at_bg_pv_BGIndustry_n_tt_guide_on:0 "\n--------------------------------------\nPLACEHOLDER: Whether the burghers may monopolise heavy industry. A monopoly hands them part of its revenue and raises their power.\n\n§GWhy it matters:§! Each level gives the burghers more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the burghers to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_bg_pv_BGIndustry_dn_tt:0 "Lower: [mtui_LD_BGIndustry]"
 mtui_at_bg_pv_BGIndustry_i0_tt:0 "[Privilege_BGIndustry0_title]\nThe burghers hold no monopoly over industrial facilities.§YNo effects§!"
 mtui_at_bg_pv_BGIndustry_i1_tt:0 "[Privilege_BGIndustry1_title]\nThe burghers hold a partial monopoly on making finished goods, forcing a portion of the labour to be diverted to their workhouses.\n§YEffects§!\n§R+1.0%§!£estate_city_burghers_icon_small£§OBurgher§! Power\n§YGuild Fees§!\n	     §Y+5.0%§! of all revenue from §OHeavy§! industry transfered to £estate_city_burghers_icon_small£§OBurgher§! Wealth\n§YState Property Capacity Impact§!\n	     §Y-5.0%§! Capacity cost of holding industrial property\n	     §Y+25.0§! State Property Capacity"
 mtui_at_bg_pv_BGIndustry_i2_tt:0 "[Privilege_BGIndustry2_title]\nThe Burgher Elite holds a complete monopoly on finished goods, squashing any competition against their workhouses. Forcing any resident who works in that industry to work in their facilities.\n§YEffects§!\n§R+2.0%§!£estate_city_burghers_icon_small£§OBurgher§! Power\n§YGuild Fees§!\n	     §Y+10.0%§! of all revenue from §OHeavy§! industry transfered to £estate_city_burghers_icon_small£§OBurgher§! Wealth\n§YState Property Capacity Impact§!\n	     §Y-10.0%§! Capacity cost of holding industrial property\n	     §Y+50.0§! State Property Capacity"
 mtui_at_bg_pv_BGIndustry_up_tt:0 "Raise: [mtui_LU_BGIndustry]"
 mtui_at_bg_pv_BGIndustry_l:0 "§Y[mtui_L_BGIndustry]§!"
 mtui_at_bg_pv_BGIndustry_l_tt:0 "§YIndustrial Monopoly§![mtui_at_bg_pv_BGIndustry_l_tt_guide]"
 mtui_at_bg_pv_BGIndustry_l_tt_guide_on:0 "\n--------------------------------------\nPLACEHOLDER: Whether the burghers may monopolise heavy industry. A monopoly hands them part of its revenue and raises their power.\n\n§GWhy it matters:§! Each level gives the burghers more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the burghers to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_bg_pv_BGLuxury_n:0 "Luxury Monopoly"
 mtui_at_bg_pv_BGLuxury_n_tt:0 "§YLuxury Monopoly§![mtui_at_bg_pv_BGLuxury_n_tt_guide]"
 mtui_at_bg_pv_BGLuxury_n_tt_guide_on:0 "\n--------------------------------------\nPLACEHOLDER: Whether the burghers may monopolise the luxury industries. A monopoly hands them part of their revenue and raises their power.\n\n§GWhy it matters:§! Each level gives the burghers more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the burghers to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_bg_pv_BGLuxury_dn_tt:0 "Lower: [mtui_LD_BGLuxury]"
 mtui_at_bg_pv_BGLuxury_i0_tt:0 "[Privilege_BGLuxury0_title]\nThe burghers hold no monopoly over our luxuries.§YNo effects§!"
 mtui_at_bg_pv_BGLuxury_i1_tt:0 "[Privilege_BGLuxury1_title]\nThe burghers hold an uncompetitive advantage in the luxury industry, owning great numbers of lands and facilities that produce valuable and marketable goods.\n§YEffects§!\n§R+1.0%§!£estate_city_burghers_icon_small£§OBurgher§! Power\n§YGuild Fees§!\n	     §Y+5.0%§! of all revenue from §OLuxury§! industry transfered to £estate_city_burghers_icon_small£§OBurgher§! Wealth\n§YState Property Capacity Impact§!\n	     §Y-5.0%§! Capacity cost of holding industrial property\n	     §Y+25.0§! State Property Capacity"
 mtui_at_bg_pv_BGLuxury_i2_tt:0 "[Privilege_BGLuxury2_title]\nGreat luxuries are owned and handled only by our rich urban elite. Their wealth and power have protected them from any outside influence on their most prized industry.\n§YEffects§!\n§R+2.0%§!£estate_city_burghers_icon_small£§OBurgher§! Power\n§YGuild Fees§!\n	     §Y+10.0%§! of all revenue from §OLuxury§! industry transfered to £estate_city_burghers_icon_small£§OBurgher§! Wealth\n§YState Property Capacity Impact§!\n	     §Y-10.0%§! Capacity cost of holding industrial property\n	     §Y+50.0§! State Property Capacity"
 mtui_at_bg_pv_BGLuxury_up_tt:0 "Raise: [mtui_LU_BGLuxury]"
 mtui_at_bg_pv_BGLuxury_l:0 "§Y[mtui_L_BGLuxury]§!"
 mtui_at_bg_pv_BGLuxury_l_tt:0 "§YLuxury Monopoly§![mtui_at_bg_pv_BGLuxury_l_tt_guide]"
 mtui_at_bg_pv_BGLuxury_l_tt_guide_on:0 "\n--------------------------------------\nPLACEHOLDER: Whether the burghers may monopolise the luxury industries. A monopoly hands them part of their revenue and raises their power.\n\n§GWhy it matters:§! Each level gives the burghers more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the burghers to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_bg_pv_BGConsumerGoods_n:0 "Consumer Goods Monopoly"
 mtui_at_bg_pv_BGConsumerGoods_n_tt:0 "§YConsumer Goods Monopoly§![mtui_at_bg_pv_BGConsumerGoods_n_tt_guide]"
 mtui_at_bg_pv_BGConsumerGoods_n_tt_guide_on:0 "\n--------------------------------------\nPLACEHOLDER: Whether the burghers may monopolise consumer goods such as cloth and textiles. A monopoly hands them part of their revenue and raises their power.\n\n§GWhy it matters:§! Each level gives the burghers more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the burghers to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_bg_pv_BGConsumerGoods_dn_tt:0 "Lower: [mtui_LD_BGConsumerGoods]"
 mtui_at_bg_pv_BGConsumerGoods_i0_tt:0 "[Privilege_BGConsumerGoods0_title]\nOur burghers hold no significant monopolies over consumer goods industries.§YNo effects§!"
 mtui_at_bg_pv_BGConsumerGoods_i1_tt:0 "[Privilege_BGConsumerGoods1_title]\nA swathe of workhouses and industry related to consumer goods are controlled by the burghers, stifling middle-class ownership of this industry.\n§YEffects§!\n§R+1.0%§!£estate_city_burghers_icon_small£§OBurgher§! Power\n§YGuild Fees§!\n	     §Y+5.0%§! of all revenue from §OConsumer Goods§! industry transfered to £estate_city_burghers_icon_small£§OBurgher§! Wealth\n§YState Property Capacity Impact§!\n	     §Y-5.0%§! Capacity cost of holding industrial property\n	     §Y+25.0§! State Property Capacity"
 mtui_at_bg_pv_BGConsumerGoods_i2_tt:0 "[Privilege_BGConsumerGoods2_title]\nCloth, textile mills and other industries are owned by a select few urban elitists. They have enjoyed a monopoly on this product and have used it to greatly enrich themselves at the expense of the residents.\n§YEffects§!\n§R+2.0%§!£estate_city_burghers_icon_small£§OBurgher§! Power\n§YGuild Fees§!\n	     §Y+10.0%§! of all revenue from §OConsumer Goods§! industry transfered to £estate_city_burghers_icon_small£§OBurgher§! Wealth\n§YState Property Capacity Impact§!\n	     §Y-10.0%§! Capacity cost of holding industrial property\n	     §Y+50.0§! State Property Capacity"
 mtui_at_bg_pv_BGConsumerGoods_up_tt:0 "Raise: [mtui_LU_BGConsumerGoods]"
 mtui_at_bg_pv_BGConsumerGoods_l:0 "§Y[mtui_L_BGConsumerGoods]§!"
 mtui_at_bg_pv_BGConsumerGoods_l_tt:0 "§YConsumer Goods Monopoly§![mtui_at_bg_pv_BGConsumerGoods_l_tt_guide]"
 mtui_at_bg_pv_BGConsumerGoods_l_tt_guide_on:0 "\n--------------------------------------\nPLACEHOLDER: Whether the burghers may monopolise consumer goods such as cloth and textiles. A monopoly hands them part of their revenue and raises their power.\n\n§GWhy it matters:§! Each level gives the burghers more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the burghers to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_bg_pv_BGAutonomy_n:0 "Urban Autonomy"
 mtui_at_bg_pv_BGAutonomy_n_tt:0 "§YUrban Autonomy§![mtui_at_bg_pv_BGAutonomy_n_tt_guide]"
 mtui_at_bg_pv_BGAutonomy_n_tt_guide_on:0 "\n--------------------------------------\nPLACEHOLDER: How freely the cities run their own affairs. More autonomy raises burgher power and their say at court, and the cities need fewer officials, but tollage becomes more costly to collect.\n\n§GWhy it matters:§! Each level gives the burghers more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the burghers to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_bg_pv_BGAutonomy_dn_tt:0 "Lower: [mtui_LD_BGAutonomy]"
 mtui_at_bg_pv_BGAutonomy_i0_tt:0 "[Privilege_BGAutonomy0_title]\nThe city and urban elite are often allowed to run their own affairs, but they are balanced with the state’s permission and the sovereign's will.§YNo effects§!"
 mtui_at_bg_pv_BGAutonomy_i1_tt:0 "[Privilege_BGAutonomy1_title]\nOn paper, our state’s ability to govern our cities should be almost assured, but oftentimes our authorities will look the other way when matters concerning our richest citizens turn up.\n§YEffects§!\n§R+10.0%§! Autonomy from£estate_city_burghers_icon_small£§OBurgher§! Power\n§G+0.25§!£estate_city_burghers_icon_small£Base Consultation\n§G-10.0%§! Bureaucrats needed per 500 Urban Population"
 mtui_at_bg_pv_BGAutonomy_i2_tt:0 "[Privilege_BGAutonomy2_title]\nOur state generally affords the Burghers local rights to their own affairs, turning a blind-eye to some less savory, but still profitable affairs of the merchant class.\n§YEffects§!\n§R+20.0%§! Autonomy from£estate_city_burghers_icon_small£§OBurgher§! Power\n§G+0.5§!£estate_city_burghers_icon_small£Base Consultation\n§G-15.0%§! Bureaucrats needed per 500 Urban Population"
 mtui_at_bg_pv_BGAutonomy_i3_tt:0 "[Privilege_BGAutonomy3_title]\nCodified privileges are afforded to the elite that own property within our cities, affording them more flexibility within its affairs. Rights given to the city are numerous, giving it space to grow in the context of state oversight.\n§YEffects§!\n§R+30.0%§! Autonomy from£estate_city_burghers_icon_small£§OBurgher§! Power\n§G+1.0§!£estate_city_burghers_icon_small£Base Consultation\n§R+25.0%§! Mana Cost of §YTollage§!\n§G-20.0%§! Bureaucrats needed per 500 Urban Population"
 mtui_at_bg_pv_BGAutonomy_i4_tt:0 "[Privilege_BGAutonomy4_title]\nThe rights and charters granted to our cities are immense, leading to them operating separately from our sovereign’s desires if they so choose. Oftentimes, those who find themselves in trouble with the sovereign will head to these cities to escape justice, as our laws do not penetrate into the cities.\n§YEffects§!\n§R+40.0%§! Autonomy from£estate_city_burghers_icon_small£§OBurgher§! Power\n§G+1.5§!£estate_city_burghers_icon_small£Base Consultation\n§R+50.0%§! Mana Cost of §YTollage§!\n§G-25.0%§! Bureaucrats needed per 500 Urban Population"
 mtui_at_bg_pv_BGAutonomy_i5_tt:0 "[Privilege_BGAutonomy5_title]\nOur cities are independent in all but name. The charters and powers that are granted to the people that run our urban centers are almost equal to that of the nobility. In reality, our cities are nominally just vassals within our territory, existing almost entirely separate from the sovereign’s bounds of legal interference.\n§YEffects§!\n§R+50.0%§! Autonomy from£estate_city_burghers_icon_small£§OBurgher§! Power\n§G+2.0§!£estate_city_burghers_icon_small£Base Consultation\n§R+100.0%§! Mana Cost of §YTollage§!\n§G-33.0%§! Bureaucrats needed per 500 Urban Population"
 mtui_at_bg_pv_BGAutonomy_up_tt:0 "Raise: [mtui_LU_BGAutonomy]"
 mtui_at_bg_pv_BGAutonomy_l:0 "§Y[mtui_L_BGAutonomy]§!"
 mtui_at_bg_pv_BGAutonomy_l_tt:0 "§YUrban Autonomy§![mtui_at_bg_pv_BGAutonomy_l_tt_guide]"
 mtui_at_bg_pv_BGAutonomy_l_tt_guide_on:0 "\n--------------------------------------\nPLACEHOLDER: How freely the cities run their own affairs. More autonomy raises burgher power and their say at court, and the cities need fewer officials, but tollage becomes more costly to collect.\n\n§GWhy it matters:§! Each level gives the burghers more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the burghers to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_bg_pv_BGPatent_n:0 "Patent Enforcement"
 mtui_at_bg_pv_BGPatent_n_tt:0 "§YPatent Enforcement§![mtui_at_bg_pv_BGPatent_n_tt_guide]"
 mtui_at_bg_pv_BGPatent_n_tt_guide_on:0 "\n--------------------------------------\nPLACEHOLDER: How inventions and products are protected, from civic trade laws upheld by the state down to no protection at all. Weaker protection raises burgher gravity and local corruption.\n\n§GWhy it matters:§! Each level gives the burghers more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the burghers to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_bg_pv_BGPatent_dn_tt:0 "Lower: [mtui_LD_BGPatent]"
 mtui_at_bg_pv_BGPatent_i0_tt:0 "[Privilege_BGPatent0_title]\nOur patent office is headed by a bureaucratic staff promoted through meritocratic measures. There is a very clear procedure and various criteria that must be met to register your patent. The fees are applied normally throughout all transactions, with strong protections to the creator should someone plagiarise their work and attempt to sell it as their own.\n§YEffects§!\n§G+20.0%§! £estate_bureaucracy_icon_small£ Bureaucratic Influence\n§G+10.0%§! Urban Skills"
 mtui_at_bg_pv_BGPatent_i1_tt:0 "[Privilege_BGPatent1_title]\nWe have developed a rudimentary office for registering devices, products, discoveries and other work. While it is often headed by the same people who ran the systems before, there is now very much a chance that your idea could truly become your own. However, if a jealous noble or failing burgher finds your patent particularly interesting, they could just purchase it.\n§YEffects§!\n§R+1.0%§!£estate_city_burghers_icon_small£§OBurgher§! Gravity\n§R+2.5%§! §YLocal Corruption§! from£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power\n§R+5.0%§! §YLocal Corruption§! from£estate_city_burghers_icon_small£§OBurgher§! Power\n§G+10.0%§! £estate_bureaucracy_icon_small£ Bureaucratic Influence\n§G+0.25§!£estate_city_burghers_icon_small£Base Consultation\n§G+5.0%§! Urban Skills"
 mtui_at_bg_pv_BGPatent_i2_tt:0 "[Privilege_BGPatent2_title]\nWe have a system of production that includes workhouses, shops and goods, that are given charter by our sovereign, who are then granted exclusive permission to create that product. Anyone who is caught trying to trade in something forbidden or producing a good without a proper permit will face swift justice from the bourgeoisie.\n§YEffects§!\n§R+2.5%§!£estate_city_burghers_icon_small£§OBurgher§! Gravity\n§R+5.0%§! §YLocal Corruption§! from£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power\n§R+15.0%§! §YLocal Corruption§! from£estate_city_burghers_icon_small£§OBurgher§! Power\n§G+0.5§!£estate_city_burghers_icon_small£Base Consultation"
 mtui_at_bg_pv_BGPatent_i3_tt:0 "[Privilege_BGPatent3_title]\nHonour and loyalty are what bind our dealings. Customs, traditions, and written laws in small local areas that engage with trade are what bind our goods. That does mean that often something that is forbidden here, is allowed somewhere else. It’s all just a matter of finding the right customer.\n§YEffects§!\n§R+5.0%§!£estate_city_burghers_icon_small£§OBurgher§! Gravity\n§R+10.0%§! §YLocal Corruption§! from£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power\n§R+25.0%§! §YLocal Corruption§! from£estate_city_burghers_icon_small£§OBurgher§! Power\n§R+25.0%§! Autonomy from£estate_city_burghers_icon_small£§OBurgher§! Power\n§R-0.5§!£loc_pitchfork£ Base Welfare"
 mtui_at_bg_pv_BGPatent_i4_tt:0 "[Privilege_BGPatent4_title]\nWe have no system of patents or methods of protecting anyone from just copying whatever someone makes. Inventors find their goods quickly stolen and poorly made somewhere else. As such, there isn’t much of a commercial incentive to creating any sort of industry here.\n§YEffects§!\n§R+5.0%§!£estate_city_burghers_icon_small£§OBurgher§! Gravity\n§R-20.0%§! Attractiveness to Foreign Sectors\n§R+15.0%§! §YLocal Corruption§! from£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power\n§R+30.0%§! §YLocal Corruption§! from£estate_city_burghers_icon_small£§OBurgher§! Power\n§R-1.0§!£loc_pitchfork£ Base Welfare\n§R-2.5%§! Innovativeness Gain"
 mtui_at_bg_pv_BGPatent_up_tt:0 "Raise: [mtui_LU_BGPatent]"
 mtui_at_bg_pv_BGPatent_l:0 "§Y[mtui_L_BGPatent]§!"
 mtui_at_bg_pv_BGPatent_l_tt:0 "§YPatent Enforcement§![mtui_at_bg_pv_BGPatent_l_tt_guide]"
 mtui_at_bg_pv_BGPatent_l_tt_guide_on:0 "\n--------------------------------------\nPLACEHOLDER: How inventions and products are protected, from civic trade laws upheld by the state down to no protection at all. Weaker protection raises burgher gravity and local corruption.\n\n§GWhy it matters:§! Each level gives the burghers more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the burghers to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_bg_pv_BGCivic_n:0 "Urban Civic Service"
 mtui_at_bg_pv_BGCivic_n_tt:0 "§YUrban Civic Service§![mtui_at_bg_pv_BGCivic_n_tt_guide]"
 mtui_at_bg_pv_BGCivic_n_tt_guide_on:0 "\n--------------------------------------\nPLACEHOLDER: Who sits on the city councils: people chosen on merit, the well connected, the wealthy, or the nobility. Each step moves influence, autonomy and a share of urban revenue towards the burghers or the nobles.\n\n§GWhy it matters:§! Each level gives the burghers more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the burghers to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_bg_pv_BGCivic_dn_tt:0 "Lower: [mtui_LD_BGCivic]"
 mtui_at_bg_pv_BGCivic_i0_tt:0 "[Privilege_BGCivic0_title]\nOur politics have evolved to a meritocratic service, where organized political parties are beginning to coalesce in our nation. Liberty, authority, taxation, everything appears to be on the table. We have many of our people choosing sides, with their wisdom, we pray they choose well.§YNo Effects§!"
 mtui_at_bg_pv_BGCivic_i1_tt:0 "[Privilege_BGCivic1_title]\nCouncil status has evolved beyond just something that one can buy. Well-connected, ordinary and charismatic individuals have gotten themselves onto the city council and have achieved remarkable success. However, wealth still plays a key factor in victory, and many of our cities are still headed by the richest families in the land. However, there appears to be a new type of politics rising, where ideologies could form and metastasise into something greater.\n§YEffects§!\n§Y+10.0%§! £estate_city_burghers_icon_small£§OMetropolitan§! Influence\n§R+10.0%§! Autonomy from£estate_city_burghers_icon_small£§OBurgher§! Power\n§R+10.0%§! Mana Cost of §YTollage§!"
 mtui_at_bg_pv_BGCivic_i2_tt:0 "[Privilege_BGCivic2_title]\nCouncil status is mostly decided upon importance in the urban economy. The more capital you have to expend, the more say you’ll have on the council. Sometimes, the council is essentially a dictatorship, with the mayor acting as dictator. However, these are not typically people of noble birth, but come from typically rich merchant families. Politics is decided by a deep divide between the upper class of the city and the residents.\n§YEffects§!\n§R+10.0%§!£estate_city_burghers_icon_small£§OBurgher§! Gravity\n§R+20.0%§! Autonomy from£estate_city_burghers_icon_small£§OBurgher§! Power\n§Y+5.0%§! of all revenue from all §TUrban§! industries transfered to £estate_city_burghers_icon_small£§OBurgher§! Wealth\n§R+25.0%§! Mana Cost of Inheritance Tax\n§R+25.0%§! Mana Cost of §YTollage§!"
 mtui_at_bg_pv_BGCivic_i3_tt:0 "[Privilege_BGCivic3_title]\nOur urban centers are ruled by the nobility in all but name. All the mayors are from major noble families and if there is any sort of council, it's all in the interest of the nobility. Only those with blood and status can rule our glorious urban centers. Noble politics clutter our towns, as people discuss the various feuds that cause intrigue among the populace.\n§YEffects§!\n§R+10.0%§!£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Gravity\n§R+25.0%§! Autonomy from£estate_greater_nobles_icon_small£§O[Prov_Noble]§! Power\n§Y+5.0%§! of all revenue from all §TUrban§! industries transfered to £estate_greater_nobles_icon_small£§O[Prov_Noble]§! Wealth\n§R-10.0%§! Urban Skills"
 mtui_at_bg_pv_BGCivic_up_tt:0 "Raise: [mtui_LU_BGCivic]"
 mtui_at_bg_pv_BGCivic_l:0 "§Y[mtui_L_BGCivic]§!"
 mtui_at_bg_pv_BGCivic_l_tt:0 "§YUrban Civic Service§![mtui_at_bg_pv_BGCivic_l_tt_guide]"
 mtui_at_bg_pv_BGCivic_l_tt_guide_on:0 "\n--------------------------------------\nPLACEHOLDER: Who sits on the city councils: people chosen on merit, the well connected, the wealthy, or the nobility. Each step moves influence, autonomy and a share of urban revenue towards the burghers or the nobles.\n\n§GWhy it matters:§! Each level gives the burghers more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the burghers to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_bg_pv_BGOligopolization_n:0 "Oligopolization"
 mtui_at_bg_pv_BGOligopolization_n_tt:0 "§YOligopolization§![mtui_at_bg_pv_BGOligopolization_n_tt_guide]"
 mtui_at_bg_pv_BGOligopolization_n_tt_guide_on:0 "\n--------------------------------------\nPLACEHOLDER: How concentrated burgher wealth and power are. A few rich merchant families gain influence, and burgher power and loyalty swing faster.\n\n§GWhy it matters:§! Each level gives the burghers more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the burghers to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_bg_pv_BGOligopolization_dn_tt:0 "Lower: [mtui_LD_BGOligopolization]"
 mtui_at_bg_pv_BGOligopolization_i0_tt:0 "[Privilege_BGOligopolization0_title]\nOur Burgher’s power is generally spread evenly and greatly across a great number of diverse, disconnected families and powerful individuals. Giving the sovereign a double edged sword in dealing with a great number of influential Burghers.§YNo effects§!"
 mtui_at_bg_pv_BGOligopolization_i1_tt:0 "[Privilege_BGOligopolization1_title]\nCommercial contracts and property ownership has often been granted to a smaller section of our Burghers, affording them with more influence over the realm than the majority of the burghers.\n§YEffects§!\n§Y+10.0%§! £estate_city_burghers_icon_small£§OMetropolitan§! Influence\n§Y+25.0%§!£estate_city_burghers_icon_small£§OBurgher§! Power Shift Speed\n§Y+25.0%§!£estate_city_burghers_icon_small£§OBurgher§! Loyalty Shift Speed"
 mtui_at_bg_pv_BGOligopolization_i2_tt:0 "[Privilege_BGOligopolization2_title]\nWealth and urban power have coalesced into a select few in our urban centers. Leaving a small minority wielding great power in our cities and trade networks.\n§YEffects§!\n§Y+50.0%§!£estate_city_burghers_icon_small£§OBurgher§! Power Shift Speed\n§Y+50.0%§!£estate_city_burghers_icon_small£§OBurgher§! Loyalty Shift Speed\n§R+5.0%§!£estate_city_burghers_icon_small£§OBurgher§! Gravity"
 mtui_at_bg_pv_BGOligopolization_i3_tt:0 "[Privilege_BGOligopolization3_title]\nThe power of our urban upper class is defined by a small number of very rich merchants that control vast sectors of commerce and production. If the sovereign wishes to do business with any of his urban domains, they must go through these powerful figures.\n§YEffects§!\n§Y+100.0%§!£estate_city_burghers_icon_small£§OBurgher§! Power Shift Speed\n§Y+100.0%§!£estate_city_burghers_icon_small£§OBurgher§! Loyalty Shift Speed\n§R+10.0%§!£estate_city_burghers_icon_small£§OBurgher§! Gravity"
 mtui_at_bg_pv_BGOligopolization_up_tt:0 "Raise: [mtui_LU_BGOligopolization]"
 mtui_at_bg_pv_BGOligopolization_l:0 "§Y[mtui_L_BGOligopolization]§!"
 mtui_at_bg_pv_BGOligopolization_l_tt:0 "§YOligopolization§![mtui_at_bg_pv_BGOligopolization_l_tt_guide]"
 mtui_at_bg_pv_BGOligopolization_l_tt_guide_on:0 "\n--------------------------------------\nPLACEHOLDER: How concentrated burgher wealth and power are. A few rich merchant families gain influence, and burgher power and loyalty swing faster.\n\n§GWhy it matters:§! Each level gives the burghers more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the burghers to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_bg_pv_BGRuralOwnership_n:0 "Rural Ownership"
 mtui_at_bg_pv_BGRuralOwnership_n_tt:0 "§YRural Ownership§![mtui_at_bg_pv_BGRuralOwnership_n_tt_guide]"
 mtui_at_bg_pv_BGRuralOwnership_n_tt_guide_on:0 "\n--------------------------------------\nPLACEHOLDER: How far city merchants may buy up the countryside. Speculation brings the burghers peasant dues and power at the expense of the rural order.\n\n§GWhy it matters:§! Each level gives the burghers more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the burghers to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_bg_pv_BGRuralOwnership_dn_tt:0 "Lower: [mtui_LD_BGRuralOwnership]"
 mtui_at_bg_pv_BGRuralOwnership_i0_tt:0 "[Privilege_BGRuralOwnership0_title]\nWhether through long standing traditions or through government policies, the rural community enjoys protections against the bourgeoisie of the cities. There are legal and financial penalties for unfair land purchases, and the countryside decides for itself on what path they should go down.\n§YEffects§!\n§G+10.0%§! Agriculture Skill"
 mtui_at_bg_pv_BGRuralOwnership_i1_tt:0 "[Privilege_BGRuralOwnership1_title]\n Our rural communities enjoy a great degree of freedom from the urban elite in the countryside. Land purchases are rare and the peasants enjoy a tidy profit from selling their land. The rural community generally runs their communities well and without interference, leading to a healthy countryside.\n§YEffects§!\n§Y+5.0%§! Base Rate for all §lPeasantry§! Dues owed to the£estate_city_burghers_icon_small£§OBurghers§!\n§Y+5.0%§! £estate_city_burghers_icon_small£§OMetropolitan§! Influence\n§G+0.50§!£estate_greater_nobles_icon_small£Base Hierarchy\n§G+5.0%§! Exotics Skill"
 mtui_at_bg_pv_BGRuralOwnership_i2_tt:0 "[Privilege_BGRuralOwnership2_title]\nThe interaction between our urban elite and our rural elite are relatively balanced, many times one will cross into the other but none will outright dominate. It is somewhat true that some lands have been bought from their rightful owners for speculative profit, it has not overwhelmed our community and the natural order of the rural community continues on.\n§YEffects§!\n§Y+20.0%§! Base Rate for all §lPeasantry§! Dues owed to the£estate_city_burghers_icon_small£§OBurghers§!\n§R+5.0%§!£estate_city_burghers_icon_small£§OBurgher§! Power\n§R-1.0§!£estate_greater_nobles_icon_small£Base Hierarchy\n§G+10.0%§! Exotics Skill\n§R-5.0%§! Agriculture Skill"
 mtui_at_bg_pv_BGRuralOwnership_i3_tt:0 "[Privilege_BGRuralOwnership3_title]\nA good portion of our countryside is littered with various merchants and outside special interests, leaving an outsized influence from the city to our rural communities. Oftentimes, rich citizens from the city will buy large portions of land outside the city, replacing valuable farmland for their own commercial ventures. This can have some benefit in increasing wealth, but the constant intrusion by the urban elite oftentimes leads to conflict with our rural community.\n§YEffects§!\n§Y+30.0%§! Base Rate for all §lPeasantry§! Dues owed to the£estate_city_burghers_icon_small£§OBurghers§!\n§R+10.0%§!£estate_city_burghers_icon_small£§OBurgher§! Power\n§R-1.5§!£estate_greater_nobles_icon_small£Base Hierarchy\n§G+20.0%§! Exotics Skill\n§R-10.0%§! Agriculture Skill"
 mtui_at_bg_pv_BGRuralOwnership_i4_tt:0 "[Privilege_BGRuralOwnership4_title]\nThe rural elite is a mere extension of the bourgeoisie’s policies. The councils of the countryside are typically headed by either family of the nearby urban center, or are deep in the pockets of the mercantile elite. As such, foodstuffs and crops to support a healthy rural community are instead replaced with cashcrops and goods with high demand on the market.\n§YEffects§!\n§Y+40.0%§! Base Rate for all §lPeasantry§! Dues owed to the£estate_city_burghers_icon_small£§OBurghers§!\n§R+15.0%§!£estate_city_burghers_icon_small£§OBurgher§! Power\n§R-2.0§!£estate_greater_nobles_icon_small£Base Hierarchy\n§G+30.0%§! Exotics Skill\n§R-20.0%§! Agriculture Skill"
 mtui_at_bg_pv_BGRuralOwnership_up_tt:0 "Raise: [mtui_LU_BGRuralOwnership]"
 mtui_at_bg_pv_BGRuralOwnership_l:0 "§Y[mtui_L_BGRuralOwnership]§!"
 mtui_at_bg_pv_BGRuralOwnership_l_tt:0 "§YRural Ownership§![mtui_at_bg_pv_BGRuralOwnership_l_tt_guide]"
 mtui_at_bg_pv_BGRuralOwnership_l_tt_guide_on:0 "\n--------------------------------------\nPLACEHOLDER: How far city merchants may buy up the countryside. Speculation brings the burghers peasant dues and power at the expense of the rural order.\n\n§GWhy it matters:§! Each level gives the burghers more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the burghers to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_bg_pv_BGGuild_n:0 "Guild Entrenchment"
 mtui_at_bg_pv_BGGuild_n_tt:0 "§YGuild Entrenchment§![mtui_at_bg_pv_BGGuild_n_tt_guide]"
 mtui_at_bg_pv_BGGuild_n_tt_guide_on:0 "\n--------------------------------------\nPLACEHOLDER: How entrenched the guilds are. Guilds raise urban skills but stifle competition, and bring the burghers power and local corruption.\n\n§GWhy it matters:§! Each level gives the burghers more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the burghers to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_bg_pv_BGGuild_dn_tt:0 "Lower: [mtui_LD_BGGuild]"
 mtui_at_bg_pv_BGGuild_i0_tt:0 "[Privilege_BGGuild0_title]\nGuilds, and their uncompetitive practice, either never took root here or were legislated out of existence through trade and patent laws that allowed independent artisans to thrive and business entities to form.§YNo effects§!"
 mtui_at_bg_pv_BGGuild_i1_tt:0 "[Privilege_BGGuild1_title]\nOur guilds are generally restricted from the most uncompetitive and unfair practices of the system. Independent artisans can operate and invent without much harassment, as long as they are not stepping on the toes of their local guild. Price fixing happens on a small scale but the free market is generally allowed to decide the price of goods.\n§YEffects§!\n§G+3.0%§! Urban Skills\n §R10.0%§! Skill Bonus Reduction\n§R+10.0%§! £estate_city_burghers_icon_small£ §OBurghers§! Power from Wealth\n§R+10.0%§! §YLocal Corruption§! from£estate_city_burghers_icon_small£§OBurgher§! Power\n§Y+10.0%§! of §TResident§! Income transferred to £estate_city_burghers_icon_small£ §OBurgher§! Wealth"
 mtui_at_bg_pv_BGGuild_i2_tt:0 "[Privilege_BGGuild2_title]\nThe guilds function as a vital part of our industry. Workshops are generally owned by guilds, with vast networks of other guilds helping to keep the price of their goods consistent, and the quality high. Independent artisans can thrive, but often have to pay service or fees to the local guilds. That’s if they are able to keep afloat with uncompetitive price fixing.\n§YEffects§!\n§G+7.5%§! Urban Skills\n §R25.0%§! Skill Bonus Reduction\n§R+10.0%§! £estate_city_burghers_icon_small£ §OBurghers§! Power from Wealth\n§R+10.0%§! §YLocal Corruption§! from£estate_city_burghers_icon_small£§OBurgher§! Power\n§Y+10.0%§! of §TResident§! Income transferred to £estate_city_burghers_icon_small£ §OBurgher§! Wealth"
 mtui_at_bg_pv_BGGuild_i3_tt:0 "[Privilege_BGGuild3_title]\nThe guild system is deeply entrenched within our urban networks. Independent artisans are shoved out of the system by either uncompetitive laws favoring the guilds, or having to compete in a market saturated with guilds. Almost nothing is made without the guild’s express knowledge or permission. Goods are generally still affected by market price but the guilds do a great job of fixing them.\n§YEffects§!\n§G+16.5%§! Urban Skills\n §R40.0%§! Skill Bonus Reduction\n§R+20.0%§! £estate_city_burghers_icon_small£ §OBurghers§! Power from Wealth\n§R+20.0%§! §YLocal Corruption§! from£estate_city_burghers_icon_small£§OBurgher§! Power\n§Y+20.0%§! of §TResident§! Income transferred to £estate_city_burghers_icon_small£ §OBurgher§! Wealth"
 mtui_at_bg_pv_BGGuild_i4_tt:0 "[Privilege_BGGuild4_title]\nOur entire urban industry is completely dependent on the guild system. Anyone who is seen creating goods outside of the guild system is typically quickly dealt with by their members. The rights of the various guilds are vast and they operate almost as foreign entities when it comes to laws. Price controls on goods are very steep and are often settled in cartel-esque entities.\n§YEffects§!\n§G+30.0%§! Urban Skills\n §R50.0%§! Skill Bonus Reduction\n§R+30.0%§! £estate_city_burghers_icon_small£ §OBurghers§! Power from Wealth\n§R+30.0%§! §YLocal Corruption§! from£estate_city_burghers_icon_small£§OBurgher§! Power\n§Y+30.0%§! of §TResident§! Income transferred to £estate_city_burghers_icon_small£ §OBurgher§! Wealth"
 mtui_at_bg_pv_BGGuild_up_tt:0 "Raise: [mtui_LU_BGGuild]"
 mtui_at_bg_pv_BGGuild_l:0 "§Y[mtui_L_BGGuild]§!"
 mtui_at_bg_pv_BGGuild_l_tt:0 "§YGuild Entrenchment§![mtui_at_bg_pv_BGGuild_l_tt_guide]"
 mtui_at_bg_pv_BGGuild_l_tt_guide_on:0 "\n--------------------------------------\nPLACEHOLDER: How entrenched the guilds are. Guilds raise urban skills but stifle competition, and bring the burghers power and local corruption.\n\n§GWhy it matters:§! Each level gives the burghers more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the burghers to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_bg_pv_BGLicensing_n:0 "Corporate Licensing"
 mtui_at_bg_pv_BGLicensing_n_tt:0 "§YCorporate Licensing§![mtui_at_bg_pv_BGLicensing_n_tt_guide]"
 mtui_at_bg_pv_BGLicensing_n_tt_guide_on:0 "\n--------------------------------------\nPLACEHOLDER: Who may license new businesses: a merit-based office, the sovereign, or no one at all. Weaker licensing sends urban revenue to the nobles and hurts trade.\n\n§GWhy it matters:§! Each level gives the burghers more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the burghers to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_bg_pv_BGLicensing_dn_tt:0 "Lower: [mtui_LD_BGLicensing]"
 mtui_at_bg_pv_BGLicensing_i0_tt:0 "[Privilege_BGLicensing0_title]\nThe establishment of a bureaucratic registration department, headed by skilled individuals promoted on meritocratic grounds. They issue out business licenses with ease and great efficiency. So that even a low peasant can start a business.\n§YEffects§!\n§Y+20.0%§! §TResident§! Share of Elite Corruption Income"
 mtui_at_bg_pv_BGLicensing_i1_tt:0 "[Privilege_BGLicensing1_title]\nWe have now developed a corporate registration office so that the inventive people of our realm can register their businesses quickly and efficiently. However, the majority of the staff is headed by our nobility, so there is obviously going to be favors within the family.\n§YEffects§!\n§Y+10.0%§! £estate_city_burghers_icon_small£§OMetropolitan§! Influence\n§Y+5.0%§! £estate_greater_nobles_icon_small£§OAristocratic§! Influence"
 mtui_at_bg_pv_BGLicensing_i2_tt:0 "[Privilege_BGLicensing2_title]\nOur ability to establish industry within our cities lies within our sovereign, who is the only one to dispense the rights to establish industry within a city. Such industries are obviously to be endowed with incredible prestige owned by and connected with such wealthy individuals who could get this authorisation, and we will gladly pay their costs.\n§YEffects§!\n§Y-5.0%§! £estate_city_burghers_icon_small£§OMetropolitan§! Influence\n§Y+5.0%§! of all revenue from all §TUrban§! industries transfered to £estate_greater_nobles_icon_small£§O[Prov_Noble]§! Wealth\n§R-10.0%§! Trade Skill"
 mtui_at_bg_pv_BGLicensing_i3_tt:0 "[Privilege_BGLicensing3_title]\nOur realm does not have the legal framework required to be able to invest in and make new industries. Those that are founded are typically done by wealthy nobles looking to extract additional wealth from the urban cities.\n§YEffects§!\n§G-10.0%§!£estate_city_burghers_icon_small£§OBurgher§! Gravity\n§Y+10.0%§! of all revenue from all §TUrban§! industries transfered to £estate_greater_nobles_icon_small£§O[Prov_Noble]§! Wealth\n§R-20.0%§! Trade Skill\n§R-10.0%§! Urban Skill"
 mtui_at_bg_pv_BGLicensing_up_tt:0 "Raise: [mtui_LU_BGLicensing]"
 mtui_at_bg_pv_BGLicensing_l:0 "§Y[mtui_L_BGLicensing]§!"
 mtui_at_bg_pv_BGLicensing_l_tt:0 "§YCorporate Licensing§![mtui_at_bg_pv_BGLicensing_l_tt_guide]"
 mtui_at_bg_pv_BGLicensing_l_tt_guide_on:0 "\n--------------------------------------\nPLACEHOLDER: Who may license new businesses: a merit-based office, the sovereign, or no one at all. Weaker licensing sends urban revenue to the nobles and hurts trade.\n\n§GWhy it matters:§! Each level gives the burghers more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the burghers to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_bg_pv_BGTaxE_n:0 "Tax Obligations"
 mtui_at_bg_pv_BGTaxE_n_tt:0 "§YTax Obligations§![mtui_at_bg_pv_BGTaxE_n_tt_guide]"
 mtui_at_bg_pv_BGTaxE_n_tt_guide_on:0 "\n--------------------------------------\nPLACEHOLDER: How much tax the burghers actually owe. Every exemption makes charter fees harder to collect.\n\n§GWhy it matters:§! Each level gives the burghers more at the expense of the state, or less. Hover the level icons for their effects.\n\n§OHow to change it:§! Use the arrows. Granting a privilege needs little and pleases them; revoking one costs power and needs the burghers to be weak enough to accept it. Hover an arrow for the requirements."
 mtui_at_bg_pv_BGTaxE_dn_tt:0 "Lower: [mtui_LD_BGTaxE]"
 mtui_at_bg_pv_BGTaxE_i0_tt:0 "[Privilege_BGTaxE0_title]\nLegal and financial loopholes are generally closed and the very worst of tax fraud is dealt with swiftly.§YNo effects§!"
 mtui_at_bg_pv_BGTaxE_i1_tt:0 "[Privilege_BGTaxE1_title]\n Loopholes in the tax code have been mostly fixed, but through clever financial trickery, our richest citizens are still able to move goods around to avoid the highest of taxation.\n§YEffects§!\n§R+20.0%§! Mana Cost of §YCharter Fees§!\n(§R-20.0%§! *£estate_city_burghers_icon_small£§OBurgher§! Loyalty) Tax from£estate_city_burghers_icon_small£§OBurghers§!"
 mtui_at_bg_pv_BGTaxE_i2_tt:0 "[Privilege_BGTaxE2_title]\nLarge loopholes still exist, and the richest citizens often find ways of avoiding taxation, leading the realm with a difficult time of tax collection.\n§YEffects§!\n§R+40.0%§! Mana Cost of §YCharter Fees§!\n(§R-40.0%§! *£estate_city_burghers_icon_small£§OBurgher§! Loyalty) Tax from£estate_city_burghers_icon_small£§OBurghers§!"
 mtui_at_bg_pv_BGTaxE_i3_tt:0 "[Privilege_BGTaxE3_title]\nThe realm often has trouble taxing the burghers, as there are a plethora of loopholes and tax breaks that lead to unintended consequences, leaving our state without a steady revenue stream.\n§YEffects§!\n§R+60.0%§! Mana Cost of §YCharter Fees§!\n(§R-60.0%§! *£estate_city_burghers_icon_small£§OBurgher§! Loyalty) Tax from£estate_city_burghers_icon_small£§OBurghers§!"
 mtui_at_bg_pv_BGTaxE_i4_tt:0 "[Privilege_BGTaxE4_title]\nVast loopholes, exemptions and legal oddities mean that our wealthiest citizens often avoid paying any tax altogether. Any tax that is paid is minimal at best and often fraudulent.\n§YEffects§!\n§R+80.0%§! Mana Cost of §YCharter Fees§!\n(§R-80.0%§! *£estate_city_burghers_icon_small£§OBurgher§! Loyalty) Tax from£estate_city_burghers_icon_small£§OBurghers§!"
 mtui_at_bg_pv_BGTaxE_i5_tt:0 "[Privilege_BGTaxE5_title]\nVery little effort has been made by the state to extract money from our mercantile and industrial ventures. The wealthiest of our citizens breeze through our tax code with nary a problem.\n§YEffects§!\n§R+100.0%§! Mana Cost of §YCharter Fees§!\n(§R-100.0%§! *£estate_city_burghers_icon_small£§OBurgher§! Loyalty) Tax from£estate_city_burghers_icon_small£§OBurghers§!"
 mtui_at_bg_pv_BGTaxE_up_tt:0 "Raise: [mtui_LU_BGTaxE]"
 mtui_at_bg_pv_BGTaxE_l:0 "§Y[mtui_L_BGTaxE]§!"
 mtui_at_bg_pv_BGTaxE_l_tt:0 "§YTax Obligations§![mtui_at_bg_pv_BGTaxE_l_tt_guide]"
