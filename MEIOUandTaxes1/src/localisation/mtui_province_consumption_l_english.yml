 mtui_pc_luxury_head:0 "§YGoods, last year§!"
 mtui_pc_luxury_head_tt:0 "For each class: how much of each good it bought last year, and how much it needed. §GGreen§!: it bought all it needed; §Rred§!: less, so part of the need went unmet. Under each good: the market of this province.[mtui_pc_luxury_head_tt_guide]"
 mtui_pc_luxury_head_tt_guide_on:0 "\n\n§GWhy it matters:§! Unmet needs lower needs fulfillment: food and life needs drive births and deaths, comfort and luxury keep the wealthier classes content.\n\n§OHow to change it:§! More production in the province or its trade node, lower prices, or higher incomes."
