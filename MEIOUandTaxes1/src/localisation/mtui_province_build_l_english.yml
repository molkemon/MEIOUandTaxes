 mtui_bw_invest_fishery_tt:0 "§YInvest in fisheries§! here (the amount picked above)\nThe money expands this sector: more jobs and higher wages, which draw people to the province. How much property it buys depends on the local prices of what the sector needs to grow; it starts to apply next year.\n\n§RPart of it is lost§! to the local elites, the more the higher provincial corruption. Too much investment grows a sector quickly but can make it unprofitable and slows construction in the province."
 mtui_bw_invest_commercial_tt:0 "§YInvest in commerce§! here (the amount picked above)\nThe money expands this sector: more jobs and higher wages, which draw people to the province. How much property it buys depends on the local prices of what the sector needs to grow; it starts to apply next year.\n\n§RPart of it is lost§! to the local elites, the more the higher provincial corruption. Too much investment grows a sector quickly but can make it unprofitable and slows construction in the province."
 mtui_bw_invest_industrial_tt:0 "§YInvest in industry§! here (the amount picked above)\nThe money expands this sector: more jobs and higher wages, which draw people to the province. How much property it buys depends on the local prices of what the sector needs to grow; it starts to apply next year.\n\n§RPart of it is lost§! to the local elites, the more the higher provincial corruption. Too much investment grows a sector quickly but can make it unprofitable and slows construction in the province."
 mtui_bw_select_area_tt:0 "§YPin all our provinces in this area§!\nIf this province is already pinned, unpins them instead."
 mtui_bw_select_region_tt:0 "§YPin all our provinces in this region§!\nIf this province is already pinned, unpins them instead."
 mtui_bw_select_states_tt:0 "§YPin all our provinces in states§!\nIf this province is already pinned, unpins them instead."
 mtui_bw_select_all_tt:0 "§YPin all our provinces§!\nIf this province is already pinned, unpins them instead."
 mtui_bw_unpin_all_tt:0 "§YUnpin all provinces§! (shortcut: G)"
 mtui_bw_missionaries_tt:0 "§YSend missionaries§! to every pinned province\nConverts minorities or the whole province. At 50% our religion is the majority and religious unity no longer suffers; 90% is needed to remove the autonomy penalty of minorities.\n§gAlso pins this province.§!"
 mtui_bw_infra_maint_tt:0 "§YInfrastructure maintenance§! for every pinned province\nHow much of the upkeep of amenities, pathing, harbours and other infrastructure the state pays. Not required, but it prevents decay where the local population cannot bear the costs.\n§gAlso pins this province.§!"
 mtui_bw_open_slots_tt:0 "§YOpen new industries§! in every pinned province (at most 16 different industries per province).\n§gAlso pins this province.§!"
 mtui_bw_close_slots_tt:0 "§YClose industries§! in every pinned province.\n§gAlso pins this province.§!"
